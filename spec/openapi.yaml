                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                      segments:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: avery.chen@example.com
                  firstName: Avery
                  lastName: Chen
                  tags:
