      tags:
        - Promotions
      summary: Review a promotion purchase
      description: |-
        The publisher's review decision on a pending purchase: approve it, reject it, or request
        changes from the advertiser. `feedback` is required when rejecting or requesting changes, so
        the buyer knows why. A purchase's payment status is never editable here.

        `v3` endpoints expect a company API key.
      operationId: reviewPromotionPurchase
      parameters:
        - name: purchaseUniqueId
          in: path
          description: UUID of the purchase to review
          required: true
          schema:
            type: string
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: '`approved` | `rejected` | `changesRequested`'
                feedback:
                  type: string
                  description: Required when `status` is `rejected` or `changesRequested`. Max 2000
                    characters.
              required:
                - status
            example:
              status: rejected
              feedback: The creative image is below our minimum resolution requirement.
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
