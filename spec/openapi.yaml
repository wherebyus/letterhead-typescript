                            type: number
                            description: 'Currently fixed at: 0.1.'
                      notableChanges:
                        type: array
                        items:
                          type: object
                          properties:
                            channelName:
                              type: string
                            metric:
                              type: string
                              description: 'A metric label, e.g. `new-subscribers`, `open-rate`, or
                                `click-rate`.'
                            currentValue:
                              type: number
                            comparisonValue:
                              type: number
                            percentChange:
                              type: number
                            tone:
                              type: string
                              description: Reflects the direction of the change.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  sendOperations:
                    monthSends: 24
                    staleDrafts: 3
                    staleDraftThresholdDays: 5
                  deliverability:
                    highBounceNewsletters: 1
                    bounceThresholdPct: 2.0
                    topHighBounce:
                      - channelName: An Example Newsletter
                        bounceRatePct: 3.4
                    spamComplaintRatePct: 0.02
                    spamComplaintThresholdPct: 0.1
                  notableChanges:
                    - channelName: An Example Newsletter
                      metric: open-rate
                      currentValue: 0.42
                      comparisonValue: 0.35
                      percentChange: 20.0
                      tone: positive
                message: Operational pulse retrieved successfully.
                total: 1
