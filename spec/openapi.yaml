      operationId: applyTagsToContactsMatchingAFilterSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                tagsToApply:
                  type: array
                  items:
                    type: string
                  description: 1 or more tag names to apply.
                query:
                  type: string
                channels:
                  type: array
                  items:
                    type: integer
                statuses:
                  type: array
                  items:
                    type: integer
                tags:
                  type: array
                  items:
                    type: string
                  description: Filter to contacts already carrying these tags (not to be confused
                    with `tagsToApply`).
                untagged:
                  type: boolean
                emails:
                  type: array
                  items:
                    type: string
                  description: Optional allow-list — when present, only these emails (still narrowed
                    by any other filters) are tagged.
