          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      total:
                        type: integer
                      totalActive:
                        type: integer
                      totalError:
                        type: integer
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  total: 14
                  totalActive: 12
                  totalError: 2
                message: Feed health summary fetched successfully.
                total: 0
