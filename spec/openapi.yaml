  /api/v3/metrics/portfolio-health:
    get:
      tags:
        - Metrics
      summary: Get portfolio health
      description: |-
        The latest per-channel growth snapshot for every channel under your company: subscriber
        counts, 30-day net growth, cleaned count, an engagement-tier breakdown (loyalists,
        newAndEngaged, casual, fading, ghosts), a single-newsletter-subscriber count, and an
        overall `health` label (`growing`, `stable`, or `needsAttention`). Backs the goals page's
        Portfolio Health and Top Performers cards. Snapshots are refreshed at most once an hour.

        `v3` endpoints expect a company API key.
      operationId: getPortfolioHealth
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Get portfolio health
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        brandSlug:
                          type: string
                        brandName:
                          type: string
                        channel:
                          type: string
                        channelName:
                          type: string
                        totalSubscribers:
                          type: integer
                        newSubscribers:
                          type: integer
                        unsubscribes:
                          type: integer
                        netGrowth:
                          type: integer
                          description: Change in total subscribers over the trailing 30 days.
                        totalCleaned:
                          type: integer
                        loyalistsCount:
                          type: integer
                        newAndEngagedCount:
                          type: integer
                        casualCount:
                          type: integer
                        fadingCount:
                          type: integer
                        ghostsCount:
                          type: integer
                        singleNewsletterCount:
                          type: integer
                        health:
                          type: string
                          description: '`growing`, `stable`, or `needsAttention`.'
                        senderHealth:
                          type: object
                          description: Present only when a sender health score has been computed for this
                            channel; omitted (not null) otherwise.
                          properties:
                            score:
                              type: integer
                              nullable: true
                            severity:
                              type: string
                            trend:
                              type: string
                  message:
                    type: string
                  total:
                    type: integer
