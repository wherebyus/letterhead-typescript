              tagsToApply:
                - engaged-readers
              query: newsletter fan
              statuses:
                - 1
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      matched:
                        type: integer
                        description: Contacts matching the filter.
                      updated:
                        type: integer
                        description: Contacts the tags were actually added to.
                  message:
                    type: string
                  total:
                    type: integer
              example:
