          type: string
  /api/v3/contacts/{email}/consents:
    get:
      tags:
        - Contacts
      summary: Get a contact's consent state
      description: |-
        Returns a contact's full notification consent state on its own, without the rest of the contact profile — the same three sections carried on the full contact response (`GET /api/v3/contacts/{email}`), assembled here for a caller that only needs consent data: `endpoints` (the address registry — masked addresses, verification and invalidation timestamps), `channelConsents` (channel-scoped opt-ins), and `consents` (medium-level revocations, `channel: null` for a company-wide one).

        This read is deliberately unrestricted — it's available regardless of whether notification-platform writes are enabled for your tenant.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getAContactsConsentState
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      endpoints:
                        type: array
                        items:
                          type: object
                          properties:
                            medium:
                              type: string
                            address:
                              type: string
                              description: Masked — the leading `+` and first two digits, elided
                                middle digits, last two digits.
                            countryCode:
                              type: string
                            verifiedAt:
                              type: string
                              nullable: true
                            invalidatedAt:
                              type: string
                              nullable: true
                            source:
                              type: string
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                      channelConsents:
                        type: array
                        items:
                          type: object
                          properties:
                            channel:
                              type: string
                            medium:
                              type: string
                            status:
                              type: string
                            method:
                              type: string
                            occurredAt:
                              type: string
                      consents:
                        type: array
                        items:
                          type: object
                          properties:
                            channel:
                              type: string
                              nullable: true
                              description: 'Null for a company-wide revocation.'
                            medium:
                              type: string
                            status:
                              type: string
                            method:
                              type: string
                            source:
                              type: string
                              nullable: true
                            occurredAt:
                              type: string
                            updatedAt:
                              type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  endpoints:
                    - medium: sms
                      address: +1•••••••00
                      countryCode: US
                      verifiedAt: '2026-06-01T12:00:00+00:00'
                      invalidatedAt: null
                      source: manual
                      createdAt: '2026-06-01T12:00:00+00:00'
                      updatedAt: '2026-06-01T12:00:00+00:00'
                  channelConsents:
                    - channel: weekly-digest
                      medium: sms
                      status: opted_in
                      method: double_opt_in
                      occurredAt: '2026-06-01T12:00:00+00:00'
                  consents: []
                message: Consent state retrieved.
                total: 1
    parameters:
      - name: email
        in: path
        required: true
        description: The contact's email address, URL-encoded.
        schema:
          type: string
  /api/v3/contacts/{email}/subscriptions:
    post:
      tags:
        - Contacts
      summary: Create a subscription
      description: |-
        Subscribes the contact to a channel. Requires `status` and either `channel` (a channel slug) or `channelId` (the channel's numeric id, a legacy alternative — `channel` takes precedence when both are supplied).
      operationId: createASubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                channel:
                  type: string
                  description: A channel slug. Required unless `channelId` is supplied.
                channelId:
                  type: integer
                  description: A channel's numeric id (legacy alternative to `channel`).
                status:
                  type: integer
              required:
                - status
            example:
              api: true
              channel: annas-channel
