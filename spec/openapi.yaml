  /api/v3/curations/data-feeds:
    get:
      tags:
        - Curations
      summary: List data feeds
      description: |-
        Returns a paginated list of the company's JSON data feeds — feeds that map fields from a JSON
        endpoint onto curations, as an alternative to RSS. For RSS feeds, see **List curation feeds**.
      operationId: listDataFeeds
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
        - name: keyword
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyFeed'
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: feed_data_2k9x
                    title: Vendor product catalog
                    description: Nightly product export from our commerce platform.
                    feedUrl: https://example.com/api/products.json
                    type: 1
                    isValid: true
                    validationCode: 200
                    crawl: false
                    archiveIntervalDays: 1
                    channelName: The Weekly Brew
                    channelSlug: the-weekly-brew
                    sharedChannelIds:
                      - 54212
                    authType: 1
                    hasAuthSecret: true
                    fieldMappings:
                      - source: object.name
                        target: title
                      - source: object.sku
                        target: 'customField:vendor-sku'
                    createdAt: '2026-05-01T09:00:00+00:00'
                    updatedAt: '2026-08-30T09:05:00+00:00'
                message: Data feeds fetched successfully.
                total: 1
    post:
      tags:
        - Curations
      summary: Create a data feed
      description: |-
        Create a company-level JSON data feed: a JSON endpoint plus a set of field mappings that turn
        each item it returns into a curation. Letterhead fetches it immediately after creation.

        Every entry in `fieldMappings` needs a `source` (a dot path into a feed item's JSON, e.g.
        `object.id`) and a `target` — either a standard curation field (`title`, `excerpt`, `content`,
        `url`, `image`, `imageAlt`, `imageCaption`, `author`, `siteName`, `publicationDate`) or a custom
        field reference in the form `customField:<key>` (see **List curation custom fields**). `url`,
        `title`, and `excerpt` must all be mapped.
      operationId: createADataFeed
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - feedUrl
                - archiveIntervalDays
                - fieldMappings
                - authType
              properties:
                title:
                  type: string
                  maxLength: 140
                description:
                  type: string
                  maxLength: 280
                feedUrl:
                  type: string
                archiveIntervalDays:
                  type: integer
                  description: How often, in days, to re-fetch the feed (1–31).
                tags:
                  type: array
                  items:
                    type: string
                channels:
                  type: array
                  items:
                    type: integer
                  description: Internal numeric channel identifiers to share this feed with.
                fieldMappings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - source
                      - target
                    properties:
                      source:
                        type: string
                      target:
                        type: string
                authType:
                  type: integer
                  description: '`0` — no authentication. `1` — bearer token, supplied via `bearerToken`.'
                bearerToken:
                  type: string
                  description: Plaintext on the way in, stored encrypted. Required when `authType` is `1`.
            example:
              title: Vendor product catalog
              description: Nightly product export from our commerce platform.
              feedUrl: https://example.com/api/products.json
              archiveIntervalDays: 1
              authType: 0
              fieldMappings:
                - source: object.name
                  target: title
                - source: object.description
                  target: excerpt
                - source: object.url
                  target: url
      responses:
        '201':
          description: Data feed created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/CompanyFeed'
                  message:
                    type: string
                  total:
                    type: integer
  /api/v3/curations/data-feeds/preview:
    post:
      tags:
        - Curations
      summary: Preview a data feed URL
      description: |-
        Test-fetch a JSON data feed URL before saving it: returns how many items it contains and, for the
        first item, every flattened field path with a sample value — so a caller can build `fieldMappings`
        for **Create a data feed** without guessing at the JSON shape.
      operationId: previewADataFeedUrl
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feedUrl
              properties:
                feedUrl:
                  type: string
                bearerToken:
                  type: string
                  description: Plaintext, used only for this one test fetch — not stored.
            example:
              feedUrl: https://example.com/api/products.json
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      itemCount:
                        type: integer
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            sample:
                              type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  itemCount: 214
                  fields:
                    - path: object.name
                      sample: Espresso Blend, 12oz
                    - path: object.sku
                      sample: ESP-12OZ
                message: Data feed preview fetched.
                total: 1
  /api/v3/curations/data-feeds/{feedUniqueId}/preview:
    parameters:
      - name: feedUniqueId
        in: path
