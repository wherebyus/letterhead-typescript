  /api/v3/contacts/segments/criteria/count:
    post:
      tags:
        - Segments
      summary: Count contacts matching a set of criteria
      description: |-
        Returns how many contacts a set of criteria would reach, without saving it as a segment — the same criteria shape **Create a segment** accepts. Useful for checking a distance, a threshold, or any other condition against a real number before deciding whether to save it.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.

        ## Response

        `200 OK` with an empty `items` array. The match count is returned in the response envelope's `total`, not in `items`.
      operationId: countSegmentCriteria
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                criteria:
                  type: object
                  properties:
                    matchMode:
                      type: string
                      description: '`all` (AND the conditions) or `any` (OR the conditions).'
                    conditions:
                      type: array
                      description: At least one condition — same shapes as **Create a segment**'s `criteria.conditions[]`.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: "The condition's discriminator — one of the type values documented on **Create a segment**'s `criteria.conditions[]` (e.g. `customField`, `tag`, `subscription`, `text`, `geoRadius`, ...). The remaining properties on each condition vary by this value; see that operation for the full per-type shapes."
                        required:
                          - type
                    suppressionSegmentIds:
                      type: array
                      items:
                        type: integer
                      description: IDs of other segments (same company) whose members are excluded from
                        the count.
                  required:
                    - matchMode
                    - conditions
                  description: The criteria to evaluate. Not persisted.
                channel:
                  type: string
                  description: Count only contacts subscribed to the given channel identifier (slug). Omit
                    for the full company audience.
              required:
                - criteria
            example:
              criteria:
                matchMode: all
                conditions:
                  - type: geoRadius
                    latitude: 40.7128
                    longitude: -74.006
                    distanceMiles: 50
                suppressionSegmentIds: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {}
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: []
                message: Criteria count retrieved.
                total: 4213
  /api/v3/contacts/segments/location-coverage:
    get:
      tags:
        - Segments
      summary: Get how much of your audience has a known location
      description: |-
        Returns what share of your contacts Letterhead has a derived location for — the figure the segment builder shows beside a distance-of-a-location condition, so a thin `geoRadius` segment is explainable rather than looking broken.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getSegmentLocationCoverage
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Narrow the figure to contacts subscribed to the given channel identifier (slug).
            Omit for the full company audience.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      contactsWithKnownLocation:
                        type: integer
                        description: How many contacts have a derived location.
                      totalContacts:
                        type: integer
                        description: Total contacts considered.
                      coverageRate:
                        type: number
                        description: contactsWithKnownLocation divided by totalContacts, as a fraction (0
                          when totalContacts is 0).
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  contactsWithKnownLocation: 8420
                  totalContacts: 14285
                  coverageRate: 0.5895
                message: Location coverage retrieved.
                total: 1
  /api/v3/contacts/imports:
