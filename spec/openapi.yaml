  /api/v3/contacts/{email}:
    get:
      tags:
        - Contacts
      summary: Get a contact
      description: |-
        Returns a single company-level contact's full profile — name, tags, custom fields, notification endpoints and consents, subscriptions, and the segments they currently belong to.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.

        ## Channel-scoped reads

        Pass `channel` (a channel slug) to narrow the response to one newsletter: `segments` lists only
        the segments available on that channel instead of every segment in the company, and the request
        returns `404` if the contact has no subscription on the named channel. `channel` also returns
        `404` if the slug doesn't match any channel in your company, or `403` if it names a channel
        another company owns. Omit `channel` for the company-wide view, which always returns the contact
        if they exist.
      operationId: getAContact
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Narrow the response to a single newsletter, by channel slug. Returns `404` if the
            contact has no subscription on that channel, if the slug doesn't match a channel in your
            company, or `403` if it names another company's channel. Omit for the company-wide view.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      customFields:
                        type: object
                        properties:
                          __lh.engagementRefreshedAt:
                            type: string
                          __lh.mailboxProvider:
                            type: string
                          __lh.roleAddress:
                            type: boolean
                          referralSource:
                            type: string
                          lastOpenDate:
                            type: string
                          optInTime:
                            type: string
                      endpoints:
                        type: array
                        items:
                          type: object
                      channelConsents:
                        type: array
                        items:
                          type: object
                      consents:
                        type: array
                        items:
                          type: object
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      subscriptions:
                        type: array
                        items:
                          type: object
                          properties:
