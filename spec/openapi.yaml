  /api/v3/promotions:
    get:
      tags:
        - Promotions
      summary: List promotions
      description: |-
        List promotions for the authenticated company, with filtering, sorting, and pagination.

        `v3` endpoints expect a company API key.

        ## Response field naming note

        The list response uses `image` and `position` for two fields that the **Get a promotion** endpoint exposes as `imageUrl` and `zone`. Same data, different keys — this is a legacy inconsistency in the API. Treat them as aliases. The same applies to `promotionCampaignUid` (list) vs the campaign-uid embedded in the show response.
      operationId: listPromotions
      parameters:
        - name: api
          in: query
          description: When set to `true`, the endpoint accepts authorization with your API Key.
          required: true
          schema:
            type: boolean
        - name: page
          in: query
          description: 1-indexed page number. Defaults to `1`.
          required: false
          schema:
            type: integer
        - name: records
          in: query
          description: Records per page (max 100). Defaults to `10`.
          required: false
          schema:
            type: integer
        - name: keyword
          in: query
          description: Search by campaign title or promoter name
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: '`0`=draft, `5`=active, `9`=inactive, `6`=any'
          required: false
          schema:
            type: integer
        - name: sortBy
          in: query
          description: '`createdAt` | `title` | `status` | `promoterDisplayName`. Defaults to `createdAt`.'
          required: false
          schema:
            type: string
        - name: direction
          in: query
          description: '`asc` or `desc`. Defaults to `desc`.'
          required: false
          schema:
            type: string
        - name: channels[]
          in: query
          description: Filter by channel slug(s)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: promoters[]
          in: query
          description: Filter by promoter name(s)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: from
          in: query
          description: Y-m-d, inclusive lower bound on `dates`
          required: false
          schema:
            type: string
        - name: to
          in: query
          description: Y-m-d, inclusive upper bound on `dates` (must be ≥ `from`)
          required: false
          schema:
            type: string
        - name: metrics
          in: query
          description: When `true`, items include `clicks` and `impressions`. Defaults to `false`.
          required: false
          schema:
            type: boolean
        - name: mjml
          in: query
          description: When `true`, items include rendered MJML. Defaults to `false`.
          required: false
          schema:
            type: boolean
        - name: html
          in: query
          description: Accepted for compatibility with other promotion endpoints, but currently has no
            effect on this response — no item ever carries a separate `html` field; the `mjml` field is
            the only rendered-content field this endpoint returns. Defaults to `false`.
          required: false
          schema:
            type: boolean
        - name: resolveContent
          in: query
          description: Accepted for compatibility with other promotion endpoints, but currently has no
            effect on this response — this endpoint's items never expose resolved passthrough links.
            Defaults to `false`.
          required: false
          schema:
            type: boolean
        - name: esp
          in: query
          description: ESP id used to render MJML/HTML (only relevant when `mjml=true`). Defaults to `0`
            (Letterhead's own ESP).
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        promotionCollateralUid:
                          type: string
                        campaignTitle:
                          type: string
                        promoter:
                          type: string
                        createdAt:
                          type: string
                        nextDate:
                          type: string
                        isActive:
                          type: boolean
                        isInactive:
                          type: boolean
                        isEvergreen:
                          type: boolean
                        position:
                          type: string
                        promotionCampaignUid:
                          type: string
                        image:
                          type: string
                        imageWidth:
                          type: integer
                        imageHeight:
                          type: integer
                        impressions:
                          type: integer
                        clicks:
                          type: integer
                        mjml:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  totalInPage:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
              example:
                items:
                  - promotionCollateralUid: b2c3d4e5f6
                    campaignTitle: Summer Sale 2026
                    promoter: Example Brand
                    createdAt: '2026-06-04 17:30:00'
                    nextDate: '2026-07-01'
                    isActive: true
                    isInactive: false
                    isEvergreen: false
                    position: A
                    promotionCampaignUid: a1b2c3d4e5
                    image: https://cdn.example.com/summer-sale.png
                    imageWidth: 600
                    imageHeight: 400
                    impressions: 0
                    clicks: 0
                    mjml: null
                total: 47
                totalInPage: 10
                page: 1
                limit: 10
                totalPages: 5
    post:
      tags:
        - Promotions
      summary: Create a promotion
      description: |-
        Create a new promotional campaign on the company. The campaign lands ready for the scheduled `dates` (or evergreen if `isEvergreen: true`).

        `v3` endpoints expect a company API key. The Bearer token is auto-detected as an API key when its shape isn't a JWT, so callers don't need any extra flag — sending the `"api": true` field in the body is supported for consistency with the rest of the Letterhead API but optional for this endpoint specifically.
      operationId: createAPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: '`true` for API-key auth. Auto-detected from the token shape.'
                campaignTitle:
                  type: string
                  description: Internal name of the campaign
                channels:
                  type: array
                  items:
                    type: string
                  description: 'Slugs of channels to scope to. `null`/omitted means all channels. Required
                    when `allChannels: false` is sent explicitly.'
                headline:
                  type: string
                  description: Display headline of the ad
                contentText:
                  type: string
                  description: Body copy
                imageUrl:
                  type: string
                  description: Publicly accessible image URL
                imageAlternativeText:
                  type: string
                  description: Alt text for accessibility
                promotionLink:
                  type: string
                  description: Click-through destination. Must be `http(s)`. Ad-server macros (`${GDPR}`,
                    `${GDPR_CONSENT_755}`) and merge-tag placeholders (`{{ profileFieldName }}`) are allowed
                    and pass through unmodified.
                promoter:
                  type: string
                  description: Display name of the advertiser
                dates:
                  type: array
                  items:
                    type: string
                  description: 'Y-m-d dates when the promotion runs. Ignored at send time if `isEvergreen:
                    true`.'
                isActive:
                  type: boolean
                  description: '`true` = scheduled/live, `false` = draft'
                isEvergreen:
                  type: boolean
                  description: '`true` = always runs, `dates` are ignored at send time'
                zone:
                  type: string
                  description: 'Template position. One of `A`, `B`, `C`, `D`, `E`, `F`, `G`, `H`, `I`,
                    `J`. Required unless `autoInject: true` is sent — there is no default, and omitting
                    it without `autoInject` returns a 422 validation error.'
                type:
                  type: integer
                  description: 'Template type: `1`=Text only, `2`=Text & Image, `4`=Banner, `7`=HTML'
                autoInject:
                  type: boolean
                  description: 'When `true`, the promotion is auto-placed into every send at
                    `autoInjectPosition` instead of a manually-chosen `zone`. When `true`, `zone` may be
                    omitted but `autoInjectPosition` becomes required. Defaults to `false` (manual
                    placement via `zone`).'
                autoInjectPosition:
                  type: integer
                  description: '0-100 placement position, required when `autoInject: true`. Ignored for
                    manual (non-auto-inject) promotions.'
              required:
                - campaignTitle
                - isActive
                - type
            example:
              api: true
              campaignTitle: Summer Sale 2026
              channels:
                - an-example-channel
              headline: 50% off summer collection
              contentText: Limited-time offer on all summer items.
              imageUrl: https://cdn.example.com/summer-sale.png
              imageAlternativeText: Summer sale banner
              promotionLink: https://example.com/summer-sale
              promoter: Example Brand
              dates:
                - '2026-07-01'
                - '2026-07-08'
                - '2026-07-15'
              isActive: true
              isEvergreen: false
              zone: A
              type: 2
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      promotionCollateralUid:
                        type: string
                      campaignTitle:
                        type: string
                      channels:
                        type: array
                        items:
                          type: string
                      allChannels:
                        type: boolean
                      headline:
                        type: string
                      contentText:
                        type: string
                      imageUrl:
                        type: string
                      imageAlternativeText:
                        type: string
                      imageWidth:
                        type: integer
                      imageHeight:
                        type: integer
                      promotionLink:
                        type: string
                      promoter:
                        type: string
                      promotionServiceProviderId:
                        type: integer
                      dates:
                        type: array
                        items:
                          type: object
                      isActive:
                        type: boolean
                      isInactive:
                        type: boolean
                      isEvergreen:
                        type: boolean
                      embedClicks:
                        type: integer
                      zone:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  promotionCollateralUid: b2c3d4e5f6
                  campaignTitle: Summer Sale 2026
                  channels:
                    - news-daily
                  allChannels: false
                  headline: 50% off summer collection
                  contentText: ''
                  imageUrl: ''
                  imageAlternativeText: ''
                  imageWidth: 0
                  imageHeight: 0
                  promotionLink: ''
                  promoter: ''
                  promotionServiceProviderId: 0
                  dates: []
                  isActive: true
                  isInactive: false
                  isEvergreen: false
                  embedClicks: 0
                  zone: A
                  type: 2
                  createdAt: '2026-06-04 17:30:00'
                  updatedAt: '2026-06-04 17:30:00'
                message: Promotion created successfully
                total: 1
        '400':
          description: 400 Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - The campaign title field is required.
                  - The zone field is required.
                message: Invalid request data
                total: 0
  /api/v3/promotions/{promotionCollateralUid}:
    delete:
      tags:
        - Promotions
      summary: Delete a promotion
      description: |-
        Delete a promotion. This is a soft delete — the promotion is marked deleted and stops appearing
        in list/get responses, but its record is retained rather than removed. Returns no content on
        success.

        `v3` endpoints expect a company API key.
      operationId: deleteAPromotion
      parameters:
        - name: api
          in: query
          description: When set to `true`, the endpoint accepts authorization with your API Key.
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: 204 No Content
        '404':
          description: 404 Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: []
                message: Promotion not found
