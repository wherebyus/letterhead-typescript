  /api/v3/metrics/audience:
    post:
      tags:
        - Metrics
      summary: Get audience metrics overview
      description: |-
        Company-scoped audience growth totals for a date range: new subscribers, total audience
        members, and unsubscribes, plus a dense daily sparkline and the prior period's totals for
        comparison. Pass `groupBy=channel` to also get a per-channel breakdown.

        `v3` endpoints expect a company API key.
      operationId: getAudienceMetrics
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
                from:
                  type: string
                  description: Period start date (inclusive). The range between `from` and `to` cannot
                    exceed 370 days.
                  example: '2026-02-26'
                to:
                  type: string
                  description: Period end date (inclusive), must be >= `from`.
                  example: '2026-03-26'
                channels[]:
                  type: string
                  description: '`string[]` | Optionally filter to a list of channels (by their slugs).'
                  example: an-example-channel
                groupBy:
                  type: string
                  description: Pass `channel` to include a per-channel breakdown.
                  example: channel
                page:
                  type: string
                  description: Page number for the channel breakdown. Defaults to 1.
                  example: '1'
                limit:
                  type: string
                  description: Items per page for the channel breakdown. Max of 50. Defaults to 5.
                  example: '5'
                sortBy:
                  type: string
                  description: Sort the channel breakdown by "subscribers" or "channel." Defaults to
                    "subscribers."
                  example: subscribers
                direction:
                  type: string
                  description: Sort direction for the channel breakdown, "asc" or "desc." Defaults to
                    "desc."
                  example: desc
                includeCleaned:
                  type: string
                  description: Whether cleaned (previously unengaged, then removed) contacts count toward
                    `totalAudienceMembers`. Defaults to `true`.
                  example: 'true'
              required:
                - api
                - from
                - to
      responses:
