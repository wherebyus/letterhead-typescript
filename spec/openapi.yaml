          in: query
          description: 1-indexed page number. Defaults to `1`.
          required: false
          schema:
            type: integer
        - name: records
          in: query
          description: Records per page (max 100). Defaults to `10`.
          required: false
          schema:
            type: integer
        - name: sortBy
          in: query
          description: '`createdAt` | `price` | `availableFrom` | `status` | `title`. Defaults to
            `createdAt`.'
