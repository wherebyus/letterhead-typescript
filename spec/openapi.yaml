  /api/v3/letters:
    get:
      tags:
        - Letters
      summary: List all letters
      description: |-
        List the company's letters, most-recently-updated first, with pagination and filtering.

        This returns letters from across your **entire company**, rather than from a single newsletter.

        **Channel scope.** With no channel filter, this endpoint returns the company's templates, which are the only types of letter that are available across a company. To list real published/sent newsletters — which live on the company's individual channels — pass one of:

        - `allChannels=true` — return letters across **every** channel the company owns.

        - `channels[]` — a repeatable array of channel slugs to restrict results to **specific** channels.


        If both are supplied, the explicit `channels[]` list is honored.

        **Response.** A paginated envelope: `items` holds the array of letters and `total` is the count of matching letters (there is no `message` field on this endpoint). Each letter includes fields such as `uniqueId`, `title`, `subtitle`, `publicationDate`, `publicationStatus`, `segmentName`, `channelSlug`, and `channelName` — the full letter object has many more fields than shown here. To fetch a single letter's fully rendered HTML (`emailTemplate`), take a `uniqueId` from this list and call **Retrieve a letter by its uniqueId**.

        **Tip.** Combine `status`, `keyword`, `orderBy`, and paging to page through large audiences efficiently — assume the list can be long and request one page at a time.
      operationId: listAllLetters
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (generated
            under a company's administrative settings) rather than a logged-in user session. For API integrations
            you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
        - name: status
          in: query
          description: '(optional) Filter by publication status code. Common values: `0` draft, `1` published,
            `2` scheduled, `6` any (default), `9` configured template. Omit, or pass `6`, to return letters
            of every status.'
          required: false
          schema:
            type: string
            example: '1'
        - name: page
          in: query
          description: (optional) 1-based page number. Defaults to `1`.
          required: false
          schema:
            type: string
            example: '1'
        - name: limit
          in: query
          description: (optional) Results per page, `1`–`100`. Defaults to `12`.
          required: false
          schema:
            type: string
            example: '12'
        - name: orderBy
          in: query
          description: (optional) Column to sort by, e.g. `updated_at` (default) or `publication_date`.
          required: false
          schema:
            type: string
            example: updated_at
        - name: asc
          in: query
          description: (optional) Sort direction. `true` for ascending, `false` (default) for descending.
          required: false
          schema:
            type: string
            example: 'false'
        - name: keyword
          in: query
          description: (optional) Free-text search across letter title/subject.
          required: false
          schema:
            type: string
        - name: templates
          in: query
          description: (optional) Repeatable `templates[]` array to restrict results to specific template
            types. Leave off to include all.
          required: false
          schema:
            type: string
        - name: channels
          in: query
          description: (optional) Repeatable `channels[]` array of channel slugs. When supplied, the endpoint
            returns real letters across those specific channels (published/sent newsletters, not the company's
            virtual-channel templates). Combine with `status`, `keyword`, and paging as usual.
          required: false
          schema:
            type: string
        - name: allChannels
          in: query
          description: (optional) When `true`, returns real letters across **every** channel the company
            owns (published/sent newsletters, not the company's virtual-channel templates). Mutually redundant
            with `channels[]` — if both are given, the explicit channel list is honored. Accepts `true`/`false`
            (defaults to `false`).
          required: false
          schema:
            type: string
            example: 'true'
        - name: tags
          in: query
          description: (optional) Repeatable `tags[]` array of newsletter-tag `uniqueId` values, restricting
            results to the letters carrying those tags. Get the ids from **List newsletter tags**. Up to 50
            per request, and a letter must carry **every** tag you name — two tags return the letters tagged
            with both, not either. Works the same way on whichever set you are listing — the company's
            templates, the channels in `channels[]`, or everything under `allChannels`.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List all letters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: >-
                        Shown here are the fields most integrators use — the full letter object carries
                        many more.
                      properties:
                        uniqueId:
                          type: string
                        title:
                          type: string
                        subtitle:
                          type: string
                        publicationDate:
                          type: string
                        publicationStatus:
                          type: integer
                        segmentName:
                          type: string
                        channelSlug:
                          type: string
                        channelName:
                          type: string
                        updatedAt:
                          type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: ludctamgd6
                    title: Who doesn't love a good movie?
                    subtitle: A new exhibition, two openings, and a closer look at this season's residency.
                    publicationDate: '2026-05-06 05:53:05'
                    publicationStatus: 1
                    segmentName: Entire audience
                    channelSlug: an-example-channel
                    channelName: An Example Channel
                    updatedAt: '2026-05-06 05:53:05'
                  - uniqueId: 9plmk2xqta
                    title: This week at the museum
                    subtitle: Members-only hours return.
                    publicationDate: '2026-04-29 05:53:05'
                    publicationStatus: 1
                    segmentName: Members
                    channelSlug: an-example-channel
                    channelName: An Example Channel
                    updatedAt: '2026-04-29 05:53:05'
                total: 2
    post:
      tags:
        - Letters
      summary: Create a letter
      description: |-
        Create a new company letter — a template, ready to configure and eventually publish to a channel.

        **Two ways to create one:**

        - Omit `html` to create a blank company template, the same starting point as clicking "New" in
          the composer. Edit it afterward with **Update a letter** or the narrower per-field endpoints.
        - Pass `html` to create the letter directly from your own markup instead. A letter created this
          way is not editable in our visual composer — you continue to manage its content by sending
          updated HTML.

        The new letter always starts as a company-level template, not yet attached to a channel or
        scheduled. Use **Clone a letter** to move a copy onto a channel, then **Update a letter** to
        configure it for sending.
      operationId: createALetter
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (generated
            under a company's administrative settings) rather than a logged-in user session. For API integrations
            you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                html:
                  type: string
                  description: (optional) Raw HTML to seed the letter's content. Omit to create a blank
                    template instead.
                esp:
                  type: integer
                  description: (optional, advanced) The sending integration to create the letter under, for
                    companies with more than one connected ESP. Defaults to Letterhead's own sending
                    integration if omitted.
            example: {}
      responses:
        '201':
          description: Letter created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: >-
                      The new letter. Shown here are the fields most integrators use — the full letter
                      object carries many more.
                    properties:
                      uniqueId:
                        type: string
                      title:
                        type: string
                      subtitle:
                        type: string
                      publicationStatus:
                        type: integer
                      channelSlug:
                        type: string
                        nullable: true
                      channelName:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: p3nx8y2qka
                  title: ''
                  subtitle: ''
                  publicationStatus: 3
                  channelSlug: null
                  channelName: null
                  createdAt: '2026-08-31 09:12:00'
                  updatedAt: '2026-08-31 09:12:00'
                message: Company letter created.
                total: 10
  /api/v3/letters/actions/draft:
    post:
      tags:
        - Letters
      summary: Create a draft
      description: |-
        Creates a draft letter from the `HTML` you provide. This creates a letter in your channel that is ready to test, schedule, and send. Note that because you are providing your own HTML, you will not be able to edit this edition with our composer.

        The response's `publicationStatus` is always `7` for a letter created
        this way — the same status used for a letter that already has its
        content and audience set and is just waiting on a manual send. That's
        expected, not an error: it's a different status from `0`, which is
        reserved for an empty, composer-editable draft (created through a
        separate, composer-internal flow this endpoint does not use) and
        isn't a value this endpoint returns.


        - `api`: Boolean flag indicating the request is being made via the API.

        - `channel`: Channel slug to associate the draft with.

        - `html`: Full HTML content for the letter body.

        - `segment`: Segment identifier to target a subset of the channel audience; `0` applies to all subscribers.

        - `subject`: Draft subject/title.

        - `suppress` (optional): Array of channel slugs used to suppress recipients who are also subscribed to those channels.

        - `subtitle` (optional): Populates the email preview text shown in inbox previews after the subject, so the Letterhead UI only needs the send date filled in. Max 191 chars.

        - `tags` (optional): Newsletter tags applied to the created draft. Use this to label a send with your own internal identifier; tags are reused across sends and listed under `GET /api/v3/letters/tags`. Max 20 items, each ≤ 60 chars. Names are trimmed and deduped case-insensitively.
      operationId: createADraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                channel:
                  type: string
                  description: The channel you are targeting.
                html:
                  type: string
                  description: This endpoint is designed for you to use your own HTML.
                segment:
                  type: integer
                  description: Identify a specific subset of your channel's list. Pass `0` to send to
                    every subscriber.
                subject:
                  type: string
                subtitle:
                  type: string
                  description: (optional) Email preview text shown in inbox previews after the subject.
                    Max 191 chars.
                tags:
                  type: array
                  items:
                    type: string
                  description: (optional) Newsletter tags applied to the created letter. Max 20 items,
                    each ≤ 60 chars. Names are trimmed and deduped case-insensitively.
                suppress:
                  type: array
                  items:
                    type: string
                  description: (optional) An array of channel identifiers (slugs), to suppress sending
                    to anyone on "an-example-channel" who is also subscribed to one or more of the channels
                    passed here.
            example:
              api: true
              channel: an-example-channel
              html: <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Test</title></head><body><h1>Hello
                from Postman</h1><p>This is a test letter sent via the <strong>/api/v3/letters/actions/send</strong>
                endpoint.</p><p><a href="https://letterhead.co">Visit Letterhead</a></p></body></html>
              segment: 0
              subject: Who doesn't love a good movie?
              subtitle: A new exhibition, two openings, and a closer look at this season's residency.
              tags:
                - an-excellent-tag
              suppress:
