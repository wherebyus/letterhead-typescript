                  total:
                    type: integer
              example:
                items: null
                message: Promotion purchase rejected successfully
                total: 1
  /api/v3/channels:
    get:
      tags:
        - Channels
      summary: List channels
      description: |-
        List every channel (newsletter) your company owns, each with its brand, slug, title, and logos.
        Optionally restrict the list to channels eligible for a given ESP.

        ## A note on this response

        Unlike most other `v3` list endpoints, each item here includes the channel's and its brand's
        internal numeric ids (`channelId`, `brandId`) alongside the usual slugs. This reference documents
        the response as the API actually returns it today.

        `v3` endpoints expect a company API key.
      operationId: listChannels
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: esp
          in: query
          description: 'Optional. Restrict the list to channels eligible for this ESP: `1`=Mailchimp,
            `2`=Iterable, `3`=SendGrid, `4`=Sailthru, `5`=Constant Contact, `7`=HubSpot Marketing. If no
            channel matches, every channel is returned instead of an empty list.'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        brandId:
                          type: integer
                        brandName:
                          type: string
                        brandSlug:
                          type: string
                        channelId:
                          type: integer
                        channelDescription:
                          type: string
                        channelHorizontalLogo:
                          type: string
                        channelImage:
                          type: string
                        channelSlug:
                          type: string
                        channelSquareLogo:
                          type: string
                        title:
                          type: string
                        hasMatchingEspIntegration:
                          type: boolean
                          description: '`true` when the channel has an active integration for the
                            requested `esp`. Always `true` when `esp` is omitted.'
                  message:
                    type: string
                  total:
                    type: integer
                  isCompanyAdmin:
                    type: boolean
              example:
                items:
                  - brandId: 42
                    brandName: Example Brand
                    brandSlug: example-brand
                    channelId: 101
                    channelDescription: A brand new channel
                    channelHorizontalLogo: ''
                    channelImage: ''
                    channelSlug: an-example-channel
                    channelSquareLogo: ''
                    title: An Example Channel
                    hasMatchingEspIntegration: true
                message: Channels retrieved successfully.
                total: 1
                isCompanyAdmin: true
    post:
      tags:
        - Channels
      summary: Create an SMS channel
      description: |-
        Create an SMS channel under one of your company's brands. Despite the shared `/channels` path,
        this is not a general-purpose "create a channel" endpoint — it only creates **SMS** channels.
        Email channels are created from the Letterhead app, not the API.

        `websiteUrl` and `phoneNumber` are accepted and validated for the create form, but SMS sender
        provisioning is a separate connection step: only the title, a slug derived from the title, and
        `notes` (stored as the channel's description) are persisted by this call.

        This endpoint is gated behind an internal feature flag that is not yet enabled for any tenant.
        While it's off, the endpoint returns `404 Not Found`.

        `v3` endpoints expect a company API key.
      operationId: createAnSmsChannel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
                brand:
                  type: string
                  description: Slug of the brand to create the channel under.
                title:
                  type: string
                  description: Channel title. Must contain at least one letter or number; also used to
                    derive the channel's slug.
                websiteUrl:
                  type: string
                  description: Optional. Must be a valid URL if present.
                phoneNumber:
                  type: string
                  description: Optional.
                notes:
                  type: string
                  description: Optional, up to 1000 characters. Stored as the channel's description.
              required:
                - api
                - brand
                - title
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                      title:
                        type: string
                      type:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  channel: an-example-sms-channel
                  title: An Example SMS Channel
                  type: sms
                message: SMS channel created successfully.
                total: 0
        '404':
          description: 404 Not Found — the feature isn't enabled for this tenant, or `brand` doesn't
            match a brand this company owns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data: []
                items: []
                message: Channel management is not enabled.
                total: 0
        '422':
          description: 422 Unprocessable Entity — `title` reduces to an empty slug (for example,
            punctuation only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data: []
                items: []
                message: Channel title must contain at least one letter or number.
                total: 0
