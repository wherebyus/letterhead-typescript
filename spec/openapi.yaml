  /api/v3/contacts/keyed/{contactKey}:
    get:
      tags:
        - Contacts
      summary: Get a contact by contact key
      description: |-
        Same as **Get a contact** (`GET /api/v3/contacts/{email}`), with the contact addressed by its opaque `contactKey` instead of its email address. `contactKey` is the contact's identifier on every v3 response (the `contactKey` field you get back from **Browse contacts** or **Search contacts**) — this is the only way to address a contact that has no email address, such as a phone-only contact.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token. Accepts the same optional `channel` query parameter as **Get a contact**, including its `404`/`403` cases.
      operationId: getAContactByKey
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Narrow the response to a single newsletter, by channel slug. Returns `404` if the
            contact has no subscription on that channel, if the slug doesn't match a channel in your
            company, or `403` if it names another company's channel. Omit for the company-wide view.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK. Same shape as `GET /api/v3/contacts/{email}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The contact. Full field list under `GET /api/v3/contacts/{email}`.
                  message:
                    type: string
                  total:
                    type: integer
        '404':
          description: Either the contact has no subscription on the channel named by `channel`, or
            the slug doesn't match a channel in your company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
    parameters:
      - name: contactKey
        in: path
        required: true
        description: The contact's opaque 64-character hex key (from a prior response's `contactKey`
          field).
        schema:
          type: string
    put:
      tags:
        - Contacts
      summary: Update a contact by contact key
      description: |-
        Same as **Update a contact** (`PUT /api/v3/contacts/{email}`), with the contact addressed by its `contactKey` instead of its email address — the address to use for a contact with no email, such as a phone-only contact.

        This is a company-level (v3) write. Authenticate with a company API key as a Bearer token.
      operationId: updateAContactByKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: The contact's first name.
                lastName:
                  type: string
                  description: The contact's last name.
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to set on the contact.
                customFields:
                  type: object
                  description: Values for your company's custom fields, keyed by field name. See `PUT
                    /api/v3/contacts/{email}` for the full rules.
                channel:
                  type: string
                  description: A channel slug. Scopes the tag-change trigger for tags this update adds;
                    omit for a company-wide edit.
      responses:
        '200':
          description: 200 OK. Same shape as `GET /api/v3/contacts/{email}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The updated contact. Full field list under `GET /api/v3/contacts/{email}`.
                  message:
                    type: string
                  total:
                    type: integer
    delete:
      tags:
        - Contacts
      summary: Delete a contact by contact key
      description: |-
        Same as **Delete a contact** (`DELETE /api/v3/contacts/{email}`), with the contact addressed by its `contactKey` instead of its email address. This cannot be undone.

        This is a company-level (v3) write. Authenticate with a company API key as a Bearer token.
      operationId: deleteAContactByKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
              required:
                - api
            example:
              api: true
      responses:
        '200':
          description: Contact deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {}
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: []
                message: Contact deleted.
                total: 0
