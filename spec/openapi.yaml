  /api/v3/promotions/actions/schedule:
    post:
      tags:
        - Promotions
      summary: Schedule a promotion (public API-key endpoint)
      description: |-
        Create a new promotional campaign, identical in body and response shape to **Create a
        promotion**. This endpoint is built specifically for external tools scheduling promotions via
        the public API: it authenticates with a company API key **only** (never a Passport/JWT session),
        and — unlike other `v3` promotion endpoints — does **not** require the `api=true` query
        parameter, since API-key auth is the only auth this endpoint accepts.
      operationId: schedulePromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignTitle:
                  type: string
                  description: Internal name of the campaign
                channels:
                  type: array
                  items:
                    type: string
                  description: 'Slugs of channels to scope to. `null`/omitted means all channels. Required
                    when `allChannels: false` is sent explicitly.'
                headline:
                  type: string
                  description: Display headline of the ad
                contentText:
                  type: string
                  description: Body copy
                imageUrl:
                  type: string
                  description: Publicly accessible image URL
                imageAlternativeText:
                  type: string
                  description: Alt text for accessibility
                promotionLink:
                  type: string
                  description: Click-through destination. Must be `http(s)`.
                promoter:
                  type: string
                  description: Display name of the advertiser
                dates:
                  type: array
                  items:
                    type: string
                  description: 'Y-m-d dates when the promotion runs. Ignored at send time if `isEvergreen:
                    true`.'
                isActive:
                  type: boolean
                  description: '`true` = scheduled/live, `false` = draft'
                isEvergreen:
                  type: boolean
                  description: '`true` = always runs, `dates` are ignored at send time'
                zone:
                  type: string
                  description: 'Template position. One of `A`, `B`, `C`, `D`, `E`, `F`, `G`, `H`, `I`,
                    `J`. Required unless `autoInject: true` is sent — there is no default, and omitting
                    it without `autoInject` returns a 422 validation error.'
                type:
                  type: integer
                  description: 'Template type: `1`=Text only, `2`=Text & Image, `4`=Banner, `7`=HTML'
                autoInject:
                  type: boolean
                  description: 'When `true`, the promotion is auto-placed into every send at
                    `autoInjectPosition` instead of a manually-chosen `zone`. When `true`, `zone` may be
                    omitted but `autoInjectPosition` becomes required. Defaults to `false` (manual
                    placement via `zone`).'
                autoInjectPosition:
                  type: integer
                  description: '0-100 placement position, required when `autoInject: true`. Ignored for
                    manual (non-auto-inject) promotions.'
              required:
                - campaignTitle
                - isActive
                - type
            example:
              campaignTitle: Summer Sale 2026
              channels:
                - an-example-channel
              headline: 50% off summer collection
              contentText: Limited-time offer on all summer items.
              imageUrl: https://cdn.example.com/summer-sale.png
              imageAlternativeText: Summer sale banner
              promotionLink: https://example.com/summer-sale
              promoter: Example Brand
              dates:
                - '2026-07-01'
              isActive: true
              isEvergreen: false
              zone: A
              type: 2
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      promotionCollateralUid:
                        type: string
                      campaignTitle:
                        type: string
                      channels:
                        type: array
                        items:
                          type: string
                      allChannels:
                        type: boolean
                      headline:
                        type: string
                      contentText:
                        type: string
                      imageUrl:
                        type: string
                      imageAlternativeText:
                        type: string
                      imageWidth:
                        type: integer
                      imageHeight:
                        type: integer
                      promotionLink:
                        type: string
                      promoter:
                        type: string
                      promotionServiceProviderId:
                        type: integer
                      dates:
                        type: array
                        items:
                          type: string
                      isActive:
                        type: boolean
                      isInactive:
                        type: boolean
                      isEvergreen:
                        type: boolean
                      embedClicks:
                        type: integer
                      zone:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  promotionCollateralUid: b2c3d4e5f6
                  campaignTitle: Summer Sale 2026
