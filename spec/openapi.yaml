                - siteName: example.com
                  displayLabel: Example Daily
  /api/v3/curations/custom-fields:
    get:
      tags:
        - Curations
      summary: List curation custom fields
      description: |-
        Returns the company's curation custom field definitions — up to 20 per company. A custom field
        lets a data feed or RSS feed map a source path onto a value that isn't one of the standard
        curation fields (see **Create a data feed**'s `fieldMappings`).
      operationId: listCurationCustomFields
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: This field's identifier — pass it to **Delete a curation custom
                            field**.
                        companyId:
                          type: integer
                        name:
                          type: string
                        key:
                          type: string
                          description: Normalized from `name`. Used as the `customFields` key on a
                            curation, and as the `customField:<key>` target in a data feed's field
                            mappings.
                        maxLength:
                          type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - id: 3
                    companyId: 999999999
                    name: Vendor SKU
                    key: vendor-sku
                    maxLength: 60
                    createdAt: '2026-06-01T12:00:00+00:00'
                    updatedAt: '2026-06-01T12:00:00+00:00'
                message: Custom fields.
                total: 1
    post:
      tags:
        - Curations
      summary: Create a curation custom field
      description: |-
        Define a new curation custom field for the company (max 20 per company). Once created, it can be
        set on a curation via `customFields` (**Update a curation**) or mapped from a data feed (see
        **Create a data feed**'s `fieldMappings`).
      operationId: createCurationCustomField
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - maxLength
              properties:
                name:
                  type: string
                  description: Letters, numbers, spaces, hyphens, and underscores only (max 60 characters).
                maxLength:
                  type: integer
                  description: Maximum length, in characters, of a value stored in this field (max 500).
            example:
              name: Vendor SKU
              maxLength: 60
      responses:
        '201':
          description: Custom field created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      companyId:
                        type: integer
                      name:
                        type: string
                      key:
                        type: string
                      maxLength:
                        type: integer
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  id: 3
                  companyId: 999999999
                  name: Vendor SKU
                  key: vendor-sku
                  maxLength: 60
                  createdAt: '2026-06-01T12:00:00+00:00'
                  updatedAt: '2026-06-01T12:00:00+00:00'
                message: Custom field created.
                total: 1
  /api/v3/curations/custom-fields/{fieldId}:
    parameters:
      - name: fieldId
        in: path
        required: true
        description: The custom field's identifier, from **List curation custom fields**.
        schema:
          type: integer
    delete:
      tags:
        - Curations
      summary: Delete a curation custom field
      description: |-
        Delete a curation custom field definition. Existing curations keep whatever value was already
        stored under it, but the field no longer appears in **List curation custom fields** and can no
        longer be set or mapped.
      operationId: deleteACurationCustomField
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Custom field deleted
  /api/v3/curations/toggle/{uniqueId}:
    parameters:
      - name: uniqueId
