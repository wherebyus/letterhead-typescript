  /api/v3/promotions/actions/by-dates:
    get:
      tags:
        - Promotions
      summary: List promotions by date (cached)
      description: |-
        List company promotions from an internal cache, filtered by dates: when `dates[]` is provided,
        returns promotions matching any of those dates plus every evergreen promotion; when `dates[]`
        is empty, returns only evergreen promotions. Same item shape as **List promotions**, but
        returns everything in one page rather than paginating (`page`/`limit` in the response envelope
        are always `1`/the full result count).

        `v3` endpoints expect a company API key.
      operationId: listPromotionsByDates
      parameters:
        - name: api
          in: query
          description: When set to `true`, the endpoint accepts authorization with your API Key.
          required: true
          schema:
            type: boolean
        - name: dates[]
          in: query
          description: Y-m-d dates to match. Omit/empty to return only evergreen promotions.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: channels[]
          in: query
          description: Filter by channel slug(s)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: mjml
          in: query
          description: When `true`, items include rendered MJML. Defaults to `false`.
          required: false
          schema:
            type: boolean
        - name: html
          in: query
          description: Accepted for compatibility with other promotion endpoints, but currently has no
            effect on this response — no item ever carries a separate `html` field; the `mjml` field is
            the only rendered-content field this endpoint returns. Defaults to `false`.
          required: false
          schema:
            type: boolean
        - name: esp
          in: query
          description: ESP id used to render MJML/HTML (only relevant when `mjml=true`). Defaults to `0`
            (Letterhead's own ESP).
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        promotionCollateralUid:
                          type: string
                        campaignTitle:
                          type: string
                        promoter:
                          type: string
                        createdAt:
                          type: string
                        nextDate:
                          type: string
                        isActive:
                          type: boolean
                        isInactive:
                          type: boolean
                        isEvergreen:
                          type: boolean
                        position:
                          type: string
                        promotionCampaignUid:
                          type: string
                        image:
                          type: string
                        imageWidth:
                          type: integer
                        imageHeight:
                          type: integer
                        impressions:
                          type: integer
                        clicks:
                          type: integer
                        mjml:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  totalInPage:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
              example:
                items:
                  - promotionCollateralUid: b2c3d4e5f6
                    campaignTitle: Summer Sale 2026
                    promoter: Example Brand
                    createdAt: '2026-06-04 17:30:00'
                    nextDate: '2026-07-01'
