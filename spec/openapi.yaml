        activity feed or `GET /api/v3/agents/runs/{runUniqueId}` for its result.
      operationId: triggerAnOnDemandAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
              required:
                - api
            example:
              api: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      runUniqueId:
                        type: string
                        description: Empty at dispatch time — the run hasn't been created
                          yet.
                      queued:
                        type: boolean
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  runUniqueId: ''
                  queued: true
                message: Run-now request accepted
                total: 1
    parameters:
      - name: agentUuid
        in: path
        required: true
        description: The agent's unique identifier.
        schema:
          type: string
  /api/v3/agents/{agentUuid}/runs:
    post:
      tags:
        - Agents
      summary: Run an agent
      description: Run an agent against a resource — currently a letter — identified
        by `resourceUniqueId`. Returns the created run.
      operationId: runAnAgentOnAResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                resourceUniqueId:
                  type: string
                  description: The unique identifier of the resource to run the agent
                    against — currently a letter.
              required:
                - api
                - resourceUniqueId
            example:
              api: true
              resourceUniqueId: 35f725edbi
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                      agentUniqueId:
                        type: string
                      agentName:
                        type: string
                      agentType:
                        type: integer
                      letterTitle:
                        type: string
                      contextLabel:
                        type: string
                      resourceType:
                        type: integer
                      resourceUniqueId:
                        type: string
                      status:
                        type: integer
                      summary:
                        type: string
                        nullable: true
                      validationCode:
                        type: integer
                      dispatchedAt:
                        type: string
                        nullable: true
                      startedAt:
                        type: string
                        nullable: true
                      completedAt:
                        type: string
                        nullable: true
                      judgments:
                        type: array
                        items:
                          type: object
                          properties:
                            uniqueId:
                              type: string
                            severity:
                              type: integer
                            confidence:
                              type: integer
                            category:
                              type: string
                            finding:
                              type: string
                            suggestion:
                              type: string
                            state:
                              type: integer
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                            isOutdated:
                              type: boolean
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: vq5rnof1op
                  agentUniqueId: mofuehvagv
                  agentName: House style checker
                  agentType: 0
                  letterTitle: This week in the daily
                  contextLabel: the-daily
                  resourceType: 0
                  resourceUniqueId: 35f725edbi
                  status: 0
                  summary: null
                  validationCode: 200
                  dispatchedAt: null
                  startedAt: null
                  completedAt: null
                  judgments: []
                  createdAt: '2026-06-18T14:22:03+00:00'
                  updatedAt: '2026-06-18T14:22:03+00:00'
                message: ''
                total: 10
    parameters:
      - name: agentUuid
        in: path
        required: true
        description: The agent's unique identifier.
        schema:
          type: string
  /api/v3/links:
    get:
      tags:
        - Links
      summary: List the links in your letters and their categories (coming soon)
      description: |-
        Returns a paginated, deduplicated list of the links that appear across your letters, each with its
        enriched metadata (title, description, site name, author, image) and the categories our crawler
        assigned it. Every entry also lists the letters it appeared in.
      operationId: listLinksAndTheirCategories
      parameters:
        - name: api
          in: query
          description: When set to `true`, this endpoint will accept authorization with your API Key.
          required: true
          schema:
            type: boolean
        - name: page
          in: query
          description: 1-based page number. Minimum 1. Defaults to 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Links per page. Minimum 1, maximum 100. Defaults to 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            urlMd5:
                              type: string
                              description: A stable hash of the link's URL, usable as a per-link key.
                            url:
                              type: string
                              description: The link's URL as it was stored.
                            pageTitle:
                              type: string
                              description: The linked page's title, as our crawler found it.
                            pageDescription:
                              type: string
                              description: The linked page's description, as our crawler found it.
                            pageKeywords:
                              type: string
                              description: Keywords the linked page declares, as our crawler found them.
                            siteName:
                              type: string
                              description: The linked page's site name.
                            authorName:
                              type: string
                              description: The linked page's author, when the page declares one.
                            language:
                              type: string
                              description: The linked page's declared language.
                            pageImage:
                              type: string
                              description: The linked page's preview image URL, when one was found.
                            publishedTime:
                              type: string
                              description: The linked page's declared publish time.
                            canonicalUrl:
                              type: string
                              description: The linked page's canonical URL, when our crawler resolved one;
                                otherwise empty.
                            enrichmentSource:
                              type: string
                              description: Where this link's metadata came from.
                            iabCategories:
                              type: array
                              items:
                                type: string
                              description: The IAB category names our crawler assigned to this link.
                            appearances:
                              type: array
                              items:
                                type: object
                                properties:
                                  letterUniqueId:
                                    type: string
                                    description: The identifier of a letter this link appeared in.
                                  publicationDate:
                                    type: string
                                    description: The publication date of that letter.
                              description: Every letter this link appeared in, each with its publication date.
                      page:
                        type: integer
                        description: The page number this response represents, echoing the `page` parameter.
                      limit:
                        type: integer
                        description: The page size used, echoing the `limit` parameter.
                      hasMore:
                        type: boolean
                        description: Whether another page of links is available after this one.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  links:
                    - urlMd5: 9e107d9d372bb6826bd81d3542a419d6
                      url: https://example.com/an-article
                      pageTitle: An Article Worth Reading
                      pageDescription: A summary of the article.
                      pageKeywords: news, community
                      siteName: Example News
                      authorName: Jane Doe
                      language: en
                      pageImage: https://example.com/an-article/image.jpg
                      publishedTime: '2026-06-18T14:22:03+00:00'
                      canonicalUrl: https://example.com/an-article
                      enrichmentSource: crawler
                      iabCategories:
                        - News and Politics
                      appearances:
                        - letterUniqueId: 35f725edbi
                          publicationDate: '2026-06-18'
                  page: 1
                  limit: 50
                  hasMore: false
                message: Links retrieved.
                total: 1
  /api/v3/audience/segments:
    get:
      tags:
        - Segments
      summary: List newsletter-level segments (deprecated)
      description: |-
        This endpoint is deprecated in favor of the company-wide **Contacts** endpoints, which do the same job with more flexibility and at a larger scale. It is documented here for accounts still calling it; use the Contacts endpoints for anything new.

        Replaced by `GET /api/v3/contacts/segments`. Some longer-standing accounts still see a newsletter-level segment list here. Dynamic segments that Letterhead maintains for you are not included.
      operationId: listNewsletterSegmentsDeprecated
      deprecated: true
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: name
          in: query
          description: Narrow the listing to segments whose name contains this text.
          required: false
          schema:
            type: string
        - name: channel
          in: query
          description: Narrow the listing to segments assigned to the given channel identifier (slug).
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: 1-based page number. Minimum 1. Defaults to 1.
          required: false
          schema:
            type: integer
        - name: itemsPerPage
          in: query
          description: Segments per page. Minimum 1, maximum 100. Defaults to 20.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: integer
                          description: The segment's identifier. Legacy behavior — unlike every other
                            `uniqueId` in this spec, this deprecated endpoint's field name carries the
                            raw internal numeric ID (`ChannelSegments::convertToPublicArray()`), not a
                            non-sequential unique identifier.
                        channel:
                          type: string
                          description: The channel identifier (slug) this segment belongs to.
                        name:
                          type: string
                          description: The segment's name.
                        criteria:
                          type: array
                          items:
                            type: object
                            properties:
                              attribute:
                                type: string
                              category:
                                type: string
                              operator:
                                type: string
                              value:
                                type: string
                          description: The legacy per-segment criteria rows. Unlike the company-wide segments'
                            `conditions[]`, this shape isn't standardized across condition kinds.
                        isOrBoolean:
                          type: boolean
                          description: When `true`, a contact matches if any criteria row matches (OR).
                            When `false`, every row must match (AND).
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: 22
                    channel: the-daily
                    name: Engaged readers
                    criteria:
                      - attribute: opens
                        category: engagement
                        operator: '>'
                        value: '5'
                    isOrBoolean: false
                    createdAt: '2026-03-11 08:20:00'
                    updatedAt: '2026-03-11 08:20:00'
                message: ''
                total: 1
