                  curated: true
                  publicationDate: '2026-08-30 09:00:00'
                  updatedAt: '2026-09-01T08:00:00+00:00'
                message: Article status updated.
                total: 1
  /api/v3/curations/{uniqueId}:
    parameters:
      - name: uniqueId
        in: path
        required: true
        description: The curation's unique identifier, from **List curations** or **Curate or update content**.
        schema:
          type: string
    post:
      tags:
        - Curations
      summary: Update a curation
      description: |-
        Update the content and metadata of an existing curation. Every field is optional — omit a field
        to leave it unchanged. Returns a 404 if no curation with this `uniqueId` belongs to the company.

        `customFields` accepts an object keyed by a custom field's `key` (see **List curation custom
        fields**); any key that isn't a defined custom field is dropped. Passing `channels` replaces the
        set of channels this curation is shared to — pass the channels' internal numeric identifiers, not
        their slugs.
      operationId: updateACuration
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 191
                excerpt:
                  type: string
                content:
                  type: string
                url:
                  type: string
                author:
                  type: string
                siteName:
                  type: string
                image:
                  type: string
                imageAlt:
                  type: string
                imageCaption:
                  type: string
                  maxLength: 255
                publicationDate:
                  type: string
                  description: '`Y-m-d H:i:s` format, no more than one year in the future.'
                tags:
                  type: array
                  items:
                    type: string
                customFields:
                  type: object
                  description: Values keyed by a custom field's `key`.
                channels:
                  type: array
                  items:
                    type: integer
                  description: Internal numeric channel identifiers to share this curation to.
            example:
              title: How coffee prices are shaping this year's harvest (updated)
              tags:
                - coffee
                - agriculture
                - markets
      responses:
        '202':
          description: Curation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/CurationSimplified'
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: cur_8x2mle4kq9
                  title: How coffee prices are shaping this year's harvest (updated)
                  tags:
                    - coffee
                    - agriculture
                    - markets
                  updatedAt: '2026-09-01T08:05:00+00:00'
                message: Your curation was successfully updated.
                total: 1
        '404':
          description: No curation with this `uniqueId` belongs to the company
    delete:
      tags:
        - Curations
      summary: Delete a curation
      description: |-
        Delete a curation belonging to the company. Returns a 404 if no curation with this `uniqueId`
        belongs to the company.
      operationId: deleteACuration
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Curation deleted
        '404':
          description: No curation with this `uniqueId` belongs to the company
  /api/v3/curations/{uniqueId}/tags:
    parameters:
      - name: uniqueId
        in: path
        required: true
        description: The curation's unique identifier, from **List curations** or **Curate or update content**.
        schema:
          type: string
    post:
      tags:
        - Curations
      summary: Update a curation's tags
      description: |-
        Replace a curation's tags without touching its content or any other field. Pass an empty array
        to clear all tags. Returns a 404 if no curation with this `uniqueId` belongs to the company.
      operationId: updateACurationsTags
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
            example:
              tags:
                - coffee
                - agriculture
      responses:
        '202':
          description: Tags updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/CurationSimplified'
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: cur_8x2mle4kq9
                  title: How coffee prices are shaping this year's harvest
                  tags:
                    - coffee
                    - agriculture
                message: Tags updated successfully.
                total: 1
        '404':
          description: No curation with this `uniqueId` belongs to the company
  /api/v3/curations/feeds:
    get:
      tags:
        - Curations
      summary: List curation feeds
      description: |-
        Returns a paginated list of the company's RSS feeds — the feeds that automatically crawl for new
        curations, shared across one or more channels. For JSON data feeds, see **List data feeds**.

        **Query parameters**

        - `keyword`, `limit` (default `25`), `page` (default `1`).
        - `status` — `active`, `inactive`, or `error`.
        - `channels[]` — filter to feeds shared with any of these channel slugs.
        - `orderBy` — one of `title`, `status`, `validationCode`, `channelName`, `createdAt`, `updatedAt`,
          `lastValidated` (default `createdAt`).
        - `direction` — `asc` or `desc` (default `desc`).
        - `companyOnly` — restrict to feeds created at the company level (excludes legacy per-channel feeds).
      operationId: listCurationFeeds
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
              - error
        - name: limit
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: channels[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: orderBy
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: companyOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyFeed'
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: feed_7x2mle
                    title: Example Daily
                    description: Our syndication partner's RSS feed.
                    feedUrl: https://example.com/rss
                    type: 0
                    isValid: true
                    validationCode: 200
                    crawl: true
                    archiveIntervalDays: 7
                    channelName: The Weekly Brew
                    channelSlug: the-weekly-brew
                    sharedChannelIds:
                      - 54212
                    tags:
                      - coffee
                    authType: 0
                    hasAuthSecret: false
                    fieldMappings: []
                    createdAt: '2026-04-01T09:00:00+00:00'
                    updatedAt: '2026-08-30T09:05:00+00:00'
                message: Feeds fetched successfully.
                total: 1
    post:
      tags:
        - Curations
      summary: Create a curation feed
      description: |-
        Create a company-level RSS feed, optionally shared across multiple channels. Letterhead crawls it
        immediately after creation and then on the cadence implied by `archiveIntervalDays`.
      operationId: createACurationFeed
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - feedUrl
                - archiveIntervalDays
              properties:
                title:
                  type: string
                  maxLength: 140
                description:
                  type: string
                  maxLength: 280
                feedUrl:
                  type: string
                archiveIntervalDays:
                  type: integer
                  description: How often, in days, to re-crawl the feed (1–31).
                crawl:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                channels:
                  type: array
                  items:
                    type: integer
                  description: Internal numeric channel identifiers to share this feed with.
            example:
              title: Example Daily
              description: Our syndication partner's RSS feed.
              feedUrl: https://example.com/rss
              archiveIntervalDays: 7
              crawl: true
      responses:
        '201':
          description: Feed created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/CompanyFeed'
                  message:
                    type: string
                  total:
                    type: integer
  /api/v3/curations/feeds/health-summary:
    get:
      tags:
        - Curations
      summary: Get curation feed health summary
      description: |-
        Returns roll-up counts of the company's RSS and JSON data feeds by health status — how many are
        actively crawling versus erroring — for a feeds-health widget.
      operationId: getCurationFeedHealthSummary
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
