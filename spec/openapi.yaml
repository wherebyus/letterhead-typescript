  /api/v3/channels/{channel}/newsletter-links:
    get:
      tags:
        - Channels
      summary: List newsletter links across a set of a channel's editions
      description: |-
        Return the distinct enriched links found across a set of this channel's published editions —
        either the last `numberOfEmails` published (`mode=recently_published`) or a specific list of
        editions (`mode=specific_emails`). Built for the automation click-link picker, so results are
        deduplicated across the whole selection in a single request.

        An edition contributes nothing here until Letterhead's link-enrichment pipeline has crawled it, so
        a very recently published edition may not yet appear.

        `v3` endpoints expect a company API key.
      operationId: listNewsletterLinksForChannel
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: mode
          in: query
          required: true
          description: '`recently_published` or `specific_emails`.'
          schema:
            type: string
        - name: numberOfEmails
          in: query
          description: Required when `mode=recently_published`. 1-50.
          required: false
          schema:
            type: integer
        - name: newsletterIds[]
          in: query
          description: Required when `mode=specific_emails`. 1-64 letter `uniqueId`s.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        urlMd5:
                          type: string
                        url:
                          type: string
                        title:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - urlMd5: 5d41402abc4b2a76b9719d911017c592
                    url: https://example.com/an-article
                    title: An Example Article
                message: Newsletter links retrieved.
                total: 1
        '400':
          description: 400 Validation Error — `mode` is missing/invalid, or the field its value requires
            (`numberOfEmails` or `newsletterIds`) is missing or out of range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data:
                  - The mode field is required.
                items: []
                message: Looks like the input data doesn't meet our requirements.
                total: 0
        '404':
          description: 404 Not Found — no channel matches `channel` for this company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data: []
                items: []
                message: Channel not found
                total: 0
    parameters:
      - name: channel
        in: path
        required: true
        description: The newsletter's channel identifier (slug).
        schema:
          type: string
  /api/v3/channels/{channelSlug}/segments/{segmentId}/recommended-send-time:
    get:
      tags:
        - Channels
      summary: Get the recommended send time for a channel's segment
      description: |-
        Returns the day of week and time of day this segment's readers open most often, derived from up
        to the segment's last 10 published editions. `segmentId=0` addresses the built-in "All active
        subscribers" segment.

        Returns `404 Not Found` when the segment doesn't have enough send history yet (fewer than 3
        editions with recorded opens, or fewer than 50 opens total) — never a recommendation built on an
        unreliable basis.

        This endpoint is gated behind an internal feature flag that is not yet enabled for any tenant.
        While it's off, the endpoint also returns `404 Not Found`, indistinguishable from the
        insufficient-history case above.

        `v3` endpoints expect a company API key.
      operationId: getRecommendedSendTimeForChannelSegment
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      recommendedWeekday:
                        type: string
                      recommendedIsoWeekday:
                        type: integer
                        description: ISO-8601 weekday, `1`=Monday through `7`=Sunday.
                      recommendedHour:
                        type: integer
                        description: Hour of day, `0`-`23`, in `timezone`.
                      recommendedTimeLabel:
                        type: string
                        description: '`recommendedHour` formatted for display, e.g. `8:00 AM`.'
                      timezone:
                        type: string
                      basis:
                        type: object
                        properties:
                          editionsAnalyzed:
                            type: integer
                          opensAnalyzed:
                            type: integer
                          distinctSendHours:
                            type: integer
                            description: How many distinct send hours the analyzed editions actually
                              used — a low number means this recommendation may just be recovering the
                              segment's current send time rather than finding a better one.
                          oldestEditionAt:
                            type: string
                          newestEditionAt:
                            type: string
                  message:
                    type: string
                  total:
                    type: integer
                    description: Always `10` for this endpoint — `total` is not used for pagination here.
              example:
                items:
                  recommendedWeekday: Tuesday
                  recommendedIsoWeekday: 2
                  recommendedHour: 8
                  recommendedTimeLabel: '8:00 AM'
                  timezone: America/New_York
                  basis:
                    editionsAnalyzed: 10
                    opensAnalyzed: 412
                    distinctSendHours: 2
                    oldestEditionAt: '2026-05-01 08:05:00'
                    newestEditionAt: '2026-08-01 08:05:00'
                message: Recommended send time found for segment 0.
                total: 10
        '404':
          description: 404 Not Found — see the cases listed above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data: []
                items: []
                message: 'Segment 0 has too little open history for a send-time recommendation: 1
                  editions with open data, 12 opens.'
                total: 0
    parameters:
      - name: channelSlug
        in: path
        required: true
        description: The newsletter's channel identifier (slug).
        schema:
          type: string
      - name: segmentId
        in: path
        required: true
        description: Numeric id of the audience segment. `0` is the built-in "All active subscribers"
          segment.
        schema:
          type: integer
  /api/v3/channels/{channelSlug}/letters/{letterUniqueId}/sms/unsubscribes:
