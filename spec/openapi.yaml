          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - feedUrl
                - archiveIntervalDays
              properties:
                title:
                  type: string
                  maxLength: 140
                description:
                  type: string
                  maxLength: 280
                feedUrl:
                  type: string
                archiveIntervalDays:
                  type: integer
                crawl:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                channels:
                  type: array
                  items:
                    type: integer
                  description: Internal numeric channel identifiers to share this feed with. Replaces
                    the existing set.
      responses:
        '200':
          description: Feed updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/CompanyFeed'
                  message:
                    type: string
                  total:
                    type: integer
