        description: The curation's unique identifier, from **List curations** or **Curate or update content**.
        schema:
          type: string
    post:
      tags:
        - Curations
      summary: Toggle a curation's curated status
      description: |-
        Mark a curation as curated (ready to use in a newsletter) or not, without changing anything else
        about it.
