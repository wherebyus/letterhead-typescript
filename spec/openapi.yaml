components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A company-level Letterhead API key, sent as a Bearer token.
  schemas:
    CurationSimplified:
      type: object
      description: |-
        The shape a curation is returned in after **Toggle a curation's curated status**, **Update a
        curation**, or **Update a curation's tags** — a lighter shape than the one **List curations**
        returns, without internal identifiers.
      properties:
        uniqueId:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        author:
          type: string
        siteName:
          type: string
        originalUrl:
          type: string
        image:
          type: string
        imageAlt:
          type: string
        imageCaption:
          type: string
        publicationDate:
          type: string
        dateOfAggregatePublication:
          type: string
        curated:
          type: boolean
        archived:
          type: boolean
        archiveDate:
          type: string
          nullable: true
        useBy:
          type: string
          nullable: true
        feedUniqueId:
          type: string
          nullable: true
        type:
          type: integer
          description: Content type — `0` articles, `1` events, `2` AI-generated, `3` WordPress, `4`
            RSS, `5` browser extension, `6` Zapier, `7` JSON data feed.
        createdAt:
          type: string
        updatedAt:
          type: string
        deletedAt:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        customFields:
          type: object
          description: Present only when the curation has at least one custom field value set, keyed
            by the custom field's `key` (see **List curation custom fields**).
    CompanyFeed:
      type: object
      description: |-
        The shape returned for both RSS feeds (**List curation feeds**) and JSON data feeds (**List data
        feeds**) — `type` (`0` RSS, `1` JSON data feed) tells the two apart. `fieldMappings`, `authType`,
        and `hasAuthSecret` are only meaningful on a JSON data feed.
      properties:
        uniqueId:
          type: string
        title:
          type: string
        description:
          type: string
        feedUrl:
          type: string
        type:
          type: integer
          description: '`0` RSS feed, `1` JSON data feed.'
        isValid:
          type: boolean
        validationCode:
          type: integer
          nullable: true
        crawl:
          type: boolean
        archiveIntervalDays:
          type: integer
        lastValidated:
          type: string
        lastQueried:
          type: string
        channelName:
          type: string
          description: The channel this feed was originally created against, or blank for a feed shared
            to multiple channels with no single owner.
        channelSlug:
          type: string
        sharedChannelIds:
          type: array
          items:
            type: integer
          description: Internal numeric identifiers of every channel this feed is shared with.
        tags:
          type: array
          items:
            type: string
        authType:
          type: integer
          description: '`0` — no authentication. `1` — bearer token.'
        hasAuthSecret:
          type: boolean
          description: Whether a credential is stored — the credential itself is never returned.
        fieldMappings:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        deletedAt:
          type: string
          nullable: true
