                          nullable: true
                        availableTo:
                          type: string
                          nullable: true
                        status:
                          type: string
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: c3d4e5f6a7
                    channels:
