                            type: number
                          previousValue:
                            type: number
                          changePercentage:
                            type: number
                          growthRate:
                            type: number
                          referenceDate:
                            type: string
                          channelId:
                            type: integer
                            description: Internal numeric channel id — 0 when the metric is company-wide
