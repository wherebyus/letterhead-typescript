  /api/v3/curations/sources:
    get:
      tags:
        - Curations
      summary: List curation sources
      description: |-
        Returns the distinct site names ("sources") the company's curations were saved from, each paired
        with a display label. Use a returned `siteName` in **List curations**' `sources[]` filter.
      operationId: listCurationSources
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
        - name: keyword
          in: query
          description: Filter sources by name.
          schema:
            type: string
        - name: count
          in: query
          description: Page size. Defaults to returning every source.
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: type
          in: query
          description: Restrict to sources of one curation type (see **List curations**' `type` field).
          schema:
            type: integer
      responses:
        '200':
          description: 200 OK — a bare array, not wrapped in `items`/`message`/`total`.
          content:
            application/json:
              schema:
                type: array
