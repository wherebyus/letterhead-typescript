  /api/v3/contacts/browse:
    post:
      tags:
        - Contacts
      summary: Browse contacts with filters
      description: |-
        Returns a filtered, paginated page of your company's contacts — the same query the contacts table on your audience page runs. Unlike **Search contacts**, this endpoint accepts a fuller filter set: multiple channels and statuses (OR'd together), tag terms, typed custom-field comparisons, a saved segment to intersect with, and a created-date window. Results are cursor-paginated with `searchAfter`.

        Each returned contact also carries the segments it currently belongs to.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: browseContactsWithFilters
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Free-text search across email, first name, and last name. Max 500 characters.
                channels:
                  type: array
                  items:
                    type: string
                  description: Restrict to contacts subscribed to any of these channel identifiers (slugs).
                statuses:
                  type: array
                  items:
                    type: integer
                  description: Restrict to contacts whose subscription status (on any matched channel)
                    is one of these values. See the subscription status table on **Add or update subscriptions
                    in bulk**.
                tags:
                  type: array
                  items:
                    type: string
                  description: Restrict to contacts carrying any of these tags.
                untagged:
                  type: boolean
                  description: Restrict to contacts with no tags at all. Mutually exclusive with a non-empty
                    `tags`.
                customFields:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        description: The custom field's name.
                      op:
                        type: string
                        description: '`eq`, `ne`, `gt`, `gte`, `lt`, `lte`, `contains`, or `exists`.'
                      value:
                        description: Comparison value. Omit when `op` is `exists`.
                  description: Typed custom-field comparisons, AND'd together with the rest of the filter.
                segmentId:
                  type: integer
                  description: A saved segment (see **List segments**) whose criteria are AND-merged
                    with the rest of this filter set.
                createdAtFrom:
                  type: string
                  description: Restrict to contacts created on or after this date (inclusive). Date-only
                    (`YYYY-MM-DD`) or a full ISO 8601 timestamp.
                createdAtTo:
                  type: string
                  description: Restrict to contacts created on or before this date (inclusive).
                sort:
                  type: string
                  description: '`name`, `email`, `status`, or `dateAdded`. Defaults to `dateAdded`.'
                direction:
                  type: string
                  description: '`asc` or `desc`. Defaults to `desc`.'
                pageSize:
                  type: integer
                  description: Page size, 1–100. Defaults to 25.
                searchAfter:
                  type: string
                  nullable: true
                  description: Opaque cursor from the previous page's `searchAfter`. Omit or send `null`
                    for the first page.
                channel:
                  type: string
                  description: Narrow the browse to a single channel identifier (slug) — the shape the
                    channel-level audience page uses.
                emails:
                  type: array
                  items:
                    type: string
                  description: Optional explicit email allow-list, AND'd into the query. Up to 10,000
                    entries.
                contactKeys:
                  type: array
                  items:
                    type: string
                  description: Optional explicit contact-key allow-list — the email-less counterpart
                    to `emails`, so an endpoint-anchored (phone-only) contact can be in a hand-picked
                    selection. Each entry is the contact's opaque 64-character hex key. Up to 10,000
                    entries.
                hasEmail:
                  type: boolean
                  description: Restrict to contacts that do (`true`) or don't (`false`) have an email
                    address. `hasEmail=false` is the email-less (endpoint-anchored) cohort — for example
                    a phone-only contact. Omit for no constraint.
                hasPhone:
                  type: boolean
                  description: Restrict to contacts that do (`true`) or don't (`false`) have an active
                    messaging endpoint (for example a verified phone number). `hasPhone=true` combined
                    with `hasEmail=false` is the SMS-only cohort. Omit for no constraint.
            example:
              tags:
                - engaged-readers
              statuses:
                - 1
              pageSize: 25
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            tags:
                              type: array
                              items:
                                type: string
                            customFields:
                              type: object
                            endpoints:
                              type: array
                              items:
                                type: object
                            channelConsents:
                              type: array
                              items:
                                type: object
                            consents:
                              type: array
                              items:
                                type: object
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                            segments:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                              description: The segments this contact currently belongs to.
                        description: The matched contacts for this page.
                      searchAfter:
                        type: string
                        nullable: true
                        description: Opaque cursor for the next page — pass it back as `searchAfter`.
                      totalRelation:
                        type: string
                        description: Whether the top-level total is exact (`eq`) or a lower bound (`gte`).
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  contacts:
                    - email: avery.chen@example.com
                      firstName: Avery
                      lastName: Chen
                      tags:
                        - engaged-readers
                      customFields:
                        __lh.mailboxProvider: gmail
                        lastOpenDate: '2026-06-18 05:11:33'
                      endpoints: []
                      channelConsents: []
                      consents: []
                      createdAt: '2026-05-23T11:43:15+00:00'
                      updatedAt: '2026-06-18T09:12:04+00:00'
                      segments:
                        - id: 7
                          name: Highly engaged readers
                  searchAfter: WzE3MTg3NTUxOTUwMDAsImF2ZXJ5LmNoZW5AZXhhbXBsZS5jb20iXQ==
                  totalRelation: eq
                message: Contacts retrieved.
                total: 842
