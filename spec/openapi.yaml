  /api/v3/metrics/clicks/topic-share:
    post:
      tags:
        - Metrics
      summary: Get content topic share
      description: |-
        For each content topic, the share of your published links versus the share of clicks it
        earned, for the over/under-served view on the clicks dashboard — `clicksShare > linksShare`
        means a topic is under-served (readers want more of it than you publish); the reverse means
        it's over-served. Links can carry more than one topic, so shares are topic-attributed and each
        of `linksShare`/`clicksShare` sums to 1 across all topics. Every topic in range is returned;
        this operation is not paginated.

        This endpoint additionally requires the caller's account to have topic-share analysis enabled,
        on top of the standard company API key — it returns `403 Forbidden` otherwise.

        `v3` endpoints expect a company API key.
      operationId: getTopicShareOverview
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
                from:
                  type: string
                  description: Period start date (inclusive).
                  example: '2026-02-26'
                to:
                  type: string
                  description: Period end date (inclusive), must be >= `from`.
                  example: '2026-03-26'
                channels[]:
                  type: string
                  description: '`string[]` | Optionally filter to a list of channels (by their slugs).'
                  example: an-example-channel
              required:
                - api
                - from
                - to
      responses:
        '200':
          description: Get content topic share
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        topic:
                          type: string
                        links:
                          type: integer
                          description: Distinct published, enriched links tagged with this topic.
                        clicks:
                          type: integer
                        linksShare:
                          type: number
                          description: Fraction (0–1) of all topic-attributed links that carry this topic.
                        clicksShare:
                          type: number
                          description: Fraction (0–1) of all topic-attributed clicks earned by this topic.
                  message:
                    type: string
                  total:
                    type: integer
                    description: Total topic count — not a page total; this operation is not paginated.
              example:
                items:
                  - topic: Local News
                    links: 14
                    clicks: 320
                    linksShare: 0.18
                    clicksShare: 0.29
                  - topic: Sports
                    links: 22
                    clicks: 180
                    linksShare: 0.28
                    clicksShare: 0.16
                message: Content topic share retrieved.
                total: 2
        '400':
          description: 400 Validation Error — `from`/`to` missing, malformed, or `from` is after `to`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data:
                  - The from date must be on or before the to date.
                items: []
                message: Looks like the input data doesn't meet our requirements.
                total: 0
        '403':
          description: 403 Forbidden — the caller's account doesn't have topic-share analysis enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data: []
                items: []
                message: Content topic share is not enabled.
                total: 0
  /api/v3/automations:
    get:
      tags:
        - Automations
      summary: List automations
      description: |-
        List your company's automations (Automation Series), with each one's status, channel, schedule,
        and the segment and template it sends. Filter by `status`, `channels`, or a `keyword` search
        against the title, and sort with `orderBy`/`direction`.

        ## A note on this response

        Each item includes the automation's and its channel's and newsletter's internal numeric ids
        (`channelId`, `newsletterId`) alongside the usual slugs and unique id. This reference documents
        the response as the API actually returns it today.

        `v3` endpoints expect a company API key.
      operationId: listAutomations
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: keyword
          in: query
          description: Optional. Restrict the list to automations whose title contains this text.
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 'Optional. Restrict the list to automations in this status: `0`=draft, `1`=running,
            `2`=paused, `5`=processing, `9`=error. Omit to return automations in any status.'
          required: false
          schema:
            type: integer
        - name: channels
          in: query
          description: Optional. Restrict the list to automations on these channel slugs.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: orderBy
          in: query
          description: 'Optional. Sort field: `createdAt`, `updatedAt`, `title`, `status`, `channel`, or
            `next`. Defaults to `createdAt`.'
          required: false
          schema:
            type: string
        - name: direction
          in: query
          description: Optional. Sort direction, `asc` or `desc`. Defaults to `desc`.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Optional. Page number, starting at 1. Defaults to 1.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Optional. Results per page. Defaults to 10.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                        title:
                          type: string
                        status:
                          type: integer
                          description: '`0`=draft, `1`=running, `2`=paused, `5`=processing, `9`=error.'
                        type:
                          type: integer
                          description: '`0`=scheduled series, `1`=triggered on a new subscriber.'
                        actions:
                          type: array
                          description: The steps this automation runs, each naming the template it sends.
                          items:
                            type: object
                            properties:
                              templateId:
                                type: string
                              type:
                                type: integer
                        channel:
                          type: string
                        channelId:
                          type: integer
                        channelSlug:
                          type: string
                        newsletterId:
                          type: integer
                        organizationSlug:
                          type: string
                        segmentId:
                          type: integer
                        segmentName:
                          type: string
                        templateName:
                          type: string
                        titleMode:
                          type: integer
                        manualTitle:
                          type: string
                          nullable: true
                        previewTextMode:
                          type: integer
                        manualPreviewText:
                          type: string
                          nullable: true
                        hasDynamicTitle:
                          type: boolean
                        hasDynamicPreviewText:
                          type: boolean
                        isAutopilot:
                          type: boolean
                        frequency:
                          type: object
                          properties:
                            daysOfWeek:
                              type: array
                              items:
                                type: integer
                            time:
                              type: string
                            weeksInterval:
                              type: integer
                        next:
                          type: string
                          nullable: true
                        previous:
                          type: string
                          nullable: true
                        validationCode:
                          type: integer
                          nullable: true
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: abcdefhik
                    title: Welcome Series - Step 1
                    status: 1
                    type: 0
                    actions:
                      - templateId: xyz12345
                        type: 0
                    channel: An Example Channel
                    channelId: 101
                    channelSlug: an-example-channel
                    newsletterId: 555
                    organizationSlug: example-org
                    segmentId: 42
                    segmentName: All Subscribers
                    templateName: Welcome Email
                    titleMode: 0
                    manualTitle: null
                    previewTextMode: 0
                    manualPreviewText: null
                    hasDynamicTitle: false
                    hasDynamicPreviewText: false
                    isAutopilot: false
                    frequency:
                      daysOfWeek:
                        - 1
                      time: '09:00'
                      weeksInterval: 1
                    next: '2026-08-27 09:00:00'
                    previous: '2026-08-20 09:00:00'
                    validationCode: null
                    createdAt: '2026-01-05 12:00:00'
                    updatedAt: '2026-08-20 09:05:00'
                message: Automations fetched successfully.
                total: 1
  /api/v3/automations/health-summary:
    get:
      tags:
        - Automations
      summary: Get automation health summary
      description: |-
        A rollup of your company's automations: how many exist in total, how many are currently active
        (running or processing), and how many need attention because they've stopped on an error
        (including one whose template was disabled and hasn't been replaced).

        `v3` endpoints expect a company API key.
      operationId: getAutomationHealthSummary
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      total:
                        type: integer
                      totalActive:
                        type: integer
                      totalErrored:
                        type: integer
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  total: 12
                  totalActive: 9
                  totalErrored: 1
                message: Automation health summary fetched successfully.
                total: 0
  /api/v3/automations/{automationUniqueId}/actions/update-status:
    post:
      tags:
        - Automations
      summary: Update an automation's status
      description: |-
        Set an automation to `draft`, `paused`, or `running`. This is the same status change the
        Letterhead app makes when you pause or activate an automation from the automations list — you
        cannot set an automation directly to `processing` or `error`, since those are states the system
        derives on its own.

        `v3` endpoints expect a company API key.
      operationId: updateAnAutomationStatus
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
                status:
                  type: integer
                  description: 'The new status: `0`=draft, `1`=running, `2`=paused.'
                  example: 2
              required:
                - api
                - status
      responses:
        '202':
          description: 202 Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Automation status has been updated
                total: 0
    parameters:
      - name: automationUniqueId
        in: path
        required: true
        description: The automation's unique identifier.
        schema:
          type: string
  /api/v3/automations/{automationUniqueId}/actions/trigger:
    post:
      tags:
        - Automations
      summary: Trigger an automation now
      description: |-
        Build this automation's newsletter immediately and schedule it to send within the next minute or
        two, without waiting for the automation's own schedule. This is a real send to the automation's
        full audience.

        Because of that, this endpoint is restricted to Letterhead staff: it authenticates as a signed-in
        user with a `@tryletterhead.com` or `@whereby.us` email address rather than a company API key, so
        it is not available to external integrations.
      operationId: triggerAnAutomation
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The letter that was just scheduled to send. See the Letters endpoints for
                      the full field list.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: def456
                  title: Welcome Series - Step 1
                message: Newsletter "Welcome Series - Step 1" is scheduled to send at 2026-08-26 14:32:00
                  UTC.
                total: 10
    parameters:
      - name: automationUniqueId
        in: path
        required: true
        description: The automation's unique identifier.
        schema:
          type: string
  /api/v3/automations/{automationUniqueId}/actions/run:
    post:
      tags:
        - Automations
      summary: Catch up an automation's missed run
      description: |-
        Run this automation's real send chain on its own schedule, for the case where a scheduled run was
        missed. Unlike the trigger endpoint above, this does not send immediately — the run still respects
        the automation's normal publication date and frequency, which may be hours away. The creators
        receive a test email first, and the automation is released back onto its normal schedule once the
        run is queued.

        Nothing is sent by this call itself — the newsletter goes out at the automation's own scheduled
        time. The response is `202` because the run is queued, not finished, when this answers.

        Because of that, this endpoint is restricted to Letterhead staff: it authenticates as a signed-in
        user with a `@tryletterhead.com` or `@whereby.us` email address rather than a company API key, so
        it is not available to external integrations.
      operationId: runAnAutomation
      responses:
        '202':
          description: 202 Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Automation is running now. Its newsletter is scheduled to send at Aug 26, 2026
                  2:32pm UTC, and a test email is on its way to the creators.
                total: 0
    parameters:
      - name: automationUniqueId
        in: path
        required: true
        description: The automation's unique identifier.
        schema:
          type: string
  /api/v3/automations/{automationUniqueId}/actions/change-template:
    post:
      tags:
        - Automations
      summary: Change an automation's template
      description: Using the **v3 API**, which requires a key generated from the company-level, this endpoint
        allows you to change the active template of an automation.
      operationId: changeAnAutomationTemplate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
                templateId:
                  type: string
                  description: The identifier of the template to set for the automation.
                  example: abcdefhik
              required:
                - api
                - templateId
      responses:
        '200':
          description: 200 Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Automation template has been updated
                total: 0
        '400':
          description: 400 Template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Template with ID {templateId} not found.
                total: 0
        '404':
          description: 404 Automation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: RecordNotFoundException — "Automation with unique ID {uniqueId} not found."
                total: 0
        '422':
          description: 422 Automation not in error state
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: 'Cannot change template for automation {uniqueId}: automation is not in error
                  state.'
                total: 0
    parameters:
      - name: automationUniqueId
        in: path
        required: true
        description: The automation's unique identifier.
        schema:
          type: string
  /api/v3/automations/{automationUniqueId}/actions/reactivate-and-restart:
    post:
      tags:
        - Automations
      summary: Reactivate and restart an automation
      description: |-
        This endpoint restarts the specified automation, in the event that as part of editorial -- someone didn't republish a change -- the automation disabled itself. Yep - this is a pretty specific use-case. The unpublished template will be published and then subsequently available to future automation use - and then the automation itself will be re-enabled.

        Our `v3` endpoints require a company-level API key.
      operationId: reactivateAndRestartAnAutomation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
              required:
                - api
      responses:
        '202':
          description: 202 - Reactivated and restarted
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Automation reactivated and restarted successfully
                total: 0
    parameters:
      - name: automationUniqueId
        in: path
        required: true
        description: The automation's unique identifier.
        schema:
          type: string
  /api/v3/automations/email-preferences:
    get:
      tags:
        - Automations
      summary: Get an automation notification email preference
      description: |-
        Automations are one of several events Letterhead can email a teammate about — this and the
        matching `PUT` endpoint read and set the signed-in user's email notification preference for one
        event at a time. `eventSlug` accepts the two automation events
        (`automation_deactivated`, `automation_template_reactivated`) as well as Letterhead's other
        notification events (imports/exports finishing, a review being requested, an AI text generation
        failing, new comments, a duplicate email being detected, an RSS feed failure, a system or webhook
        failure, a goal being reached, and an Analyze agent finishing).

        This reads the current user's own preference, so it authenticates as a signed-in user rather than
        a company API key and is not available to external integrations.
      operationId: getAnAutomationEmailPreference
      parameters:
        - name: channelId
          in: query
          required: true
          description: The internal numeric id of the channel the notification is scoped to.
          schema:
            type: integer
        - name: eventSlug
          in: query
          required: true
          description: 'The notification event, e.g. `automation_deactivated` or
            `automation_template_reactivated`.'
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      eventSlug:
                        type: string
                      enabled:
                        type: boolean
                        description: 'Whether the user receives this notification by email. If the user
                          has never chosen, this reports the event''s default (on for
                          `automation_deactivated`) rather than reading a row that doesn''t exist yet.'
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  eventSlug: automation_deactivated
                  enabled: true
                message: Preferences fetched successfully.
                total: 1
    put:
      tags:
        - Automations
      summary: Update an automation notification email preference
      description: |-
        Subscribe or unsubscribe the signed-in user from one notification event's emails. See the
        matching `GET` endpoint above for the full list of accepted `eventSlug` values. The choice is
        always stored as a row (never deleted), so it stays distinguishable from "never chose" and can
        turn off an event that's on by default.

        This changes the current user's own preference, so it authenticates as a signed-in user rather
        than a company API key and is not available to external integrations.
      operationId: updateAnAutomationEmailPreference
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                channelId:
                  type: integer
                  description: The internal numeric id of the channel the notification is scoped to.
                eventSlug:
                  type: string
                  description: 'The notification event, e.g. `automation_deactivated` or
                    `automation_template_reactivated`.'
                enabled:
                  type: boolean
                  description: Whether the user should receive this notification by email.
              required:
                - channelId
                - eventSlug
                - enabled
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Preference updated successfully.
                total: 0
  /api/v3/transactionals/actions/draft:
    post:
      tags:
        - Transactional Email
      summary: Create a transactional email draft
      description: |-
        Creates a transactional email **draft** (a private, tagged Letter) without sending it.

        **Authorization:** Bearer token (company-level API key). The caller must be a company administrator for the channel's owning company.

        **Availability:** Requires your tenant to be opted into transactional email — a deployment setting we turn on per tenant, not a flag you can toggle yourself. If you get a 404 here, contact support to request transactional email.

        **Note:** Recipient fields (`to`, `toName`, `substitutionData`) are ignored when drafting — only `channel`, `subject`, `html`, and `tags` are used. They may be sent (and are validated if present) but have no effect until the draft is sent.

        **Success:** `201 Created` — `items.uniqueId` is the created draft Letter's id.
      operationId: createATransactionalEmailDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                channel:
                  type: string
                  description: The channel you are drafting under (used for sender identity). Channel
                    slug.
                subject:
                  type: string
                  description: The email subject. Max 191 chars; must contain a non-whitespace character.
                html:
                  type: string
                  description: The full HTML body of the email. Bring your own HTML.
                tags:
                  type: array
                  items:
                    type: string
                  description: 'Transactional type tags, used for metric rollups. Required: 1-20 items,
                    each 60 chars or fewer. Trimmed and de-duplicated case-insensitively.'
            example:
              api: true
              channel: an-example-channel
              subject: Your password reset link
              html: <!DOCTYPE html><html><body><h1>Reset your password</h1></body></html>
              tags:
                - password-reset
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: 6cuswtvr7p
                message: Transactional email draft created.
                total: 0
  /api/v3/transactionals/actions/send:
    post:
      tags:
        - Transactional Email
      summary: Send a transactional email
      description: |-
        Sends a single, event-driven transactional email (password reset, receipt, welcome, etc.) through a channel for sender identity, tagged by transactional type for metric rollups.

        **Authorization:** Bearer token (company-level API key). The caller must be a company administrator for the channel's owning company.

        **Availability:** Requires your tenant to be opted into transactional email — a deployment setting we turn on per tenant, not a flag you can toggle yourself. If you get a 404 here, contact support to request transactional email.

        **Rate limit:** 120 sends per minute, per company. Exceeding the cap returns `429 Too Many Requests`.

        **Behavior:** Creates a private, tagged Letter and immediately queues the send. The Letter's `uniqueId` is used as the SparkPost `campaignId`, so engagement events aggregate through the standard metrics pipeline while the Letter stays out of newsletter listings and metrics. If the recipient matches a known contact, their profile data enriches `substitutionData` — caller-supplied values win on key conflicts.

        **Success:** `200 OK` — `items.uniqueId` is the created Letter's id (and the SparkPost `campaignId`); `items.to` echoes the recipient.
      operationId: sendATransactionalEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                channel:
                  type: string
                  description: The channel you send through (used for sender identity). Channel slug.
                to:
                  type: string
                  description: The recipient's email address.
                toName:
                  type: string
                  description: (optional) The recipient's display name. Max 191 chars.
                subject:
                  type: string
                  description: The email subject. Max 191 chars; must contain a non-whitespace character.
                html:
                  type: string
                  description: The full HTML body of the email. Bring your own HTML.
                substitutionData:
                  type: object
                  properties:
                    firstName:
                      type: string
                    resetUrl:
                      type: string
                  description: (optional) Key/value merge data interpolated into the HTML at send time.
                    Caller-supplied values take precedence over any contact-profile enrichment.
                tags:
                  type: array
                  items:
                    type: string
                  description: 'Transactional type tags, used for metric rollups. Required: 1-20 items,
                    each 60 chars or fewer. Trimmed and de-duplicated case-insensitively.'
            example:
              api: true
              channel: an-example-channel
              to: recipient@example.com
              toName: Jane Doe
              subject: Your password reset link
              html: <!DOCTYPE html><html><body><h1>Reset your password</h1><p><a href="https://example.com/reset">Reset
                now</a></p></body></html>
              substitutionData:
                firstName: Jane
                resetUrl: https://example.com/reset
              tags:
                - password-reset
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                      to:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: 6cuswtvr7p
                  to: recipient@example.com
                message: Your transactional email will be sent shortly.
                total: 0
  /api/v3/transactionals/tags/metrics:
    get:
      tags:
        - Transactional Email
      summary: Get transactional tag metrics
      description: |-
        Per-tag rolled-up engagement metrics for your company's transactional emails over a window —
        sends, open/click/bounce/spam rates, and when each tag was last sent. Rates are derived from
        the summed counts across every send carrying the tag, not averaged per send.

        **Authorization:** Bearer token (company-level API key). The caller must be a company
        administrator.

        **Availability:** Requires your tenant to be opted into transactional email (the same
        deployment setting `actions/send` and `actions/draft` need).

        Each item's `uniqueId` identifies the tag; pass it to
        `GET /api/v3/transactionals/tags/{tagUniqueId}/sends` to list that tag's sends.
      operationId: getTransactionalTagMetrics
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with an API key.
          required: true
          schema:
            type: boolean
        - name: channels[]
          in: query
          description: Channel slug to restrict the rollup to. Repeat the parameter once per channel.
            Omit for every channel.
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Start of the window (inclusive). Defaults to 90 days ago.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End of the window (inclusive). Defaults to now. The window cannot exceed 90
            days.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                        tag:
                          type: string
                        sends:
                          type: integer
                        openRate:
                          type: number
                        clickRate:
                          type: number
                        bounceRate:
                          type: number
                        spamRate:
                          type: number
                        lastSentAt:
                          type: string
                        refused:
                          type: integer
                          description: How many sends under this tag SparkPost refused in the window.
                            A count, not a rate. Present only on accounts where send status is
                            enabled; absent otherwise.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: k3x9vq2mfa
                    tag: password-reset
                    sends: 42
                    openRate: 0.71
                    clickRate: 0.38
                    bounceRate: 0.02
                    spamRate: 0
                    lastSentAt: '2026-08-30 14:02:11'
                    refused: 1
                message: Transactional tag metrics.
                total: 1
  /api/v3/transactionals/{uniqueId}:
    get:
      tags:
        - Transactional Email
      summary: Get a transactional send's status
      description: |-
        Where one transactional send stands, looked up by the `uniqueId` that
        `POST /api/v3/transactionals/actions/send` returned: whether it is still queued, was
        accepted or refused by SparkPost, and — once accepted — whether it was delivered, bounced,
        or marked as spam. Refused and bounced sends carry the reason.

        **Authorization:** Bearer token (company-level API key). The caller must be a company
        administrator, and a company administrator sees only their own company's sends.

        **Availability:** Requires your tenant to be opted into transactional email, and send status
        to be enabled for your account. Where either is off, this answers `404`.

        **Statuses:**
        - `queued` — Letterhead has the send and has not yet had a final answer from SparkPost.
        - `accepted` — SparkPost accepted the email. Look it up again later to see what happened next.
        - `refused` — SparkPost would not take the email (for example, an address that cannot receive
          mail), or Letterhead could not reach SparkPost after every retry. `reason` says which.
        - `delivered` — the recipient's mail server accepted the email.
        - `bounced` — the email bounced. `reason.code` is the bounce type.
        - `spam_complaint` — the recipient marked the email as spam.

        The latest event wins, so an email that was delivered and later bounced reads `bounced`.
      operationId: getATransactionalSendStatus
      parameters:
        - name: uniqueId
          in: path
          description: The send's id, from the `actions/send` response.
          required: true
          schema:
            type: string
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with an API key.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                        description: The send's id, as returned by `actions/send`.
                      status:
                        type: string
                        enum:
                          - queued
                          - accepted
                          - refused
                          - delivered
                          - bounced
                          - spam_complaint
                      reason:
                        type: object
                        nullable: true
                        description: Present for `refused` and usually for `bounced`; `null` otherwise.
                        properties:
                          code:
                            type: string
                            description: For `refused`, SparkPost's error code; `no_valid_recipient`
                              when SparkPost rejected every recipient, `transmission_error` when it
                              never answered, or `unknown` when its error carried no code. For
                              `bounced`, the bounce type (`Hard`, `Soft`, `Admin`, `Block`).
                          message:
                            type: string
                            nullable: true
                            description: Why the email was refused or bounced, in plain text.
                      updatedAt:
                        type: string
                        description: When the status last changed — for `delivered`, `bounced` and
                          `spam_complaint`, the time of that event.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: 6cuswtvr7p
                  status: refused
                  reason:
                    code: '5002'
                    message: invalid recipient
                  updatedAt: '2026-10-02 14:02:11'
                message: Transactional email status.
                total: 1
        '404':
          description: No send with this id in your company, the send was made before send status was
            enabled, or send status or transactional email is not enabled for your account.
  /api/v3/transactionals/tags/{tagUniqueId}/sends:
    get:
      tags:
        - Transactional Email
      summary: List a transactional tag's sends with their status
      description: |-
        The newest 100 sends carrying one transactional tag, newest first, each with the same
        `status`, `reason` and `updatedAt` the single-send lookup gives. Use it to see which sends
        under a tag were refused or bounced, and why.

        **Authorization:** Bearer token (company-level API key). The caller must be a company
        administrator, and a company administrator sees only their own company's sends.

        **Availability:** Requires your tenant to be opted into transactional email, and send status
        to be enabled for your account. Where either is off, this answers `404`.

        **Window:** `from` and `to` filter by when each send was made, as in
        `GET /api/v3/transactionals/tags/metrics`. The window defaults to the last 90 days and cannot
        exceed 90 days; a larger window, or `from` after `to`, answers `422`.

        **Statuses:**
        - `queued` — Letterhead has the send and has not yet had a final answer from SparkPost.
        - `accepted` — SparkPost accepted the email. Look it up again later to see what happened next.
        - `refused` — SparkPost would not take the email (for example, an address that cannot receive
          mail), or Letterhead could not reach SparkPost after every retry. `reason` says which.
        - `delivered` — the recipient's mail server accepted the email.
        - `bounced` — the email bounced. `reason.code` is the bounce type.
        - `spam_complaint` — the recipient marked the email as spam.

        The latest event wins, so an email that was delivered and later bounced reads `bounced`.
      operationId: listATransactionalTagsSends
      parameters:
        - name: tagUniqueId
          in: path
          description: The tag's `uniqueId`, from `GET /api/v3/transactionals/tags/metrics`.
          required: true
          schema:
            type: string
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with an API key.
          required: true
          schema:
            type: boolean
        - name: from
          in: query
          description: Start of the window (inclusive). Defaults to 90 days ago.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End of the window (inclusive). Defaults to now.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                          description: The send's id, as returned by `actions/send`.
                        status:
                          type: string
                          enum:
                            - queued
                            - accepted
                            - refused
                            - delivered
                            - bounced
                            - spam_complaint
                        reason:
                          type: object
                          nullable: true
                          description: Present for `refused` and usually for `bounced`; `null` otherwise.
                          properties:
                            code:
                              type: string
                              description: For `refused`, SparkPost's error code; `no_valid_recipient`
                                when SparkPost rejected every recipient, `transmission_error` when it
                                never answered, or `unknown` when its error carried no code. For
                                `bounced`, the bounce type (`Hard`, `Soft`, `Admin`, `Block`).
                            message:
                              type: string
                              nullable: true
                              description: Why the email was refused or bounced, in plain text.
                        updatedAt:
                          type: string
                          description: When the status last changed — for `delivered`, `bounced` and
                            `spam_complaint`, the time of that event.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: 6cuswtvr7p
                    status: bounced
                    reason:
                      code: Hard
                      message: The recipient's mailbox does not exist.
                    updatedAt: '2026-10-02 14:05:40'
                  - uniqueId: 9fj2mkq8wz
                    status: delivered
                    reason: null
                    updatedAt: '2026-10-02 13:58:02'
                message: Transactional sends for this tag.
                total: 2
        '404':
          description: Send status is not enabled for your account, or transactional email is not
            enabled for your tenant. An unknown tag, or one with no sends in the window, returns `200`
            with an empty `items` list.
        '422':
          description: The window is longer than 90 days, or `from` is after `to`.
