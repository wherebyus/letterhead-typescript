        schema:
          type: string
  /api/v3/contacts/{email}/subscriptions/bulk:
    post:
      tags:
        - Contacts
      summary: Add or update subscriptions in bulk
      description: |-
        Adds (or updates) several channel subscriptions for a contact in a single call. A new subscription is created for each channel the contact isn't already subscribed to; for channels they already have, the subscription's status is updated. The contact is identified by the `{email}` in the URL.

        The same `status` is applied to every channel in the payload — this mirrors the "one audience status applies to every selected newsletter" rule in the Add-to-Newsletter modal.

        ## Subscription status values

        | Value | Status |
        | --- | --- |
        | 0 | Not subscribed |
        | 1 | Subscribed |
        | 2 | Unsubscribed |
        | 3 | Cleaned |
        | 4 | Subscribed (pending opt-in) |
        | 5 | Admin pending opt-in |
        | 6 | Pending re-engagement |
        | 7 | Disengaged |

        Returns the updated contact, including its full subscription list.
      operationId: addOrUpdateSubscriptionsInBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items:
                    type: string
                  description: Channel slugs to subscribe (preferred). 1–200 entries, each unique.
                status:
                  type: integer
                  description: The subscription status to apply to every channel in the payload. See values
                    below.
              required:
                - channels
                - status
            example:
              channels:
                - weekly-digest
                - breaking-news
              status: 1
      responses:
        '200':
          description: 200 OK. Returns the updated contact — same shape as `GET
            /api/v3/contacts/{email}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The contact, with its updated subscription list. Full field list
                      under `GET /api/v3/contacts/{email}`.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: avery.chen@example.com
                  subscriptions:
                    - channel:
                        slug: weekly-digest
                        name: Weekly Digest
                      status: 1
                      createdAt: '2026-04-30T15:22:41+00:00'
                      updatedAt: '2026-08-30T15:01:21+00:00'
                    - channel:
                        slug: breaking-news
                        name: Breaking News
                      status: 1
                      createdAt: '2026-08-30T15:01:21+00:00'
                      updatedAt: '2026-08-30T15:01:21+00:00'
                message: Subscriptions saved.
                total: 1
    parameters:
      - name: email
        in: path
        description: The email address of the contact whose subscriptions you're managing.
        required: true
        schema:
          type: string
  /api/v3/contacts/{email}/subscriptions/{channel}:
    delete:
      tags:
        - Contacts
      summary: Delete a subscription
      description: |-
        Removes a contact's subscription to a single newsletter, identified by `{email}` and `{channel}` in the URL. To change a subscription's status instead of removing it outright, use **Update a subscription**.

        This is a company-level (v3) write. Authenticate with a company API key as a Bearer token.
      operationId: deleteASubscription
