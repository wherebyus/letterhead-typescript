      summary: Update a subscription
      description: |-
        Changes the subscription status for a contact on a single newsletter, identified by `{email}` and `{channel}` in the URL. See the subscription status table on **Add or update subscriptions in bulk**.

        This is a company-level (v3) write. Authenticate with a company API key as a Bearer token.
      operationId: updateASubscription
      requestBody:
        required: true
        content:
