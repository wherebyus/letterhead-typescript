            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                        channels:
                          type: array
                          items:
                            type: object
                            properties:
                              channel:
                                type: string
                              channelTitle:
                                type: string
                        zone:
                          type: string
                        title:
                          type: string
