          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feedUrl
              properties:
                feedUrl:
                  type: string
                bearerToken:
                  type: string
                  description: Plaintext, used only for this one test fetch. Blank means test with the
                    feed's already-stored credential.
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      itemCount:
                        type: integer
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            sample:
                              type: string
                  message:
                    type: string
                  total:
                    type: integer
  /api/v3/curations/data-feeds/{feedUniqueId}:
    parameters:
      - name: feedUniqueId
        in: path
        required: true
        description: The data feed's unique identifier, from **List data feeds**.
        schema:
          type: string
    patch:
