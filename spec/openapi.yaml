                                    description: "`=`, `>`, `<`, `>=`, `<=`, `inLastDays`, `notInLastDays`, or `isEmpty`."
                                  value:
                                    type: string
                                    description: "Comparison value. Omitted for the isEmpty operator, which carries no value. For inLastDays/notInLastDays, an integer number of days as a string."
                                required:
                                  - type
                                  - customFieldKey
                                  - operator
                              - title: tag
                                description: "Matches contacts by tag. Flags: none — on for everyone."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [tag]
                                  operator:
                                    type: string
                                    description: "`has` or `notHas`."
                                  value:
                                    type: string
                                    description: "The tag name."
                                required:
                                  - type
                                  - operator
                                  - value
                              - title: subscription
                                description: "Matches contacts by their subscription to a channel. Flags: none — on for everyone."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [subscription]
                                  channelId:
                                    type: integer
                                    description: "The channel to match a subscription on."
                                  status:
                                    type: integer
                                    description: "Optional subscription status to match, 0-7. Omit to match any status."
                                required:
                                  - type
                                  - channelId
                              - title: text
                                description: "Free-text match against a contact's email, first name, and last name. Flags: none — on for everyone."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [text]
                                  value:
                                    type: string
                                    description: "The text to search for."
                                required:
                                  - type
                                  - value
                              - title: openedEdition (single edition)
                                description: "Matches readers who opened one specific edition — the one-click shortcut from an edition's own metrics. Flags: engagementSegments (off for everyone as of this writing)."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [openedEdition]
                                  letterUniqueId:
                                    type: string
                                    description: "The edition's unique identifier."
                                required:
                                  - type
                                  - letterUniqueId
                              - title: clickedLink (single edition)
                                description: "Matches readers who clicked a specific link in one specific edition — the one-click shortcut. Flags: engagementSegments (off for everyone as of this writing)."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [clickedLink]
                                  letterUniqueId:
                                    type: string
                                    description: "The edition's unique identifier."
                                  url:
                                    type: string
                                    description: "The clicked URL."
                                required:
                                  - type
                                  - letterUniqueId
                                  - url
                              - title: openedEdition (engagement window)
                                description: "Matches readers whose opens over a recently-published window, or a specific set of editions, meet a threshold — built directly in the segment builder rather than from a single edition's metrics. Flags: segmentBuilderEngagementWindow (off for everyone as of this writing)."
                                type: object
                                properties:
                                  channel:
                                    type: string
                                    description: "Channel identifier (slug) the engagement is evaluated against."
                                  type:
                                    type: string
                                    enum: [openedEdition]
                                  mode:
                                    type: string
                                    description: "`recently_published` or `specific_emails`."
                                  numberOfEmails:
                                    type: integer
                                    description: "Number of recently-published editions to consider, 1-50. Used only with mode=recently_published."
                                  newsletterIds:
                                    type: array
                                    items:
                                      type: string
                                    description: "Specific edition unique identifiers to consider. Used only with mode=specific_emails."
                                  minimum:
                                    type: integer
                                    description: "Minimum number of matching editions required."
                                  maximum:
                                    type: integer
                                    nullable: true
                                    description: "Optional maximum number of matching editions. Omit for no upper bound."
                                required:
                                  - type
                                  - channel
                                  - mode
                                  - minimum
                              - title: clickedLink (engagement window)
                                description: "Matches readers whose clicks over a recently-published window, or a specific set of editions, meet a threshold. Flags: segmentBuilderEngagementWindow (off for everyone as of this writing)."
                                type: object
                                properties:
                                  channel:
                                    type: string
                                    description: "Channel identifier (slug) the engagement is evaluated against."
                                  type:
                                    type: string
                                    enum: [clickedLink]
                                  mode:
                                    type: string
                                    description: "`recently_published` or `specific_emails`."
                                  numberOfEmails:
                                    type: integer
                                    description: "Number of recently-published editions to consider, 1-50. Used only with mode=recently_published."
                                  newsletterIds:
                                    type: array
                                    items:
                                      type: string
                                    description: "Specific edition unique identifiers to consider. Used only with mode=specific_emails."
                                  minimum:
                                    type: integer
                                    description: "Minimum number of matching editions required."
                                  maximum:
                                    type: integer
                                    nullable: true
                                    description: "Optional maximum number of matching editions. Omit for no upper bound."
                                  linkUrls:
                                    type: array
                                    items:
                                      type: string
                                    description: "Narrow to these specific link URLs. Omit or leave empty to match a click on any link."
                                required:
                                  - type
                                  - channel
                                  - mode
                                  - minimum
                              - title: geoRadius
                                description: "Matches contacts within a radius of a location. Flags: contactGeolocationSegments (off for everyone as of this writing)."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [geoRadius]
                                  latitude:
                                    type: number
                                    description: "Center latitude, -90 to 90."
                                  longitude:
                                    type: number
                                    description: "Center longitude, -180 to 180."
                                  distanceMiles:
                                    type: number
                                    description: "Radius in miles. Must be greater than zero."
                                required:
                                  - type
                                  - latitude
                                  - longitude
                                  - distanceMiles
                              - title: polledAnswer
                                description: "Matches readers who chose a specific poll answer, across every edition the poll appeared in. Flags: engagementSegments gates the condition type itself (off for everyone as of this writing); resolving voters from a send through a non-Letterhead ESP additionally needs pollSegmentsAllEsps (also off for everyone as of this writing)."
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum: [polledAnswer]
                                  pollId:
                                    type: integer
                                    description: "The poll's identifier."
                                  optionId:
                                    type: integer
                                    description: "The chosen option's identifier."
                                required:
                                  - type
                                  - pollId
                                  - optionId
                          suppressionSegmentIds:
                            type: array
                            items:
                              type: integer
                            description: IDs of other segments (same company) whose members are excluded from this
                              segment's audience.
                      channelSlugs:
                        type: array
                        items:
                          type: string
                        description: Channels the segment is scoped to. An empty array means it is available
                          on every channel.
                      createdAt:
                        type: string
                        description: Creation timestamp.
                      updatedAt:
                        type: string
                        description: Last-updated timestamp.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  id: 5
                  name: Engaged opens - last 60 days
                  description: Updated window
                  criteria:
                    matchMode: all
                    conditions:
                      - type: tag
                        operator: has
                        value: engaged
                    suppressionSegmentIds: []
                  channelSlugs: []
                  createdAt: '2026-05-20 17:48:15'
                  updatedAt: '2026-06-20 12:05:00'
                message: Segment updated.
                total: 1
  /api/v3/contacts/segments/{segmentId}/count:
    get:
      tags:
        - Segments
      summary: Count contacts in a segment
      description: |-
        Returns the number of contacts that currently match a segment's criteria.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.

        ## Response

        `200 OK` with an empty `items` array. The match count is returned in the response envelope's `total`, not in `items`.
      operationId: countContactsInASegment
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Count only contacts subscribed to the given channel identifier (slug). Omit for
            the full company audience.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: []
                message: Segment count retrieved.
                total: 1284
    parameters:
      - name: segmentId
        in: path
        description: The segment's identifier. This is the numeric `id` returned by **List segments**
          — not a UUID.
        required: true
        schema:
          type: integer
  /api/v3/contacts/segments/{segmentId}/engagement-timeline:
    get:
      tags:
        - Segments
      summary: Get a segment's engagement over time
      description: |-
        Returns a segment's daily unique-engager rates (open / click / click-to-open / bounce) across a date window.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.

        ## Response

        The daily series is returned under `items`. Each point carries `date`, `deliveredContacts`, `uniqueOpeners`, `uniqueClickers`, `bouncedContacts`, `openRate`, `clickRate`, `clickToOpenRate`, and `bounceRate`. Days with no delivery activity are omitted rather than returned as zero rows.
      operationId: getASegmentEngagementOverTime
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
        - name: dateFrom
          in: query
          description: Start of the window (inclusive), e.g. `2026-06-01`.
          required: true
          schema:
            type: string
        - name: dateTo
          in: query
          description: End of the window (inclusive). Must be on or after `dateFrom`.
          required: true
          schema:
            type: string
        - name: channel
          in: query
          description: Restrict the timeline to the given channel identifier (slug).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        deliveredContacts:
                          type: integer
                        uniqueOpeners:
                          type: integer
                        uniqueClickers:
                          type: integer
                        bouncedContacts:
                          type: integer
                        openRate:
                          type: number
                        clickRate:
                          type: number
                        clickToOpenRate:
                          type: number
                        bounceRate:
                          type: number
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - date: '2026-06-07'
                    deliveredContacts: 412
                    uniqueOpeners: 198
                    uniqueClickers: 24
                    bouncedContacts: 3
                    openRate: 48.1
                    clickRate: 5.8
                    clickToOpenRate: 12.1
                    bounceRate: 0.7
                  - date: '2026-06-14'
                    deliveredContacts: 428
                    uniqueOpeners: 221
                    uniqueClickers: 31
                    bouncedContacts: 2
                    openRate: 51.6
                    clickRate: 7.2
                    clickToOpenRate: 14
                    bounceRate: 0.5
                  - date: '2026-06-21'
                    deliveredContacts: 435
                    uniqueOpeners: 209
                    uniqueClickers: 28
                    bouncedContacts: 5
                    openRate: 48
                    clickRate: 6.4
                    clickToOpenRate: 13.4
                    bounceRate: 1.1
                message: Segment engagement timeline retrieved.
                total: 3
    parameters:
      - name: segmentId
        in: path
        description: The segment's identifier. This is the numeric `id` returned by **List segments**
          — not a UUID.
        required: true
        schema:
          type: integer
  /api/v3/contacts/segments/{segmentId}/engagement-timeline/csv:
    get:
      tags:
        - Segments
      summary: Download a segment's engagement over time (CSV)
      description: |-
        Streams the same daily unique-engager series as **Segment engagement timeline**, but as a downloadable CSV file (`Content-Type: text/csv`, `Content-Disposition: attachment`).

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.

        ## Response

        A CSV file with the header row `date,deliveredContacts,uniqueOpeners,uniqueClickers,bouncedContacts,openRate,clickRate,clickToOpenRate,bounceRate` followed by one row per day that has delivery activity. Days with no delivery are omitted.
      operationId: downloadASegmentEngagementOverTime
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
        - name: dateFrom
          in: query
          description: Start of the window (inclusive), e.g. `2026-06-01`.
          required: true
          schema:
            type: string
        - name: dateTo
          in: query
          description: End of the window (inclusive). Must be on or after `dateFrom`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            text/csv:
              schema:
                type: string
              example: |-
                "date","deliveredContacts","uniqueOpeners","uniqueClickers","bouncedContacts","openRate","clickRate","clickToOpenRate","bounceRate"
                2026-06-07,412,198,24,3,48.1,5.8,12.1,0.7
                2026-06-14,428,221,31,2,51.6,7.2,14,0.5
                2026-06-21,435,209,28,5,48,6.4,13.4,1.1
    parameters:
      - name: segmentId
        in: path
        description: The segment's identifier. This is the numeric `id` returned by **List segments**
          — not a UUID.
        required: true
        schema:
          type: integer
