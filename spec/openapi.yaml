    parameters:
      - name: email
        in: path
        required: true
        description: The contact's email address, URL-encoded.
        schema:
          type: string
    put:
      tags:
        - Contacts
      summary: Update a contact
      description: |-
        Updates an existing company-level contact's profile. The contact is identified by the `{email}` in the URL, so `email` is not part of the request body.

        If you don't yet know whether the contact exists, use **Create or update a contact** (`POST /api/v3/contacts`) instead — that endpoint upserts. This endpoint targets a contact that already exists.

        ## Custom fields

        Pass a `customFields` object to set values on the contact's custom fields. Each key is the name of a custom field you've defined for your company, and the value is coerced to that field's configured type (text, number, boolean, or date).

        ```json
        {
          "customFields": {
            "favoriteColor": "blue",
            "lifetimeValue": 250
          }
        }
        ```

        Notes:

        - Each key must match a custom field that already exists for your company. Unknown field names are rejected.
        - Keys beginning with `__lh.` are reserved for Letterhead's system-managed fields and cannot be set.
      operationId: updateAContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: The contact's first name.
                lastName:
                  type: string
                  description: The contact's last name.
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to set on the contact.
                customFields:
                  type: object
                  properties:
                    favoriteColor:
                      type: string
                    lifetimeValue:
                      type: integer
                  description: Values for your company's custom fields, keyed by field name. See below.
                channel:
                  type: string
                  description: A channel slug. Scopes the tag-change trigger for tags this update adds; omit for a company-wide edit.
            example:
              firstName: Avery
              lastName: Chen
              tags:
                - engaged-readers
                - the-north
              customFields:
                favoriteColor: blue
                lifetimeValue: 250
      responses:
        '200':
          description: 200 OK. Returns the updated contact — same shape as `GET
            /api/v3/contacts/{email}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The updated contact. Full field list under `GET
                      /api/v3/contacts/{email}`.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: avery.chen@example.com
                  firstName: Avery
                  lastName: Chen
                  tags:
                    - engaged-readers
                    - the-north
                  customFields:
                    favoriteColor: blue
                    lifetimeValue: 250
                  updatedAt: '2026-08-30T15:01:21+00:00'
                message: Contact updated.
                total: 1
    delete:
      tags:
        - Contacts
      summary: Delete a contact
      description: |-
        Deletes a company-level contact and every subscription, tag, custom field value, and consent record attached to it. This cannot be undone.

        This is a company-level (v3) write. Authenticate with a company API key as a Bearer token.
      operationId: deleteAContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
              required:
                - api
            example:
              api: true
      responses:
        '200':
          description: Contact deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {}
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: []
                message: Contact deleted.
                total: 0
  /api/v3/contacts/{email}/activity:
    get:
      tags:
        - Contacts
      summary: Get a contact's activity
      description: |-
        Returns one page of a contact's engagement events across your company's newsletters — deliveries, opens, clicks, bounces, and purchases — newest first by default. Each entry names the newsletter the event happened on and, for clicks, the URL that was clicked.

        Use this when you want the event-by-event history. For the rolled-up counters and rates, use **Get a contact's engagement breakdown**. For just the single most recent event timestamp, use **Get a contact's last activity**.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.

        ## Error responses

        A parameter outside its allowed range returns `400`. Validation messages are returned in `data`, not in `items`.
      operationId: getAContactActivity
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
        - name: eventType[]
          in: query
          description: Repeatable. Return only these event types. One or more of `delivery`, `open`, `click`,
            `bounce`, `purchase`. Omit to return all five.
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Free-text filter across the event's newsletter title and link URL. Max 255 characters.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: 1-based page number. Minimum 1. Defaults to 1.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Events per page. Minimum 1, maximum 100. Defaults to 50.
          required: false
          schema:
            type: integer
        - name: direction
          in: query
          description: 'Sort order on the event timestamp: `desc` (newest first, the default) or `asc`.'
          required: false
          schema:
            type: string
        - name: channel
          in: query
          description: Narrow the feed to a single newsletter by its channel slug. Returns `404` if
            the slug doesn't match a channel in your company, or `403` if it names another company's
            channel. Omit for every newsletter in the company.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: 'The event type: `delivery`, `open`, `click`, `bounce`, or
                                `purchase`.'
                            occurredAt:
                              type: string
                              description: When the event happened, ISO 8601 in UTC.
                            campaignId:
                              type: string
                              description: Identifier of the newsletter send the event belongs to. A 10-character
                                alphanumeric string, such as `ruf4e0ifs9`.
                            letterTitle:
                              type: string
                              description: Title of the newsletter that produced the event.
                            linkUrl:
                              type: string
                              description: For `click` events, the URL that was clicked. Null otherwise.
                            channelName:
                              type: string
                              description: Display name of the newsletter's channel. Null for company-level
                                sends, which are not tied to a single channel.
                            channel:
                              type: string
                              description: Slug of the newsletter's channel. Null for company-level sends.
                            bounceType:
                              type: string
                              nullable: true
                              description: For `bounce` events, the bounce classification (for example
                                `hard`, `soft`, `admin`, `block`). Null otherwise.
                            bounceReason:
                              type: string
                              nullable: true
                              description: For `bounce` events, the human-readable reason, with internal
                                ESP details removed. Null otherwise.
                            purchaseAmount:
                              type: string
                              nullable: true
                              description: For `purchase` events, the amount. Null otherwise.
                            purchaseCurrency:
                              type: string
                              nullable: true
                              description: For `purchase` events, the ISO currency code. Null otherwise.
                            purchaseSource:
                              type: string
                              nullable: true
                              description: For `purchase` events, where the purchase was recorded. Null
                                otherwise.
                            purchaseProductName:
                              type: string
                              nullable: true
                              description: For `purchase` events, the product purchased. Null otherwise.
                            isPromotion:
                              type: boolean
                              description: True when the event is attributed to a promotion rather than
                                editorial content.
                            ipAddress:
                              type: string
                      page:
                        type: integer
                      limit:
                        type: integer
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  entries:
                    - type: click
                      occurredAt: '2026-08-14T14:22:07+00:00'
                      campaignId: 9f1c0925-3f0e-59b5-b26a-62e952f17f57
                      letterTitle: The Thursday Briefing
                      linkUrl: https://example.com/city-council-votes-on-transit-plan
                      channelName: Daily Digest
                      channel: daily-digest
                      bounceType: null
                      bounceReason: null
                      purchaseAmount: null
                      purchaseCurrency: null
                      purchaseSource: null
                      purchaseProductName: null
                      isPromotion: false
                      ipAddress: 203.0.113.42
                    - type: open
                      occurredAt: '2026-08-14T14:21:35+00:00'
                      campaignId: 9f1c0925-3f0e-59b5-b26a-62e952f17f57
                      letterTitle: The Thursday Briefing
                      linkUrl: null
                      channelName: Daily Digest
                      channel: daily-digest
                      bounceType: null
                      bounceReason: null
                      purchaseAmount: null
                      purchaseCurrency: null
                      purchaseSource: null
                      purchaseProductName: null
                      isPromotion: false
                      ipAddress: 203.0.113.42
                    - type: delivery
                      occurredAt: '2026-08-14T11:00:04+00:00'
                      campaignId: 9f1c0925-3f0e-59b5-b26a-62e952f17f57
                      letterTitle: The Thursday Briefing
                      linkUrl: null
                      channelName: Daily Digest
                      channel: daily-digest
                      bounceType: null
                      bounceReason: null
                      purchaseAmount: null
                      purchaseCurrency: null
                      purchaseSource: null
                      purchaseProductName: null
                      isPromotion: false
                      ipAddress: null
                    - type: bounce
                      occurredAt: '2026-08-07T11:00:11+00:00'
                      campaignId: 5d7ca091-9ee8-ca65-3737-c3a7be269f95
                      letterTitle: The Thursday Briefing
                      linkUrl: null
                      channelName: Daily Digest
                      channel: daily-digest
                      bounceType: soft
                      bounceReason: Mailbox full
                      purchaseAmount: null
                      purchaseCurrency: null
                      purchaseSource: null
                      purchaseProductName: null
                      isPromotion: false
                      ipAddress: null
                  page: 1
                  limit: 50
                message: Activity retrieved.
                total: 218
        '400':
          description: 400 Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data:
                  - The limit may not be greater than 100.
                items: []
                message: Looks like the input data doesn't meet our requirements.
                total: 0
    parameters:
      - name: email
        in: path
        description: The contact's email address.
        required: true
        schema:
          type: string
  /api/v3/contacts/{email}/engagement:
    get:
      tags:
        - Contacts
      summary: Get a contact's engagement breakdown
      description: |-
        Returns a contact's lifetime engagement rolled up into counters and rates — how many newsletters reached them, how many they opened and clicked, their bounce history, and how often they clicked a promotion.

        This is the summary counterpart to **Get a contact's activity**, which returns the individual events these numbers are derived from.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getAContactEngagementBreakdown
      parameters:
        - name: api
          in: query
          description: Set to true.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Roll up only the contact's activity on a single newsletter, by channel slug. Returns
            `404` if the slug doesn't match a channel in your company, or `403` if it names another
            company's channel. Omit for every newsletter in the company.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      delivered:
                        type: integer
                        description: Newsletters successfully delivered to the contact.
                      uniqueOpens:
                        type: integer
                        description: Newsletters the contact opened at least once.
                      uniqueClicks:
                        type: integer
                        description: Newsletters in which the contact clicked at least one link.
                      openRate:
                        type: number
                        description: '`uniqueOpens` as a percentage of `delivered`.'
                      clickRate:
                        type: number
                        description: '`uniqueClicks` as a percentage of `delivered`.'
                      clickToOpenRate:
                        type: number
                        description: '`uniqueClicks` as a percentage of `uniqueOpens`.'
                      softBounces:
                        type: integer
                        description: Soft bounces recorded for the contact — temporary failures such as
                          a full mailbox.
                      hardBounces:
                        type: integer
                        description: Hard bounces recorded for the contact — permanent failures such as
                          an invalid address.
                      promotionClicks:
                        type: integer
                        description: Clicks the contact made on promotions, as opposed to editorial links.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  delivered: 184
                  uniqueOpens: 121
                  uniqueClicks: 37
                  openRate: 65.8
                  clickRate: 20.1
                  clickToOpenRate: 30.6
                  softBounces: 2
                  hardBounces: 0
                  promotionClicks: 4
                message: Engagement breakdown retrieved.
                total: 1
    parameters:
      - name: email
        in: path
        description: The contact's email address.
        required: true
        schema:
          type: string
  /api/v3/contacts/{email}/last-active:
    get:
      tags:
        - Contacts
      summary: Get a contact's last activity
      description: |-
        Returns just the single most recent engagement event for a contact — its type (`delivery`, `open`, `click`, `bounce`, or `purchase`) and when it happened. For the full event-by-event history, use **Get a contact's activity**; for rolled-up counters and rates, use **Get a contact's engagement breakdown**.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getAContactLastActivity
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Narrow to the contact's most recent event on a single newsletter, by channel
            slug. Returns `404` if the slug doesn't match a channel in your company, or `403` if it
            names another company's channel. Omit for the most recent event across every newsletter
            in the company.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      occurredAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  label: open
                  occurredAt: '2026-06-16T19:00:37+00:00'
                message: Last active retrieved.
                total: 1
    parameters:
      - name: email
        in: path
        required: true
        description: The contact's email address, URL-encoded.
        schema:
          type: string
  /api/v3/contacts/{email}/suppressions:
    get:
      tags:
        - Contacts
      summary: Get a contact's suppressions
      description: |-
        Returns every channel the contact can no longer be mailed on — because they unsubscribed or their address was cleaned after bouncing — with the reason and, where available, the bounce evidence behind it.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getAContactSuppressions
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        channel:
                          type: object
                          nullable: true
                          properties:
                            slug:
                              type: string
                            name:
                              type: string
                          description: Null for a company-wide suppression, or for a channel that has
                            since been deleted.
                        scope:
                          type: string
                          description: '`global` (suppressed everywhere) or `channel` (suppressed on
                            this channel only).'
                        reason:
                          type: string
                          description: Why the contact is suppressed, for example `unsubscribed` or `bounced`.
                        source:
                          type: string
                          nullable: true
                        occurredAt:
                          type: string
                          nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - channel:
                      slug: the-daily
                      name: The Daily
                    scope: channel
                    reason: bounced
                    source: sparkpost
                    occurredAt: '2026-06-02T08:14:11+00:00'
                  - channel: null
                    scope: global
                    reason: unsubscribed
                    source: null
                    occurredAt: '2026-05-14T19:40:02+00:00'
                message: Suppressions retrieved.
                total: 2
    parameters:
      - name: email
        in: path
        required: true
        description: The contact's email address, URL-encoded.
        schema:
          type: string
  /api/v3/contacts/{email}/export:
    get:
      tags:
        - Contacts
      summary: Export a contact's profile as XLSX
      description: |-
        Downloads a multi-sheet Excel workbook of everything visible on the contact's profile — their details, subscriptions, tags, custom fields, engagement summary, and full activity history.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
