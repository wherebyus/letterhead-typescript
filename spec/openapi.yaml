  /api/v3/metrics/clicks/links:
    post:
      tags:
        - Metrics
      summary: Get link clicks overview
      description: |-
        Per-URL click totals for your company's clicks dashboard, with each link's page title, site
        name, and content topics — sourced from the link content graph joined against click metrics
        and the IAB content taxonomy.

        `v3` endpoints expect a company API key.
      operationId: getLinkClicks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: When set to `true`, this endpoint will accept authorization with your API
                    Key.
                  example: 'true'
                from:
                  type: string
                  description: Period start date (inclusive).
                  example: '2026-02-26'
                to:
                  type: string
                  description: Period end date (inclusive), must be >= `from`.
                  example: '2026-03-26'
                channels[]:
                  type: string
                  description: '`string[]` | Optionally filter to a list of channels (by their slugs).'
                  example: an-example-channel
                page:
                  type: string
                  description: Page number. Defaults to 1.
                  example: '1'
                limit:
                  type: string
                  description: Items per page. Max of 100. Defaults to 10.
                  example: '10'
              required:
                - api
                - from
                - to
      responses:
        '200':
          description: Get link clicks overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        urlMd5:
                          type: string
                        pageTitle:
                          type: string
                        siteName:
                          type: string
                        topics:
                          type: array
                          items:
                            type: string
                        clicks:
                          type: integer
                        clicksUnique:
                          type: integer
                  message:
                    type: string
                  total:
                    type: integer
                    description: Total matching links, for pagination — not a click count.
              example:
                items:
                  - url: https://example.com/an-article
                    urlMd5: 5d41402abc4b2a76b9719d911017c592
                    pageTitle: An Example Article
                    siteName: Example News
                    topics:
                      - Local News
                    clicks: 84
                    clicksUnique: 61
                message: Clicks dashboard links retrieved.
                total: 1
        '400':
          description: 400 Validation Error — `from`/`to` missing, malformed, or `from` is after `to`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  items:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  total:
                    type: integer
              example:
                data:
                  - The from date must be on or before the to date.
                items: []
                message: Looks like the input data doesn't meet our requirements.
                total: 0
