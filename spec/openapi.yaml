openapi: 3.0.3
info:
  title: Letterhead API
  description: |-
    Letterhead's API lets you build around your newsletters — your audience, your
    content, your sending, and your reporting.

    We release it with stability in mind, and we add to it regularly. If something looks wrong, or
    you need something that isn't here yet, [let us know](https://help.tryletterhead.com/kb-tickets/new).

    ## Authorization

    Every request needs a **Bearer token**. Administrators can
    [generate an API key](https://help.tryletterhead.com/api/managing-api-keys/) at any time from
    **Settings -> API Keys**, then send it in the `Authorization` header:

    ```
    Authorization: Bearer <your-api-key>
    ```

    Keys are company-scoped: one key reaches every newsletter in your account.

    Most read endpoints also expect `api=true` in the query string, which tells Letterhead you are
    authenticating with an API key rather than a signed-in session.
  version: 3.0.0
  contact:
    name: Letterhead Support
    url: https://help.tryletterhead.com/support/contact-support/
servers:
  - url: https://api.tryletterhead.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Contacts
    description: Contacts are your audience across your whole company — the people you send to, their
      subscriptions, tags, and how they engage.
    x-lastAudited: '2026-09-09'
    x-lastAuditedBy: docs-audit-loop
  - name: Segments
    description: Segments are saved groups of contacts you can target and report on.
    x-lastAudited: '2026-10-08'
    x-lastAuditedBy: docs-audit-loop
  - name: Letters
    description: A letter is a single edition of a newsletter. These endpoints let you draft, update,
      retrieve, and send them, and read how letters and subject lines performed.
    x-lastAudited: '2026-09-10'
    x-lastAuditedBy: docs-audit-loop
  - name: Curations
    description: Curations let you gather content from around the web and distribute it across one or
      more of your newsletters.
    x-lastAudited: '2026-09-05'
    x-lastAuditedBy: docs-audit-loop
  - name: Promotions
    description: Promotions are the paid placements you run inside your newsletters.
    x-lastAudited: '2026-09-07'
    x-lastAuditedBy: docs-audit-loop
  - name: Channels
    description: A channel is a single newsletter. Every subscriber, letter, and curation belongs to one.
    x-lastAudited: '2026-09-04'
    x-lastAuditedBy: docs-audit-loop
  - name: Metrics
    description: How your sending is performing — the totals and daily figures behind opens, clicks, bounces,
      and unsubscribes.
    x-lastAudited: '2026-09-08'
    x-lastAuditedBy: docs-audit-loop
  - name: Automations
    description: Automations send a sequence of emails on their own once someone qualifies for it. These
      endpoints let you change the template an automation uses and restart one that has stopped.
    x-lastAudited: '2026-09-06'
    x-lastAuditedBy: docs-audit-loop
  - name: Transactional Email
    description: Transactional emails are one-off messages to an individual, such as a password reset
      or a purchase confirmation. This service is available on request and needs a dedicated sending IP.
    x-lastAudited: '2026-09-30'
    x-lastAuditedBy: docs-audit-loop
  - name: Teams
    description: The people who have access to your Letterhead account, and the API for inviting,
      updating, and removing them.
    x-lastAudited: '2026-09-11'
    x-lastAuditedBy: docs-audit-loop
  - name: Agents
    description: Agents review a letter before it goes out and report what they find. Preflight agents
      are available today; Analyze agents may need to be enabled for your account — contact support if
      you don't see them.
    x-lastAudited: '2026-10-02'
    x-lastAuditedBy: docs-audit-loop
  - name: Links
    description: The links inside your letters and the categories they fall into. These endpoints are in development and not
      yet available.
    x-lastAudited: '2026-09-03'
    x-lastAuditedBy: docs-audit-loop
paths:
  /api/v3/contacts/overview:
    get:
      tags:
        - Contacts
      summary: Get a contacts overview
      description: |-
        Returns the summary banner rollup for your company-level audience: total subscriber count, total channel and newsletter-group counts, and a breakdown of your channels into three health buckets (`growing`, `stable`, `needsAttention`).

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getContactsOverview
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      totalSubscribers:
                        type: integer
                      totalChannels:
                        type: integer
                      totalGroups:
                        type: integer
                      health:
                        type: object
                        properties:
                          growing:
                            type: integer
                          stable:
                            type: integer
                          needsAttention:
                            type: integer
                      lastUpdated:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  totalSubscribers: 48213
                  totalChannels: 6
                  totalGroups: 2
                  health:
                    growing: 3
                    stable: 2
                    needsAttention: 1
                  lastUpdated: '2026-08-30T04:00:11+00:00'
                message: Contacts overview
                total: 1
  /api/v3/contacts/metrics/groups:
    get:
      tags:
        - Contacts
      summary: Get channel health grouped by newsletter group
      description: |-
        Returns a subscriber-health rollup for every one of your newsletters, grouped the same way your newsletter groups are organized. For each newsletter you get the current subscriber count, the net change over the last 30 days, a breakdown of your audience into five engagement segments (`loyalists`, `newAndEngaged`, `casual`, `fading`, `ghosts`) each with a percentage and a trend (`up`, `down`, or `stable`), and an overall health bucket (`growing`, `stable`, or `needsAttention`).

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getChannelHealthGroupedByNewsletterGroup
      parameters:
        - name: api
          in: query
          description: Required. Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            group:
                              type: object
                              properties:
                                slug:
                                  type: string
                                name:
                                  type: string
                            totalSubscribers:
                              type: integer
                            channels:
                              type: array
                              items:
                                type: object
                                properties:
                                  channel:
                                    type: object
                                    properties:
                                      slug:
                                        type: string
                                      name:
                                        type: string
                                      latestLetterTitle:
                                        type: string
                                        description: Title of the channel's most recently created letter.
                                          Omitted for a channel with no letters yet.
                                  subscribers:
                                    type: integer
                                  netGrowth:
                                    type: integer
                                    description: Net change in subscribers over the last 30 days.
                                  segments:
                                    type: object
                                    description: One entry per engagement segment (`loyalists`, `newAndEngaged`,
                                      `casual`, `fading`, `ghosts`), each with a `percentage` and a `trend`
                                      (`up`, `down`, or `stable`).
                                    additionalProperties:
                                      type: object
                                      properties:
                                        percentage:
                                          type: integer
                                        trend:
                                          type: string
                                  health:
                                    type: string
                                    description: '`growing`, `stable`, or `needsAttention`.'
                                  senderHealth:
                                    type: object
                                    description: The channel's sender health score, when available.
                                    properties:
                                      score:
                                        type: integer
                                        nullable: true
                                      severity:
                                        type: string
                                      trend:
                                        type: string
                      lastUpdated:
                        type: string
                        nullable: true
                        description: When the underlying growth snapshot was last refreshed. Null if
                          no snapshot exists yet.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  groups:
                    - group:
                        slug: newsletters
                        name: Newsletters
                      totalSubscribers: 21200
                      channels:
                        - channel:
                            slug: the-daily
                            name: The Daily
                            latestLetterTitle: The Thursday Briefing
                          subscribers: 12400
                          netGrowth: 340
                          segments:
                            loyalists:
                              percentage: 42
                              trend: up
                            newAndEngaged:
                              percentage: 18
                              trend: stable
                            casual:
                              percentage: 21
                              trend: down
                            fading:
                              percentage: 12
                              trend: stable
                            ghosts:
                              percentage: 7
                              trend: stable
                          health: growing
                          senderHealth:
                            score: 87
                            severity: healthy
                            trend: stable
                message: Groups metrics retrieved.
                total: 1
  /api/v3/contacts:
    post:
      tags:
        - Contacts
      summary: Create or update a contact
      description: |-
        Creates a company-level contact, or updates the existing contact if one with the same email already exists (an upsert).

        - If no contact with the given `email` exists, a new contact is created and the response is `201 Created`.
        - If a contact with that `email` already exists, its profile is updated with the fields in the request body and the response is `200 OK`.
        - If a `channel` is supplied (see below), an already-existing contact's profile is **not** overwritten — the contact is simply subscribed to that channel.

        ## Custom fields

        Pass a `customFields` object to set values on the contact's custom fields. Each key is the name of a custom field you've defined for your company, and the value is coerced to that field's configured type (text, number, boolean, or date).

        ```json
        {
          "email": "person@example.org",
          "customFields": {
            "favoriteColor": "blue",
            "lifetimeValue": 250
          }
        }
        ```

        Notes:

        - Each key must match a custom field that already exists for your company. Unknown field names are rejected.
        - Keys beginning with `__lh.` are reserved for Letterhead's system-managed fields and cannot be set.
        - `customFields` is optional. Omit it to create a contact without setting any custom field values.

        ## Channel subscription

        Provide a `channel` (a channel slug) to subscribe the contact to that channel at creation time. If a company-level contact with the same email already exists, its existing profile is left untouched and the contact is simply subscribed to the channel. Omit `channel` to create the contact at the company level only.

        ## Source

        The optional `source` records where the contact came from — for example, the name of the integration that created it. It is set once on the contact and is not overwritten by later updates. A create without a `source` is recorded as a hand-entered `manual` contact.
      operationId: createOrUpdateAContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                email:
                  type: string
                  description: The contact's email address. Identifies the contact for the upsert.
                firstName:
                  type: string
                  description: The contact's first name.
                lastName:
                  type: string
                  description: The contact's last name.
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to apply to the contact.
                customFields:
                  type: object
                  properties:
                    favoriteColor:
                      type: string
                    lifetimeValue:
                      type: integer
                  description: Values for your company's custom fields, keyed by field name. See below.
                source:
                  type: string
                  description: Origin label for where the contact came from. Recorded once and never overwritten.
                    Defaults to `manual` when omitted. See below.
              required:
                - email
            example:
              api: true
              email: person@example.org
              firstName: Michael
              lastName: Jones
              tags:
                - amazing-contact
                - engaged
              customFields:
                favoriteColor: blue
                lifetimeValue: 250
              source: website-signup
      responses:
        '200':
          description: Existing contact updated. Same response shape as `201` below, and as `GET
            /api/v3/contacts/{email}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The updated contact. Full field list under `GET
                      /api/v3/contacts/{email}`.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: person@example.org
                  firstName: Michael
                  lastName: Jones
                message: Contact updated.
                total: 1
        '201':
          description: New contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The created or updated contact. Full field list under `GET
                      /api/v3/contacts/{email}`.
                    properties:
                      email:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      customFields:
                        type: object
                      subscriptions:
                        type: array
                        items:
                          type: object
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: person@example.org
                  firstName: Michael
                  lastName: Jones
                  tags:
                    - amazing-contact
                    - engaged
                  customFields:
                    favoriteColor: blue
                    lifetimeValue: 250
                  subscriptions: []
                  createdAt: '2026-08-30T15:01:21+00:00'
                  updatedAt: '2026-08-30T15:01:21+00:00'
                message: Contact created.
                total: 1
  /api/v3/contacts/lookup:
    post:
      tags:
        - Contacts
      summary: Look up a contact by an address they hold
      description: |-
        Resolves a company-level contact from an address they hold on another notification medium — currently SMS phone numbers only. Deliberately a `POST` rather than a `GET /contacts/{address}`-style lookup: a phone number in a URL would land in access logs, proxy logs, and browser history.

        The address is normalized the same way it was when the contact registered it, so you can send whatever format you hold — no need to pre-format it yourself.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: lookupAContactByAnAddressTheyHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                medium:
                  type: string
                  description: The notification medium the address belongs to. Currently only `sms`
                    is supported.
                  enum:
                    - sms
                address:
                  type: string
                  description: The address to search for, in whatever format you hold it.
              required:
                - medium
                - address
            example:
              api: true
              medium: sms
              address: '+15555550100'
      responses:
        '200':
          description: 200 OK. Returns the matching contact — same shape as `GET
            /api/v3/contacts/{email}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: The matching contact. Full field list under `GET
                      /api/v3/contacts/{email}`.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: avery.chen@example.com
                  firstName: Avery
                  lastName: Chen
                message: Contact retrieved.
                total: 1
  /api/v3/contacts/overlap:
    get:
      tags:
        - Contacts
      summary: Get audience overlap across all newsletters
      description: |-
        Returns a pairwise newsletter-overlap matrix across your company audience. For every pair of your newsletters it reports how many **active subscribers** the two share, and the diagonal carries each newsletter's own active-subscriber total. Counts are deduplicated by email across your audience.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getAudienceOverlapAcrossAllNewsletters
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      newsletters:
                        type: array
                        items:
                          type: object
                          properties:
                            channel:
                              type: string
                              description: The newsletter's channel identifier (slug).
                            name:
                              type: string
                              description: The newsletter's display name.
                            activeSubscribers:
                              type: integer
                              description: The newsletter's own active-subscriber total.
                        description: One entry per newsletter — the matrix diagonal.
                      overlaps:
                        type: array
                        items:
                          type: object
                          properties:
                            channels:
                              type: array
                              items:
                                type: object
                                properties:
                                  channel:
                                    type: string
                                  name:
                                    type: string
                              description: The two newsletters in the pair, each as `{ channel, name }`.
                            sharedActiveSubscribers:
                              type: integer
                              description: Active subscribers shared by the pair.
                        description: One entry per newsletter pair — the off-diagonal cells.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  newsletters:
                    - channel: the-daily
                      name: The Daily
                      activeSubscribers: 12400
                    - channel: weekend-reads
                      name: Weekend Reads
                      activeSubscribers: 8800
                    - channel: product-updates
                      name: Product Updates
                      activeSubscribers: 5300
                  overlaps:
                    - channels:
                        - channel: the-daily
                          name: The Daily
                        - channel: weekend-reads
                          name: Weekend Reads
                      sharedActiveSubscribers: 3100
                    - channels:
                        - channel: the-daily
                          name: The Daily
                        - channel: product-updates
                          name: Product Updates
                      sharedActiveSubscribers: 1450
                    - channels:
                        - channel: weekend-reads
                          name: Weekend Reads
                        - channel: product-updates
                          name: Product Updates
                      sharedActiveSubscribers: 920
                message: Newsletter overlap matrix
                total: 1
  /api/v3/contacts/overlap/selection:
    get:
      tags:
        - Contacts
      summary: Compare audience overlap for selected newsletters
      description: |-
        Returns a Venn-style overlap breakdown for a chosen set of **2 to 5 newsletters** from your company audience: the total unique reach across the set, each newsletter's own total plus the count exclusive to it, and the shared count for every group of two or more of the selected newsletters. Counts are active subscribers only, deduplicated by email.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: compareAudienceOverlapForSelectedNewsletters
      parameters:
        - name: channels[]
          in: query
          description: Channel identifier (slug) of a newsletter to compare. Repeat the parameter once
            per newsletter — between 2 and 5 in total, and each must be distinct.
          required: true
          schema:
            type: string
        - name: api
          in: query
          description: Set to `true` to receive the JSON API response.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueReach:
                        type: integer
                        description: Distinct contacts active on at least one newsletter in the set (the
                          deduped union).
                      newsletters:
                        type: array
                        items:
                          type: object
                          properties:
                            channel:
                              type: string
                              description: The newsletter's channel identifier (slug).
                            name:
                              type: string
                              description: The newsletter's display name.
                            activeSubscribers:
                              type: integer
                              description: The newsletter's own active-subscriber total.
                            exclusiveActiveSubscribers:
                              type: integer
                              description: Subscribers active on this newsletter and no other in the set.
                        description: One entry per selected newsletter.
                      groupOverlaps:
                        type: array
                        items:
                          type: object
                          properties:
                            channels:
                              type: array
                              items:
                                type: object
                                properties:
                                  channel:
                                    type: string
                                  name:
                                    type: string
                              description: The newsletters in the overlap region, each as `{ channel,
                                name }`.
                            sharedActiveSubscribers:
                              type: integer
                              description: Subscribers shared across that group.
                        description: One entry per group of 2 or more selected newsletters (the intersection
                          regions).
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueReach: 18100
                  newsletters:
                    - channel: channel-one
                      name: The Daily
                      activeSubscribers: 12400
                      exclusiveActiveSubscribers: 9300
                    - channel: channel-two
                      name: Weekend Reads
                      activeSubscribers: 8800
                      exclusiveActiveSubscribers: 5700
                  groupOverlaps:
                    - channels:
                        - channel: channel-one
                          name: The Daily
                        - channel: channel-two
                          name: Weekend Reads
                      sharedActiveSubscribers: 3100
                message: Newsletter overlap selection
                total: 1
  /api/v3/contacts/search:
    post:
      tags:
        - Contacts
      summary: Search contacts
      description: |-
        Searches your company-level contacts by keyword, tag, or subscription filters.

        **Request body**

        - `query` — free-text search against the contact's identifying fields.
        - `tags` — restrict to contacts carrying any of these tags.
        - `channel` — a channel slug, or `channelId` (numeric, legacy) — restrict to contacts subscribed on that channel. When both are supplied, `channel` takes precedence.
        - `status` — restrict to subscriptions with this status. Requires `channelId` (or `channel`) to be meaningful.
        - `searchAfter` — the cursor from a previous response's `searchAfter`, to fetch the next page.
        - `pageSize` — results per page (1-100, default 25).
      operationId: searchContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                tags:
                  type: array
                  items:
                    type: string
                query:
                  type: string
                channel:
                  type: string
                  description: A channel slug. Takes precedence over `channelId` when both are supplied.
                channelId:
                  type: integer
                  description: A channel's numeric id (legacy alternative to `channel`).
                status:
                  type: integer
                searchAfter:
                  type: string
                  description: Pagination cursor from a previous response's `searchAfter`.
                pageSize:
                  type: integer
            example:
              api: true
              tags:
                - engaged
              query: you@example.com
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            tags:
                              type: array
                              items:
                                type: string
                            customFields:
                              type: object
                              properties:
                                __lh.engagementRefreshedAt:
                                  type: string
                                __lh.mailboxProvider:
                                  type: string
                                __lh.roleAddress:
                                  type: boolean
                                lastClickDate:
                                  type: string
                                lastOpenDate:
                                  type: string
                            endpoints:
                              type: array
                              items:
                                type: object
                            channelConsents:
                              type: array
                              items:
                                type: object
                            consents:
                              type: array
                              items:
                                type: object
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                            subscriptions:
                              type: array
                              items:
                                type: object
                                properties:
                                  channel:
                                    type: object
                                    properties:
                                      slug:
                                        type: string
                                      name:
                                        type: string
                                  status:
                                    type: integer
                                  createdAt:
                                    type: string
                                  updatedAt:
                                    type: string
                      searchAfter:
                        type: string
                        description: Pass back as the request's `searchAfter` to fetch the next page. Absent on the last page.
                      totalRelation:
                        type: string
                        description: Whether `total` is an exact count or a lower bound (large result sets).
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  contacts:
                    - email: avery.chen@example.com
                      firstName: Avery
                      lastName: Chen
                      tags:
                        - engaged-readers
                        - the-north
                      customFields:
                        __lh.engagementRefreshedAt: '2026-06-18T04:20:28+00:00'
                        __lh.mailboxProvider: gmail
                        __lh.roleAddress: false
                        lastClickDate: '2026-06-17 06:18:18'
                        lastOpenDate: '2026-06-18 05:11:33'
                      endpoints: []
                      channelConsents: []
                      consents: []
                      createdAt: '2026-05-23T11:43:15+00:00'
                      updatedAt: '2026-06-18T09:12:04+00:00'
                      subscriptions:
                        - channel:
                            slug: the-daily
                            name: The Daily
                          status: 1
                          createdAt: '2026-04-30T15:22:41+00:00'
                          updatedAt: '2026-06-12T20:43:14+00:00'
                    - email: jordan.reyes@example.com
                      firstName: Jordan
                      lastName: Reyes
