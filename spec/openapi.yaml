  /api/v3/letters/metrics:
    post:
      tags:
        - Letters
      summary: List letter metrics
      description: |-
        Returns performance metrics for your company's published letters, one row per letter, with pagination. As a `v3` endpoint, it requires a company-derived API key.

        Use it to pull opens, clicks, bounces, and unsubscribes for many letters at once instead of fetching them one at a time. Results are sorted by creation date; use `direction` to choose newest-first (`desc`, the default) or oldest-first (`asc`).

        **Filtering.** Pass `channels` (an array of channel slugs) to restrict results to specific channels, and `createdAtAfter` / `createdAtBefore` (`YYYY-MM-DD`) to restrict them to a creation-date window. To restrict results to letters carrying newsletter tags, pass the tags' `uniqueId` values in `filters.tags` — note that this one sits inside a `filters` object, unlike the other filters. With no filters, letters from every channel your company owns are returned.

        **Response.** `items` holds the array of letters and `total` is the count of letters matching your filters. Each row includes fields such as `uniqueId`, `title`, `channel`, `organization`, `publicationDate`, `delivered`, `opens`, `opensUnique`, `clicks`, `clicksUnique`, `bounced`, and `unsubscribed`, plus derived rates such as `projectedOpenRate`.
      operationId: listLetterMetrics
      parameters:
        - name: api
          in: query
          description: When set to `true`, this endpoint will accept authorization with your API Key.
          required: true
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Page of results to return, starting at `1`.
                  example: 1
                direction:
                  type: string
                  enum:
                    - asc
                    - desc
                  description: Sort order by creation date. Defaults to `desc`.
                createdAtAfter:
                  type: string
                  format: date
                  description: Only include letters created on or after this date (`YYYY-MM-DD`).
                  example: '2026-01-01'
                createdAtBefore:
                  type: string
                  format: date
                  description: Only include letters created on or before this date (`YYYY-MM-DD`).
                  example: '2026-03-31'
                channels:
                  type: array
                  description: Channel slugs to restrict results to. Omit to include every channel.
                  items:
                    type: string
                filters:
                  type: object
                  properties:
                    tags:
                      type: array
                      description: Newsletter-tag `uniqueId` values restricting results to the letters carrying
                        those tags. Get the ids from **List newsletter tags**. Up to 50 per request, each a string,
                        and a letter must carry **every** tag you name — two tags return the letters tagged with
                        both, not either. The `total` in the response counts only the matching letters.
                      maxItems: 50
                      items:
                        type: string
      responses:
        '200':
          description: Letter metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                        title:
                          type: string
                        channel:
                          type: string
                        organization:
                          type: string
                        publicationDate:
                          type: string
                        delivered:
                          type: integer
                        opens:
                          type: integer
                        opensUnique:
                          type: integer
                        clicks:
                          type: integer
                        clicksUnique:
                          type: integer
                        bounced:
                          type: integer
                        unsubscribed:
                          type: integer
                        projectedOpenRate:
                          type: number
                  message:
                    type: string
                  total:
                    type: integer
  /api/v3/letters/metrics/top-performers:
    get:
      tags:
        - Letters
      summary: List top-performing letters
      description: |-
        Returns your company's letters ranked by open rate or click-to-open rate, best first. As a `v3` endpoint, it requires a company-derived API key.

        By default the ranking covers a rolling 90-day window. To rank a specific period instead, pass both `from` and `to` (`YYYY-MM-DD`); passing only one of them is rejected, and `to` cannot be earlier than `from`.

        Use `channels[]` to restrict the ranking to specific channels. Each item includes `uniqueId`, `title`, `channel`, `organization`, `publicationDate`, `editionUrl`, and the counts behind the ranking (`delivered`, `opens`, `opensUnique`, `clicks`, `clicksUnique`).
      operationId: listTopPerformingLetters
      parameters:
        - name: api
          in: query
          description: When set to `true`, this endpoint will accept authorization with your API Key.
          required: true
          schema:
            type: boolean
        - name: metric
          in: query
          description: The rate to rank by. Defaults to `openRate`.
          required: false
          schema:
            type: string
            enum:
              - openRate
              - clickToOpenRate
        - name: channels[]
          in: query
          description: Channel slugs to restrict the ranking to. Repeat the parameter for more than one channel.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: from
          in: query
          description: Start of the period to rank (`YYYY-MM-DD`). Must be sent together with `to`.
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End of the period to rank (`YYYY-MM-DD`). Must be sent together with `from`.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Top-performing letters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                        title:
                          type: string
                        channel:
                          type: string
                        organization:
                          type: string
                        publicationDate:
                          type: string
                        editionUrl:
                          type: string
                        delivered:
                          type: integer
                        opens:
                          type: integer
                        opensUnique:
                          type: integer
                        clicks:
                          type: integer
                        clicksUnique:
                          type: integer
                  message:
                    type: string
                  total:
                    type: integer
