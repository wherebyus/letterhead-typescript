  /api/v3/contacts/engagement-timeline:
    get:
      tags:
        - Contacts
      summary: Get your whole audience's engagement over time
      description: |-
        Returns your whole company audience's daily unique-engager rates (open / click / click-to-open / bounce) across a date window — the "Everyone" default of the engagement-over-time chart. For a single saved segment's series, use **Get a segment's engagement over time**.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: getYourWholeAudienceEngagementOverTime
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
        - name: dateFrom
          in: query
          description: Start of the window (inclusive), e.g. `2026-06-01`.
          required: true
          schema:
            type: string
        - name: dateTo
          in: query
          description: End of the window (inclusive). Must be on or after `dateFrom`.
          required: true
          schema:
            type: string
        - name: channel
          in: query
          description: Restrict the timeline to the given channel identifier (slug).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        deliveredContacts:
                          type: integer
                        uniqueOpeners:
                          type: integer
                        uniqueClickers:
                          type: integer
                        bouncedContacts:
                          type: integer
                        openRate:
                          type: number
                        clickRate:
                          type: number
                        clickToOpenRate:
                          type: number
                        bounceRate:
                          type: number
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - date: '2026-06-07'
                    deliveredContacts: 21400
                    uniqueOpeners: 9800
                    uniqueClickers: 1220
                    bouncedContacts: 68
                    openRate: 45.8
                    clickRate: 5.7
                    clickToOpenRate: 12.4
                    bounceRate: 0.3
                  - date: '2026-06-14'
                    deliveredContacts: 21650
                    uniqueOpeners: 10120
                    uniqueClickers: 1340
                    bouncedContacts: 54
                    openRate: 46.7
                    clickRate: 6.2
                    clickToOpenRate: 13.2
                    bounceRate: 0.2
                message: Audience engagement timeline retrieved.
                total: 2
  /api/v3/contacts/segments:
    get:
      tags:
        - Segments
      summary: List segments
      description: |-
        Lists the company's contact segments. Segments are saved audience queries and evaluated live — distinct from the deprecated `GET /api/v3/audience/segments`, which returns legacy per-channel segments.

        This is a company-level (v3) read. Authenticate with a company API key as a Bearer token.
      operationId: listSegments
      parameters:
        - name: api
          in: query
          description: Set to `true`.
          required: true
          schema:
            type: boolean
        - name: channel
          in: query
          description: Narrow the listing to segments assigned to the given channel identifier (slug),
            plus segments available on every channel. Omit for the full company-wide listing.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The segment's identifier.
                        name:
                          type: string
                          description: The segment's name (unique per company).
                        description:
                          type: string
                          description: The segment's description.
                        criteria:
                          type: object
                          properties:
                            matchMode:
                              type: string
                            conditions:
                              type: array
                              description: At least one condition. The shape of each depends on its `type` — see
                                the schemas below.
                              items:
                                oneOf:
                                - title: customField
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [customField]
                                    customFieldKey:
                                      type: string
                                      description: "The custom field's key (see **List custom field definitions**)."
                                    operator:
                                      type: string
                                      description: "`=`, `>`, `<`, `>=`, `<=`, `inLastDays`, `notInLastDays`, or `isEmpty`."
                                    value:
                                      type: string
                                      description: "Comparison value. Omitted for the isEmpty operator, which carries no value. For inLastDays/notInLastDays, an integer number of days as a string."
                                  required:
                                    - type
                                    - customFieldKey
                                    - operator
                                - title: tag
                                  description: "Matches contacts by tag. Flags: none — on for everyone."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [tag]
                                    operator:
                                      type: string
                                      description: "`has` or `notHas`."
                                    value:
                                      type: string
                                      description: "The tag name."
                                  required:
                                    - type
                                    - operator
                                    - value
                                - title: subscription
                                  description: "Matches contacts by their subscription to a channel. Flags: none — on for everyone."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [subscription]
                                    channelId:
                                      type: integer
                                      description: "The channel to match a subscription on."
                                    status:
                                      type: integer
                                      description: "Optional subscription status to match, 0-7. Omit to match any status."
                                  required:
                                    - type
                                    - channelId
                                - title: text
                                  description: "Free-text match against a contact's email, first name, and last name. Flags: none — on for everyone."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [text]
                                    value:
                                      type: string
                                      description: "The text to search for."
                                  required:
                                    - type
                                    - value
                                - title: openedEdition (single edition)
                                  description: "Matches readers who opened one specific edition — the one-click shortcut from an edition's own metrics. Flags: engagementSegments (off for everyone as of this writing)."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [openedEdition]
                                    letterUniqueId:
                                      type: string
                                      description: "The edition's unique identifier."
                                  required:
                                    - type
                                    - letterUniqueId
                                - title: clickedLink (single edition)
                                  description: "Matches readers who clicked a specific link in one specific edition — the one-click shortcut. Flags: engagementSegments (off for everyone as of this writing)."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [clickedLink]
                                    letterUniqueId:
                                      type: string
                                      description: "The edition's unique identifier."
                                    url:
                                      type: string
                                      description: "The clicked URL."
                                  required:
                                    - type
                                    - letterUniqueId
                                    - url
                                - title: openedEdition (engagement window)
                                  description: "Matches readers whose opens over a recently-published window, or a specific set of editions, meet a threshold — built directly in the segment builder rather than from a single edition's metrics. Flags: segmentBuilderEngagementWindow (off for everyone as of this writing)."
                                  type: object
                                  properties:
                                    channel:
                                      type: string
                                      description: "Channel identifier (slug) the engagement is evaluated against."
                                    type:
                                      type: string
                                      enum: [openedEdition]
                                    mode:
                                      type: string
                                      description: "`recently_published` or `specific_emails`."
                                    numberOfEmails:
                                      type: integer
                                      description: "Number of recently-published editions to consider, 1-50. Used only with mode=recently_published."
                                    newsletterIds:
                                      type: array
                                      items:
                                        type: string
                                      description: "Specific edition unique identifiers to consider. Used only with mode=specific_emails."
                                    minimum:
                                      type: integer
                                      description: "Minimum number of matching editions required."
                                    maximum:
                                      type: integer
                                      nullable: true
                                      description: "Optional maximum number of matching editions. Omit for no upper bound."
                                  required:
                                    - type
                                    - channel
                                    - mode
                                    - minimum
                                - title: clickedLink (engagement window)
                                  description: "Matches readers whose clicks over a recently-published window, or a specific set of editions, meet a threshold. Flags: segmentBuilderEngagementWindow (off for everyone as of this writing)."
                                  type: object
                                  properties:
                                    channel:
                                      type: string
                                      description: "Channel identifier (slug) the engagement is evaluated against."
                                    type:
                                      type: string
                                      enum: [clickedLink]
                                    mode:
                                      type: string
                                      description: "`recently_published` or `specific_emails`."
                                    numberOfEmails:
                                      type: integer
                                      description: "Number of recently-published editions to consider, 1-50. Used only with mode=recently_published."
                                    newsletterIds:
                                      type: array
                                      items:
                                        type: string
                                      description: "Specific edition unique identifiers to consider. Used only with mode=specific_emails."
                                    minimum:
                                      type: integer
                                      description: "Minimum number of matching editions required."
                                    maximum:
                                      type: integer
                                      nullable: true
                                      description: "Optional maximum number of matching editions. Omit for no upper bound."
                                    linkUrls:
                                      type: array
                                      items:
                                        type: string
                                      description: "Narrow to these specific link URLs. Omit or leave empty to match a click on any link."
                                  required:
                                    - type
                                    - channel
                                    - mode
                                    - minimum
                                - title: geoRadius
                                  description: "Matches contacts within a radius of a location. Flags: contactGeolocationSegments (off for everyone as of this writing)."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [geoRadius]
                                    latitude:
                                      type: number
                                      description: "Center latitude, -90 to 90."
                                    longitude:
                                      type: number
                                      description: "Center longitude, -180 to 180."
                                    distanceMiles:
                                      type: number
                                      description: "Radius in miles. Must be greater than zero."
                                  required:
                                    - type
                                    - latitude
                                    - longitude
                                    - distanceMiles
                                - title: polledAnswer
                                  description: "Matches readers who chose a specific poll answer, across every edition the poll appeared in. Flags: engagementSegments gates the condition type itself (off for everyone as of this writing); resolving voters from a send through a non-Letterhead ESP additionally needs pollSegmentsAllEsps (also off for everyone as of this writing)."
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum: [polledAnswer]
                                    pollId:
                                      type: integer
                                      description: "The poll's identifier."
                                    optionId:
                                      type: integer
                                      description: "The chosen option's identifier."
                                  required:
                                    - type
                                    - pollId
                                    - optionId
                            suppressionSegmentIds:
                              type: array
                              items:
                                type: integer
                              description: IDs of other segments (same company) whose members are excluded from this
                                segment's audience.
                          description: 'The saved query: `matchMode` (`all`/`any`), `conditions[]`, and
                            `suppressionSegmentIds[]`.'
                        channelSlugs:
                          type: array
                          items:
                            type: string
                          description: Channels the segment is scoped to. An empty array means it is available
                            on every channel.
                        createdAt:
                          type: string
                          description: Creation timestamp.
                        updatedAt:
                          type: string
                          description: Last-updated timestamp.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - id: 5
                    name: Readers over 30
                    description: Contacts whose age custom field is over 30
                    criteria:
                      matchMode: all
                      conditions:
                        - type: customField
                          customFieldKey: age
                          operator: '>'
                          value: '30'
                      suppressionSegmentIds: []
                    channelSlugs:
                      - the-daily
                      - weekend-reads
                      - product-updates
                    createdAt: '2026-05-20 17:48:15'
                    updatedAt: '2026-05-20 17:48:15'
                  - id: 7
                    name: Highly engaged readers
                    description: Opened at least one letter in the last 30 days
                    criteria:
                      matchMode: any
                      conditions:
                        - type: tag
                          operator: has
                          value: engaged-readers
                      suppressionSegmentIds:
                        - 12
                    channelSlugs:
                      - the-daily
                    createdAt: '2026-06-01 09:14:02'
                    updatedAt: '2026-06-11 16:30:47'
                message: Segments retrieved.
                total: 2
