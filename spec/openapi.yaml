                          type: string
                          nullable: true
                        recordsTotal:
                          type: integer
                        recordsProcessed:
                          type: integer
                        recordsAdded:
                          type: integer
                        recordsUpdated:
                          type: integer
                        recordsFailed:
                          type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
