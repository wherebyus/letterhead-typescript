  /api/v3/letters/{letterUuid}/clone:
    post:
      tags:
        - Letters
      summary: Clone a letter
      description: |-
        Duplicate a letter (or template), producing a new letter with a fresh unique identifier and no
        publication history. Blocks and settings are copied from the source.

        **What is the letter's unique identifier?** An alphanumeric string, often around ten characters, e.g. `ludctamgd6`.

        Omit `channelId` to clone the letter in place — onto its own channel, or staying at company level
        if the source is a template. `channelId` addresses a channel by its internal numeric identifier
        rather than its slug, so most integrations should leave it out and clone in place rather than try
        to move the clone to a different channel.
      operationId: cloneALetter
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channelId:
                  type: integer
                  description: (optional) Internal numeric identifier of the destination channel. Omit
                    (or pass `0`) to clone in place — see the description above.
                title:
                  type: string
                  description: (optional) Title for the clone. Defaults to the source letter's own title.
                status:
                  type: integer
                  description: (optional) Publication status to give the clone. Defaults to the source
                    letter's own status.
                useChannelSettings:
                  type: boolean
                  description: (optional) Whether the clone should pick up its destination channel's default
                    settings rather than copying the source letter's settings. Defaults to `true`.
            example: {}
      responses:
        '201':
          description: Letter cloned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: >-
                      The new, cloned letter. Shown here are the fields most integrators use — the full
                      letter object carries many more.
                    properties:
                      uniqueId:
                        type: string
                      title:
                        type: string
                      subtitle:
                        type: string
                      publicationStatus:
                        type: integer
                      channelSlug:
                        type: string
                        nullable: true
                      channelName:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: 7hqk1z0mwe
                  title: This week's edition
                  subtitle: Everything you need to know
                  publicationStatus: 3
                  channelSlug: null
                  channelName: null
                  createdAt: '2026-08-31 09:20:00'
                  updatedAt: '2026-08-31 09:20:00'
                message: Company letter cloned.
                total: 10
  /api/v3/letters/{letterUuid}/settings:
    post:
      tags:
        - Letters
      summary: Update a letter's design settings
      description: |-
        Update a letter's design settings — colors, fonts, spacing, buttons, links, and whether the letter
        follows its channel's defaults for each of those, field by field. This is the narrower alternative
        `updateALetter` points to when you only need to change styling rather than round-tripping the whole
        letter.

        The request body is the full settings object; like `updateALetter`, this replaces the settings
        wholesale rather than merging individual fields — fetch the letter first with _Retrieve a Letter by
        its UUID_ (its `settings` field) if you're changing only part of it.
      operationId: updateALettersSettings
      parameters:
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                The letter's design settings — colors, fonts, spacing, buttons, links, images, and per-field
                `useChannelSettings` flags for whether that field follows the channel default instead. Shown
                here are representative fields; the object carries many more.
              properties:
                backgroundColor:
                  type: string
                textColor:
                  type: string
                linkColor:
                  type: string
                buttonColor:
                  type: string
                buttonTextColor:
                  type: string
                maxWidthDesktop:
                  type: string
                useChannelSettings:
                  type: object
                  description: One boolean per styleable field on this settings object — `backgroundColor`,
                    `buttonColor`, `linkColor`, and more not shown here — controlling whether that field
                    follows the channel's default instead of the value set above. Shown here are
                    representative keys; every key in the object, not just these three, is required.
                  properties:
                    backgroundColor:
                      type: boolean
                    buttonColor:
                      type: boolean
                    linkColor:
                      type: boolean
                  required:
                    - backgroundColor
                    - buttonColor
                    - linkColor
              required:
                - useChannelSettings
            example:
              backgroundColor: '#FFFFFF'
              textColor: '#222222'
              linkColor: '#1A73E8'
              buttonColor: '#1A73E8'
              buttonTextColor: '#FFFFFF'
              maxWidthDesktop: '640px'
              useChannelSettings:
                backgroundColor: false
                buttonColor: false
                linkColor: false
      responses:
        '200':
          description: Settings updated
  /api/v3/letters/{letterUuid}/permissions:
    post:
      tags:
        - Letters
      summary: Update a letter's permissions
      description: |-
        Update which editing actions are allowed on a letter — adding blocks, cloning, deleting, and
        reordering (moving) blocks. This is the narrower alternative `updateALetter` points to when you
        only need to change permissions rather than round-tripping the whole letter.
      operationId: updateALettersPermissions
      parameters:
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowAdd:
                  type: boolean
                  description: (optional) Whether new blocks can be added to the letter.
                allowClone:
                  type: boolean
                allowDelete:
                  type: boolean
                allowMove:
                  type: boolean
                  description: (optional) Whether existing blocks can be reordered.
              required:
                - allowClone
                - allowDelete
            example:
              allowAdd: true
              allowClone: true
              allowDelete: false
              allowMove: true
      responses:
        '200':
          description: Permissions updated
  /api/v3/letters/{letterUuid}/update-status:
    post:
      tags:
        - Letters
      summary: Update a letter's publication status
      description: |-
        Change a letter's publication status. This is the narrower alternative `updateALetter` points to
        when you only need to move a letter between statuses rather than round-tripping the whole letter.

        Scheduling and sending a letter to go out are **not** done through this endpoint — use the
        send/schedule endpoints for that. `publicationStatus` here is restricted to the template-lifecycle
        statuses: `3` (template), `8` (configuring), or `9` (configured).
      operationId: updateALettersStatus
      parameters:
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicationStatus:
                  type: integer
                  description: One of `3` (template), `8` (configuring), `9` (configured).
              required:
                - publicationStatus
            example:
              publicationStatus: 9
      responses:
        '202':
          description: Letter status updated
          content:
            application/json:
              schema:
                type: string
              example: Letter status updated.
  /api/v3/letters/{letterUuid}/tags:
    post:
      tags:
        - Letters
      summary: Update a letter's tags
      description: |-
        Replace the full set of newsletter tags applied to a letter. This is the narrower alternative
        `updateALetter` points to when you only need to change tags rather than round-tripping the whole
        letter.

        This is a full replace: pass every tag name the letter should carry, including ones you're keeping.
        Send an empty array to clear all tags. Tag names not already in the company's tag catalog are
        created as new tags.
      operationId: updateALettersTags
      parameters:
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: The full list of tag names this letter should carry. Send `[]` to clear all
                    tags.
              required:
                - tags
            example:
              tags:
                - movies
                - weekend-picks
      responses:
        '204':
          description: Tags updated
  /api/v3/letters/{letterUuid}/claim:
    post:
      tags:
        - Letters
      summary: Claim a letter for editing
      description: |-
        Claim a letter for editing so other editors are warned it's in use. `claimant` is a JSON-encoded
        string identifying who's claiming it — it must decode to an object carrying at minimum a
        `uniqueId` field identifying the claiming editor.

        If the letter is already claimed by someone else, the claim fails and the response names the
        current claimant.
      operationId: claimALetter
      parameters:
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claimant:
                  type: string
                  description: A JSON-encoded object that must include a `uniqueId` field, e.g.
                    `'{"uniqueId":"user-abc123","name":"Jane Doe"}'`.
              required:
                - claimant
            example:
              claimant: '{"uniqueId":"user-abc123","name":"Jane Doe"}'
      responses:
        '202':
          description: Claim succeeded
          content:
            application/json:
              schema:
                type: string
              example: This letter's all yours. Enjoy.
        '400':
          description: The `claimant` value is malformed — it didn't decode to an object with a `uniqueId`.
        '500':
          description: The letter is already claimed by someone else. The response body names the current
            claimant.
  /api/v3/letters/{letterUuid}/links:
    get:
      tags:
        - Letters
      summary: List a letter's links
      description: |-
        Return the distinct links found in this letter, read from Letterhead's link enrichment pipeline —
        each with its `urlMd5`, resolved `url`, and `title`. Every link in the newsletter is included, not
        only ones that have recorded clicks — for links that readers have actually clicked, see
        `listALettersClickedLinks` instead.

        Returns an empty list if the link enrichment pipeline hasn't crawled this letter yet.
      operationId: listALettersLinks
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      responses:
        '200':
          description: Links retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        urlMd5:
                          type: string
                        url:
                          type: string
                        title:
                          type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - urlMd5: 5d41402abc4b2a76b9719d911017c592
                    url: https://www.nytimes.com/interactive/2025/movies/best-movies-21st-century.html
                    title: The 100 Best Movies of the 21st Century
                message: Newsletter links retrieved.
                total: 1
  /api/v3/letters/{letterUuid}/click-links:
    get:
      tags:
        - Letters
      summary: List a letter's clicked links
      description: |-
        Return the distinct link URLs that at least one reader has clicked on in this letter. Unlike
        `listALettersLinks` (every link the newsletter contains), this only includes links with recorded
        click activity.
      operationId: listALettersClickedLinks
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      responses:
        '200':
          description: Clicked link URLs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - https://www.nytimes.com/interactive/2025/movies/best-movies-21st-century.html
                message: ''
                total: 1
  /api/v3/letters/tags:
    get:
      tags:
        - Letters
      summary: List newsletter tags
      description: |-
        List the tags available for organizing newsletters — the same tags shown on a letter's `tags`
        field and in the composer's tag picker.

        Pass `scope` to control which tags come back:

        - Omit `scope` to get the tags currently applied to letters across your company (or one channel,
          with `channelSlug`). This default mode mirrors each tag as a taxonomy term and includes some
          internal fields alongside `uniqueId` and `name`.
        - `channel` — tags scoped to a single channel (pass `channelSlug`).
        - `company` — tags scoped to the whole company, not tied to any one channel.
        - `picker` — every tag available to assign, company- and channel-scoped together — the same list
          the composer's tag picker uses.

        With `scope` supplied, each tag comes back in the same compact shape as **Create a newsletter
        tag** — `{uniqueId, name, channelId}` — where `channelId` identifies whether the tag is scoped to
        a specific channel or to the company as a whole.
      operationId: listNewsletterTags
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
        - name: channelSlug
          in: query
          description: (optional) Restrict results to tags on a specific channel.
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          description: (optional) Free-text search across tag names.
          required: false
          schema:
            type: string
        - name: scope
          in: query
          description: (optional) One of `channel`, `company`, or `picker` — see the description above.
            Omit for the default "tags currently applied" list.
          required: false
          schema:
            type: string
            enum:
              - channel
              - company
              - picker
      responses:
        '200':
          description: List newsletter tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: >-
                        A tag. Shown here are the fields common to both response shapes — the default
                        (no `scope`) response also includes a few internal taxonomy fields (`id`,
                        `taxonomyId`, `parentTermId`, `createdAt`, `updatedAt`).
                      properties:
                        uniqueId:
                          type: string
                        name:
                          type: string
                        channelId:
                          type: integer
                          description: Present when `scope` is supplied — see the description above.
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - uniqueId: t4kq9x2mle
                    name: Product updates
                    channelId: 999999999
                  - uniqueId: b7pz3y1ork
                    name: Community spotlight
                    channelId: 54212
                message: ''
                total: 2
    post:
      tags:
        - Letters
      summary: Create a newsletter tag
      description: |-
        Create a newsletter tag, scoped either to the whole company or to one channel.

        Pass `channelId` to scope the new tag to that channel; omit it (or pass `0`) to create a
        company-wide tag instead. `channelId` addresses a channel by its internal numeric identifier
        rather than its slug.
      operationId: createANewsletterTag
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The tag's name (max 60 characters).
                channelId:
                  type: integer
                  description: (optional) Internal numeric identifier of the channel to scope this tag to.
                    Omit (or pass `0`) for a company-wide tag.
            example:
              name: Product updates
      responses:
        '201':
          description: Newsletter tag created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                      name:
                        type: string
                      channelId:
                        type: integer
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: t4kq9x2mle
                  name: Product updates
                  channelId: 999999999
                message: ''
                total: 10
  /api/v3/letters/tags/{uniqueId}:
    parameters:
      - name: uniqueId
        in: path
        required: true
        description: The tag's unique identifier, from **List newsletter tags** or **Create a newsletter tag**.
        schema:
          type: string
    patch:
      tags:
        - Letters
      summary: Rename a newsletter tag
      description: |-
        Rename a newsletter tag in place. Letters that already had the tag applied keep it — only its
        display name changes.
      operationId: renameANewsletterTag
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The tag's new name (max 60 characters).
            example:
              name: Product announcements
      responses:
        '200':
          description: Newsletter tag renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                      name:
                        type: string
                      channelId:
                        type: integer
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: t4kq9x2mle
                  name: Product announcements
                  channelId: 999999999
                message: ''
                total: 10
    delete:
      tags:
        - Letters
      summary: Delete a newsletter tag
      description: |-
        Delete a newsletter tag and remove it from every letter in the company that had it applied.
      operationId: deleteANewsletterTag
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Newsletter tag deleted
  /api/v3/curations:
    post:
      tags:
        - Curations
      summary: Curate or update content
      description: |-
        Create a curation for any channel within the company. Note that the `v3` api requires a key generated from within the company-level settings, which are available only to folks with that given plan.

        This endpoint always creates (or updates) a single, company-level curation — `channels` does not create a separate copy per channel here, it only controls which channels can see and use it. Resubmitting the same `url` (matched together with its type and, if it came from a feed, the feed it came from) updates that existing curation rather than creating a new one. If that resubmission includes `channels`, the list you pass replaces which channels the curation is shared with; if it leaves `channels` out, the existing sharing is kept as it was. The bulk endpoint below behaves differently: there, `channels` creates one separate curation per channel.

        `channels` accepts any number of channel identifiers. When you first curate a `url`, you can also omit it entirely, which shares the new curation with every channel in the company instead of restricting it to specific ones. Omitting it on a later resubmission does not widen an existing curation back to every channel.

        This endpoint persists exactly the fields you supply — it does not crawl `url` for Open Graph data on your behalf. If you omit `title`, `excerpt`, `image`, or the other content fields, the curation is saved without them; fetch and pass those values yourself if you want them populated.
      operationId: curateOrUpdateContent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: Set to `true` to authenticate with your company API key rather than a signed-in
                    session.
                  example: 'true'
                url:
                  type: string
                  description: URL of the content being curated. Saved as provided — this endpoint does
                    not fetch or crawl the URL for Open Graph data.
                  example: https://letterhead.ai
                channels[]:
                  type: string
                  description: '`string[]` | An array of channel identifiers (or channel "slugs") across
                    which to create a curation. Optional — on a new curation, omit it to share the curation
                    with every channel in the company; on a resubmission, omitting it keeps the existing
                    sharing, and passing it replaces that sharing.'
                  example: letterhead-example-newsletter
                content:
                  type: string
                  description: '`html` content for the curation, only `p` and formatting elements are
                    allowed.'
                excerpt:
                  type: string
                  description: Plain text excerpt of the curated content. Saved as provided — this endpoint
                    does not fetch or crawl the URL for one.
                image:
                  type: string
                  description: The URL of a featured image to associate with this piece of content.
                siteName:
                  type: string
                  description: The name of the site the curated content originated from.
                publicationDate:
                  type: string
                  description: The `Y-md H:i:s` formatted date of publication.
                tags:
                  type: string
                  description: '`string[]` | An optional array of `string` tags with which to associate
                    this piece of content. Example: `[''dogs'', ''canines'']`'
                title:
                  type: string
                  description: Title of the curated content. Saved as provided — this endpoint does not
                    fetch or crawl the URL for one.
              required:
                - api
                - url
      responses:
        '201':
          description: Curation created (or updated, if a curation for the same `url` already existed).
    get:
      tags:
        - Curations
      summary: List curations
      description: |-
        Returns a paginated, filterable list of the company's curations — every piece of content saved
        across all of the company's channels, not scoped to one.

        **Query parameters**

        - `page` (default `1`), `perPage` (default `10`, max `100`).
        - `keyword` — search across the curation's title, excerpt, and content.
        - `status` — `1` for curated (used in a newsletter), `0` for not yet curated; omit for both.
        - `dateStart` / `dateEnd` — filter by publication date.
        - `feeds[]` — filter to curations sourced from specific feed unique IDs (see **List curation
          feeds** and **List data feeds**).
        - `sources[]` — filter to curations from specific site names (see **List curation sources**).
        - `tags[]` — filter to curations carrying any of these tags.
        - `excludeTags[]` — exclude curations carrying any of these tags.
        - `iabCategories[]` — filter to curations classified under any of these IAB categories.
        - `type[]` — filter by curation type (see the `type` field below).

        Results are sorted by publication date, newest first.
      operationId: listCurations
      parameters:
        - name: api
          in: query
          description: Required. Set to `true` to authenticate with your company API key rather than
            a signed-in session.
          required: true
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: perPage
          in: query
          schema:
            type: integer
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
        - name: dateStart
          in: query
          schema:
            type: string
        - name: dateEnd
          in: query
          schema:
            type: string
        - name: feeds[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: sources[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: tags[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: excludeTags[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: iabCategories[]
          in: query
          schema:
            type: array
            items:
              type: string
        - name: type[]
          in: query
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregates:
                    type: array
                    items:
                      type: object
                      properties:
                        uniqueId:
                          type: string
                        title:
                          type: string
                        excerpt:
                          type: string
                        content:
                          type: string
                        author:
                          type: string
                        siteName:
                          type: string
                        originalUrl:
                          type: string
                        image:
                          type: string
                        imageAlt:
                          type: string
                        imageCaption:
                          type: string
                        imageOriginalUrl:
                          type: string
                        publicationDate:
                          type: string
                        dateOfAggregatePublication:
                          type: string
                        curated:
                          type: boolean
                        archived:
                          type: boolean
                        archiveDate:
                          type: string
                          nullable: true
                        useBy:
                          type: string
                          nullable: true
                        feedUniqueId:
                          type: string
                          nullable: true
                        type:
                          type: integer
                          description: Content type — `0` articles, `1` events, `2` AI-generated, `3`
                            WordPress, `4` RSS, `5` browser extension, `6` Zapier, `7` JSON data feed.
                        isGlobalCuration:
                          type: boolean
                          description: Always `true` — every curation returned by this company-wide
                            endpoint is.
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        deletedAt:
                          type: string
                          nullable: true
                        tags:
                          type: array
                          items:
                            type: string
                        categories:
                          type: array
                          items:
                            type: string
                        customFields:
                          type: object
                          description: Present only when the curation has at least one custom field
                            value set, keyed by the custom field's `key` (see **List curation custom
                            fields**).
                  total:
                    type: integer
              example:
                aggregates:
                  - uniqueId: cur_8x2mle4kq9
                    title: How coffee prices are shaping this year's harvest
                    excerpt: A look at the trends driving bean prices higher.
                    originalUrl: https://example.com/coffee-prices
                    siteName: Example Daily
                    publicationDate: '2026-08-30 09:00:00'
                    curated: true
                    archived: false
                    type: 4
                    isGlobalCuration: true
                    createdAt: '2026-08-30T09:05:00+00:00'
                    updatedAt: '2026-08-30T09:05:00+00:00'
                    tags:
                      - coffee
                      - agriculture
                total: 128
  /api/v3/curations/bulk:
    post:
      tags:
        - Curations
      summary: Curate in bulk
      description: |-
        Create multiple curations for any channel within the company. Note that the `v3` api requires a key generated from within the company-level settings.

        Unlike the single **Curate or update content** endpoint, `channels` here creates a separate curation per channel: list two channels and you get two curations, one on each, matched and updated independently by its own `url` (together with its type and, if it came from a feed, the feed it came from). Omit `channels` on a curation and it's created once as a single company-level curation instead, shared with every channel — the way the single endpoint's omitted `channels` works.

        It accepts the same parameters as the `Curate` endpoint.
      operationId: curateInBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                curations:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                      title:
                        type: string
                      channels:
                        type: array
                        items:
                          type: string
                        description: Optional — list one or more channels to create a separate curation
                          on each. Omit to create a single curation shared with every channel in the
                          company instead.
            example:
              api: true
              curations:
                - url: https://example.com/article-one
                  title: First Article
                  channels:
                    - an-example-channel
                - url: https://example.com/article-two
                  title: Second Article
                  excerpt: A brief summary of the second article.
                  tags:
                    - politics
                    - local
                  overwriteTags: true
                - url: https://example.com/article-three
                  channels:
                    - an-example-channel
      responses:
        '202':
          description: 202 Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
                  total:
                    type: integer
              example:
                message: 3 curations accepted for processing
                status: 202
                total: 4
  /api/v3/curations/discover:
    post:
      tags:
        - Curations
      summary: Discover content (beta)
      description: |-
        Given a subject, Letterhead will try to curate a number of relevant articles to the `channels` you instruct the API. We try to ensure they are relevant and recent, but **please note this API is in beta**, and we can't guarantee that these curations will always hit the mark.

        Note that the `v3` api requires a key generated from within the company-level settings, which are available only to Letterhead customers on a certain plan.

        **Version note**: at present, you can only pass _one_ channel identifier to `channels`. Shortly, you will able to pass multiple, or _none_ - which will represent "all channels."
      operationId: discoverContent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api:
                  type: string
                  description: Set to `true` to authenticate with your company API key rather than a signed-in
                    session.
                  example: 'true'
                channels[]:
                  type: string
                  description: '`string[]` | An array of channel identifiers (or channel "slugs") across
                    which to create a curation.'
                  example: letterhead-example-newsletter
                count:
                  type: string
                  description: The number of articles you want Letterhead to try to curate for you. Minimum
                    1, maximum 10.
                  example: '1'
                subject:
                  type: string
                  description: The subject for Letterhead to search.
                  example: Coffee Bean Growth
              required:
                - api
                - channels[]
                - count
                - subject
      responses:
        '202':
          description: Articles found and queued for curation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  - https://www.reuters.com/sports/nhl/sergei-bobrovsky-panthers-shut-out-kings-2025-01-30/
                  - https://apnews.com/article/1d6c30f9baef4cd7126a4697080a1653
                  - https://www.axios.com/local/miami/2025/06/18/florida-panthers-stanley-cup-win
                message: We found and are curating recent stories for you around Florida Panthers.
                total: 3
        '404':
          description: No relevant articles were found for the subject
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: []
                message: We couldn't find any recent content to curate around Florida Panthers.
                total: 0
  /api/v3/curations/tags:
