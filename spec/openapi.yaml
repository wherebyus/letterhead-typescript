                    type: string
                  total:
                    type: integer
              example:
                items:
                  email: avery.chen@example.com
                  subscriptions:
                    - channel:
                        slug: annas-channel
                        name: Anna's Channel
                      status: 2
                      createdAt: '2026-08-30T15:01:21+00:00'
                      updatedAt: '2026-08-30T15:01:21+00:00'
