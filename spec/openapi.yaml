  /api/v3/letters/{letterUuid}:
    get:
      tags:
        - Letters
      summary: Retrieve a letter
      description: |-
        Retrieve a single letter by its unique identifier, including its fully rendered email HTML.

        Use it to pull back a sent (or draft) letter's content programmatically — most commonly to get the **rendered HTML** of a published edition.

        **What is the letter's unique identifier?** An alphanumeric string, often around ten characters, e.g. `ludctamgd6`. It is returned by the send/draft endpoints.

        **Response.** Returns HTTP `201`, with the letter nested under `items` (alongside `message` and `total`) rather than as a flat top-level object.
      operationId: retrieveALetter
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '201':
          description: Retrieve a letter
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    description: >-
                      The letter object. Shown here are the fields most integrators use — the full
                      letter object carries many more.
                    properties:
                      uniqueId:
                        type: string
                      title:
                        type: string
                      subtitle:
                        type: string
                      emailTemplate:
                        type: string
                      publicationDate:
                        type: string
                      publicationStatus:
                        type: integer
                      segmentName:
                        type: string
                      channelSlug:
                        type: string
                      channelName:
                        type: string
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
                    description: A fixed default for this endpoint — not meaningful for a single-letter response.
              example:
                items:
                  uniqueId: ludctamgd6
                  title: Who doesn't love a good movie?
                  subtitle: A new exhibition, two openings, and a closer look at this season's residency.
                  emailTemplate: <!-- The full, rendered HTML of the edition as sent lives here -->
                  publicationDate: '2026-05-06 05:53:05'
                  publicationStatus: 1
                  segmentName: Entire audience
                  channelSlug: an-example-channel
                  channelName: An Example Channel
                  createdAt: '2026-05-01 19:54:12'
                  updatedAt: '2026-05-06 05:53:05'
                message: Company letter found.
                total: 10
    parameters:
      - name: letterUuid
        in: path
        required: true
        description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
          `ludctamgd6`.
        schema:
          type: string
    post:
      tags:
        - Letters
      summary: Update a letter
      description: |-
        Update a letter (or template) by its unique identifier.

        This is the v3 (company-scoped) full update. It replaces the letter's content and configuration in one call and returns the updated letter.

        **What is the letter's unique identifier?** An alphanumeric string, often around ten characters, e.g. `ludctamgd6`. It is returned by the create/draft/send endpoints.

        ## This is a full replace, not a partial update

        Every writable field is set from the request body. **Any field you omit is reset to its default** (empty string for text fields, default settings for `settings`). Fetch the letter first with _Retrieve a Letter by its UUID_, change what you need, and send the whole object back.

        If you only want to change one thing, prefer the narrower endpoints — they exist precisely so you don't have to round-trip the full payload:

        | Endpoint | Updates |
        | --- | --- |
        | `POST /api/v3/letters/{letterUuid}/settings` | Letter settings |
        | `POST /api/v3/letters/{letterUuid}/permissions` | Permissions only |
        | `POST /api/v3/letters/{letterUuid}/update-status` | Publication status only |
        | `POST /api/v3/letters/{letterUuid}/tags` | Tags |

        ## Required fields

        | Field | Type | Notes |
        | --- | --- | --- |
        | `publicationStatus` | integer | One of `3` (template), `8` (configuring), `9` (configured). Scheduling and sending are **not** done here — use the send/schedule endpoints. |
        | `segmentId` | integer | The audience segment the letter targets. |
        | `includePromotions` | boolean | Must be present, but has no effect on this endpoint — it isn't read anywhere in this update path. Send `true` or `false`; either is accepted. |

        ## Optional fields

        `title`, `subtitle`, `blocks`, `html`, `mjmlTemplate`, `campaignId`, `private`, `publicationDate`, `openGraphHeadline` (max 180), `openGraphDescription` (max 180), `openGraphImageUrl`.

        If `openGraphHeadline` / `openGraphDescription` are omitted they fall back to `title` / `subtitle`.

        ## Responses

        - `200` — the updated letter.

        - `403` — the letter is claimed by another editor (body is the current claimant).

        - `422` — validation failed.
      operationId: updateALetter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicationStatus:
                  type: integer
                segmentId:
                  type: integer
                includePromotions:
                  type: boolean
                  description: Required, but currently has no effect on this endpoint — see the Required
                    fields table above.
                title:
                  type: string
                subtitle:
                  type: string
                blocks:
                  type: string
                openGraphHeadline:
                  type: string
                openGraphDescription:
                  type: string
                openGraphImageUrl:
                  type: string
              required:
                - publicationStatus
                - segmentId
                - includePromotions
            example:
              publicationStatus: 3
              segmentId: 0
              includePromotions: true
              title: This week's edition
              subtitle: Everything you need to know
              blocks: '[]'
              openGraphHeadline: This week's edition
              openGraphDescription: Everything you need to know
              openGraphImageUrl: ''
      responses:
        '200':
          description: Successful response
    delete:
      tags:
        - Letters
      summary: Delete a letter
      description: |-
        Permanently delete a letter (or template) by its unique identifier. The letter is removed from
        every list and can no longer be retrieved, scheduled, or sent.

        If the letter is attached to an Automation Series step, that step is detached so the automation
        keeps running.

        **What is the letter's unique identifier?** An alphanumeric string, often around ten characters, e.g. `ludctamgd6`.
      operationId: deleteALetter
      parameters:
        - name: api
          in: query
          description: When `true`, tells the endpoint you are authenticating with a company API key (the
            key you generate under a company's administrative settings) rather than a logged-in user session.
            For API integrations you will almost always set this to `true`.
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Letter deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: string
                    nullable: true
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items: null
                message: Company letter ludctamgd6 has been deleted.
                total: 0
  /api/v3/letters/{letterUuid}/actions/draft:
    post:
      tags:
        - Letters
      summary: Create a draft from a template
      description: |-
        Create a draft edition from a newsletter template: `letterUuid` in the path identifies the
        **template** to draft from, not the resulting letter. Persists any `curations` you pass and hydrates
        them onto the template's targetable blocks, then returns the new draft letter with its rendered
        email content.

        The draft is created in draft status — nothing is sent or scheduled by this call. Use
        `sendALetterFromATemplate` to send a letter from a template directly instead.
      operationId: createADraftFromATemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: This is a little silly, but you need to inform the API endpoint that you
                    are interfacing with it as a RESTful API user.
                channel:
                  type: string
                subject:
                  type: string
                subtitle:
                  type: string
                  description: (optional) Override the template's subtitle (email preview text) for this
                    draft edition. Max 191 chars. Omit or send null to keep the template's existing subtitle.
                suppress:
                  type: array
                  items:
                    type: string
                  description: (optional) An array of channel identifiers (slugs), to suppress sending
                    to anyone on "an-example-channel" who is also subscribed to one or more of the channels
                    passed here.
                curations:
                  type: array
                  items:
                    type: object
                    properties:
                      excerpt:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      title:
                        type: string
                      url:
                        type: string
            example:
              api: true
              channel: an-example-channel
              subject: Who doesn't love a good movie?
              subtitle: A new exhibition, two openings, and a closer look at this season's residency.
              suppress:
                - some-other-channel
              curations:
                - excerpt: Pan's Labyrinth should be number one, we think.
                  tags:
                    - pans-labyrinth
                  title: The 100 Best Movies of the 21st Century
                  url: https://www.nytimes.com/interactive/2025/movies/best-movies-21st-century.html
      responses:
        '201':
          description: Create a draft from a template
    parameters:
      - name: letterUuid
        in: path
        required: true
        description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
          `ludctamgd6`.
        schema:
          type: string
  /api/v3/letters/{letterUuid}/actions/send:
    post:
      tags:
        - Letters
      summary: Send a letter from a template
      description: |-
        Create and send a new edition from a newsletter template in one call: `letterUuid` in the path
        identifies the **template** to send from, not the resulting letter. Persists any `curations` you
        pass and hydrates them onto the template's targetable blocks before the send is scheduled.

        `segment` is the integer identifier of the target audience segment — either all of your target
        channel's subscribers, or a subset. Use `suppress` to hold back anyone who is also subscribed to
        the listed channels, to avoid sending the same content to a reader twice across newsletters.

        To create a draft from a template without sending, use `createADraftFromATemplate` instead.
      operationId: sendALetterFromATemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                channel:
                  type: string
                segment:
                  type: integer
                  description: The integer identifier of your target segment, which is either all or a
                    subset of your target channel.
                subject:
                  type: string
                subtitle:
                  type: string
                  description: (optional) Override the template's subtitle (email preview text) for this
                    send only. Max 191 chars. Omit or send null to keep the template's existing subtitle.
                suppress:
                  type: array
                  items:
                    type: string
                  description: (optional) An array of channel identifiers (slugs), to suppress sending
                    to anyone on "an-example-channel" who is also subscribed to one or more of the channels
                    passed here.
                curations:
                  type: array
                  items:
                    type: object
                    properties:
                      excerpt:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      title:
                        type: string
                      url:
                        type: string
                  description: (optional) An array of Curations.
            example:
              api: true
              channel: an-example-channel
              segment: 0
              subject: Who doesn't love a good movie?
              subtitle: A new exhibition, two openings, and a closer look at this season's residency.
              suppress:
                - some-other-channel
              curations:
                - excerpt: Pan's Labyrinth should be number one, we think.
                  tags:
                    - pans-labyrinth
                  title: The 100 Best Movies of the 21st Century
                  url: https://www.nytimes.com/interactive/2025/movies/best-movies-21st-century.html
      responses:
        '200':
          description: Successful response
    parameters:
      - name: letterUuid
        in: path
        required: true
        description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
          `ludctamgd6`.
        schema:
          type: string
  /api/v3/letters/{letterUuid}/actions/send-now:
    post:
      tags:
        - Letters
      summary: Send a letter immediately
      description: |-
        Send an already-drafted letter right away: its publication date is stamped at the current instant
        and the send is queued directly, bypassing the normal scheduling lead time. Use this when you want
        the letter to go out as soon as the request succeeds, rather than at a scheduled time.

        A/B test letters are rejected — send those through the normal scheduling flow instead.
      operationId: sendALetterImmediately
      parameters:
        - name: letterUuid
          in: path
          required: true
          description: The letter's unique identifier — an alphanumeric string around ten characters, e.g.
            `ludctamgd6`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api:
                  type: boolean
                  description: Required. Set to `true` to authenticate with an API key.
                channel:
                  type: string
                  description: The channel's slug.
                segment:
                  type: integer
                  description: The integer identifier of your target segment, which is either all or a
                    subset of your target channel.
                subject:
                  type: string
                  description: (optional) Override the letter's subject line for this send.
              required:
                - api
                - channel
                - segment
            example:
              api: true
              channel: an-example-channel
              segment: 0
              subject: Who doesn't love a good movie?
      responses:
        '200':
          description: The letter is being sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    properties:
                      uniqueId:
                        type: string
                      publicationDate:
                        type: string
                  message:
                    type: string
                  total:
                    type: integer
              example:
                items:
                  uniqueId: ludctamgd6
                  publicationDate: '2026-05-06 05:53:05'
                message: Your letter is being sent now.
                total: 0
