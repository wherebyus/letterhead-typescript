name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    # Draft PRs are reviewed before they are built, as in the other Letterhead repos.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated types match the committed spec
        run: npm run check:generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built package loads through import and require
        run: npm run test:dist
