name: Spec sync

# Keeps the SDK in step with the published API description. Every day (and on demand) it fetches the spec, and when
# it changed, regenerates the types and methods, runs the same checks CI runs, and opens a pull request. A person
# merges it and releases (bump `version`, push a `vX.Y.Z` tag, as in CONTRIBUTING.md).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the published spec
        run: npm run spec:pull
      - name: Anything changed?
        id: changed
        run: |
          if git diff --quiet -- spec/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate and check
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm run generate
          npm run typecheck
          npm test
          npm run build
          npm run test:dist
      - name: Open a pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="spec-sync/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add spec src/generated
          git commit -m "feat(sdk): pick up API changes from the published spec"
          git push --force-with-lease origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "feat(sdk): pick up API changes from the published spec" \
              --body "The published API description changed. This regenerates the types and methods from it; the workflow already ran typecheck, tests, build and the package smoke test. Pull requests opened by a workflow do not start CI on their own, so close and reopen this one to run it before merging."
          fi
