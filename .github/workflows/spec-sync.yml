name: Spec sync

# Keeps the SDK in step with the published API description. Every day (and on demand) it fetches the spec, and when
# it changed, regenerates the types and methods, runs the same checks CI runs, and opens a pull request. A person
# merges it and releases (bump `version`, push a `vX.Y.Z` tag, as in CONTRIBUTING.md).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# One run at a time; a manual run waits for the scheduled one instead of racing it.
concurrency:
  group: spec-sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The write token is not left on disk while dependencies and the generator run; only the last step gets it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the published spec
        run: npm run spec:pull
      - name: Anything changed?
        id: changed
        run: |
          if git diff --quiet -- spec/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate and check
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm run generate
          npm run typecheck
          npm test
          npm run build
          npm run test:dist
          npm run build:cli
          npm run test:cli-dist
      - name: Open or update the pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # One fixed branch, written only by this workflow, so an unmerged pull request is updated rather than
          # joined by a new one every day.
          branch="spec-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add spec src/generated
          git commit -m "feat(sdk): pick up API changes from the published spec"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "feat(sdk): pick up API changes from the published spec" \
              --body "The published API description changed. This regenerates the SDK's types and methods and the CLI's commands from it; the workflow already ran typecheck, tests, both builds and their smoke tests. Release both packages after merging. Pull requests opened by a workflow do not start CI on their own, so close and reopen this one to run it before merging."
          fi
      - name: Close a pull request the spec no longer needs
        if: steps.changed.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh pr list --head spec-sync --state open --json number --jq '.[].number'); do
            gh pr close "$number" --comment "The published spec now matches main, so there is nothing to sync."
          done
