name: Publish

# Publishes @tryletterhead/sdk to npm when a version tag (v0.1.0, ...) is pushed.
# Authenticates with npm Trusted Publishing (GitHub OIDC): npm trusts this repo's publish.yml, so no
# token or secret is involved, and provenance is attached automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ (needed for Trusted Publishing)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check:generated
      - run: npm publish --provenance --access public
